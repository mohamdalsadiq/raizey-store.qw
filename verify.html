<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="assets/js/pages/verify.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">




<meta name="theme-color" content="#092A91" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#061A5C" media="(prefers-color-scheme: dark)">






<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الحساب — MEEM STORE</title>
<meta name="description" content="أكّد بريدك الإلكتروني بكود من 6 أرقام لتفعيل حسابك في MEEM STORE.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="icon" sizes="any" href="assets/img/favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="assets/img/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon-180.png">


<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">









<!-- MEEM UI system (tokens + components + icons + behaviour) -->
<link rel="stylesheet" href="assets/css/meem.css?v=20261020">
<script src="assets/js/meem-ui.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img class="brand-lockup" src="assets/img/meem-lockup-200.png"
        srcset="assets/img/meem-lockup-200.png 1x, assets/img/meem-lockup-400.png 2x"
        alt="MEEM STORE" width="304" height="200" decoding="async">
    </div>

    <div class="step-badge">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg>
      تأكيد البريد الإلكتروني
    </div>

    <h1 class="auth-title">أدخل كود التفعيل</h1>
    <p class="auth-sub" id="subText">أرسلنا كودًا من 6 أرقام إلى بريدك</p>

    <form id="verifyForm" novalidate>
      <div class="otp-inputs" id="otpBox" dir="ltr">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" autocomplete="one-time-code">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
      </div>

      <div class="form-error" id="formError" role="alert"></div>
      <div class="form-success" id="formSuccess"></div>

      <button type="submit" class="auth-btn" id="submitBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span>تأكيد الحساب</span>
      </button>
    </form>

    <div class="resend-row">
      <span>ما وصلك الكود؟</span>
      <button id="resendBtn" type="button" class="resend-btn" data-idle-label="إعادة إرسال الكود">إعادة إرسال الكود</button>
      <span class="timer" id="resendTimer"></span>
    </div>

    <p class="auth-switch"><a href="register.html">تغيير البريد الإلكتروني</a></p>
  </div>
</div>

<script src="assets/vendor/supabase-2.118.0.min.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mfa-guard.js"></script>
<script src="assets/js/auth-ui.js"></script>
<script src="assets/js/pages/verify-2.js"></script>
</body>
</html>
