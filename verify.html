<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="https://js.sentry-cdn.com/b654a99332aedb9fbaf8e802ca53e55b.min.js" crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الحساب — RAIZEY STORE</title>
<meta name="description" content="أكّد بريدك الإلكتروني بكود من 6 أرقام لتفعيل حسابك في RAIZEY STORE.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark"><img src="assets/img/raizey-logo-mark.svg" alt="شعار RAIZEY STORE"></span>
      <span class="brand-text">RAIZEY <em>STORE</em></span>
    </div>

    <div class="step-badge">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg>
      تأكيد البريد الإلكتروني
    </div>

    <h1 class="auth-title">أدخل كود التفعيل</h1>
    <p class="auth-sub" id="subText">أرسلنا كودًا من 6 أرقام إلى بريدك</p>

    <form id="verifyForm" novalidate>
      <div class="otp-inputs" id="otpBox" dir="ltr">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" autocomplete="one-time-code">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
      </div>

      <div class="form-error" id="formError"></div>
      <div class="form-success" id="formSuccess"></div>

      <button type="submit" class="auth-btn" id="submitBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span>تأكيد الحساب</span>
      </button>
    </form>

    <div class="resend-row">
      <span>ما وصلك الكود؟</span>
      <button id="resendBtn" type="button" class="resend-btn" data-idle-label="إعادة إرسال الكود">إعادة إرسال الكود</button>
      <span class="timer" id="resendTimer"></span>
    </div>

    <p class="auth-switch"><a href="register.html">تغيير البريد الإلكتروني</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-ui.js"></script>
<script>
const UI = window.RaizeyAuthUI;
const email = sessionStorage.getItem('pending_email');
if (!email) window.location.href = 'register.html';

document.getElementById('subText').innerHTML =
  'أرسلنا كودًا من 6 أرقام إلى <strong dir="ltr">' + email + '</strong>';

const errorBox = document.getElementById('formError');
const successBox = document.getElementById('formSuccess');
const submitBtn = document.getElementById('submitBtn');
const resendBtn = document.getElementById('resendBtn');
const form = document.getElementById('verifyForm');

const otp = UI.bindOtpInputs(document.getElementById('otpBox'), () => form.requestSubmit());
const timer = UI.createResendTimer(resendBtn, document.getElementById('resendTimer'), 60);
otp.focus();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.textContent = '';
  const code = otp.value();

  if (code.length !== 6) {
    errorBox.textContent = 'أدخل الكود كاملاً (6 أرقام)';
    return;
  }

  UI.setLoading(submitBtn, true, 'جارِ التحقق...');

  try {
    const { error } = await supabaseClient.auth.verifyOtp({ email, token: code, type: 'signup' });

    if (error) {
      errorBox.textContent = error.status === 429
        ? 'محاولات كثيرة، حاول مرة أخرى بعد قليل'
        : 'الكود غير صحيح أو منتهي الصلاحية';
      otp.clear();
      return;
    }

    sessionStorage.removeItem('pending_email');
    successBox.textContent = 'تم تفعيل حسابك بنجاح، جارِ فتح المتجر...';
    setTimeout(() => { window.location.href = 'index.html'; }, 700);
  } catch (_) {
    errorBox.textContent = 'تعذر التحقق الآن، حاول مرة أخرى';
  } finally {
    UI.setLoading(submitBtn, false);
  }
});

resendBtn.addEventListener('click', async () => {
  successBox.textContent = '';
  errorBox.textContent = '';
  timer.start(60);

  try {
    const { error } = await supabaseClient.auth.resend({ type: 'signup', email });
    if (error) {
      errorBox.textContent = 'تعذرت إعادة الإرسال، حاول بعد قليل';
    } else {
      successBox.textContent = 'إذا كان الحساب بانتظار التحقق، فسيصلك كود جديد';
    }
  } catch (_) {
    errorBox.textContent = 'تعذرت إعادة الإرسال، حاول بعد قليل';
  }
});
</script>
</body>
</html>
