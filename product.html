<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تفاصيل المنتج — RAIZEY STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">

<style>
  :root {
    --bg-main: #ffffff;
    --bg-card: #f5f1ea;
    --accent-gold: #ff6a1a;
    --border-color: #e8e1d6;
    --text-light: #1a1d29;
    --text-muted: #7a7468;
    --danger: #e5484d;
  }

  body {
    background-color: var(--bg-main) !important;
    color: var(--text-light) !important;
    font-family:var(--font-display);
  }

  .product-page {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    box-sizing: border-box;
  }

  .product-header-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 0 4px;
  }
  
  .back-link {
    color: var(--text-light);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    transition: color 0.2s;
  }
  .back-link:hover {
    color: var(--accent-gold);
  }

  .cart-badge-link {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    padding: 8px 14px;
    border-radius: 20px;
    color: var(--text-light);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: 0.2s;
  }
  .cart-badge-link:hover {
    border-color: var(--accent-gold);
    box-shadow: 0 0 10px rgba(255, 106, 26, 0.1);
  }
  .cart-badge-link i {
    color: var(--accent-gold);
    font-size: 14px;
  }
  .cart-badge-link span {
    background: var(--accent-gold);
    color: #1a1d29;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 800;
  }

  .product-hero {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  }
  .product-hero-thumb {
    width: 90px;
    height: 90px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .product-hero-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .product-hero-info h1 {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 8px 0;
    color: var(--text-light);
  }
  .product-hero-price {
    font-size: 22px;
    font-weight: 900;
    color: var(--accent-gold);
    transition: all 0.2s ease;
  }

  /* تنسيق الباقة الأساسية (المستوى الأول - إجباري لو كان فيه شرطة في الاسم) */
  .main-category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .main-cat-btn {
    background: var(--bg-card);
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    font-weight: 800;
    color: var(--ink);
    font-size: 14px;
    min-height: 50px;
  }
  .main-cat-btn:hover { border-color: rgba(255, 106, 26, 0.4); }
  .main-cat-btn.selected {
    border-color: var(--accent-gold);
    background: rgba(255, 106, 26, 0.05);
    box-shadow: 0 0 10px rgba(255, 106, 26, 0.1);
  }

  /* تنسيق الخيارات الفرعية (المستوى الثاني) */
  .sub-options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
    display: none; /* مخفي افتراضياً */
  }
  .sub-options-grid.visible { display: grid; }

  .option-card {
    background: var(--bg-card);
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    user-select: none;
    text-align: center;
    min-height: 60px;
  }
  .option-card:hover { border-color: rgba(255, 106, 26, 0.4); }
  .option-card.selected {
    border-color: var(--accent-gold);
    background: rgba(255, 106, 26, 0.04);
    box-shadow: 0 0 10px rgba(255, 106, 26, 0.1);
  }
  .option-card .opt-title { font-weight: 800; color: var(--text-light); margin-bottom: 4px; font-size: 14px; }
  .option-card .opt-price-tag { font-weight: 900; color: var(--accent-gold); font-size: 13px; }
  .option-card .opt-check {
    position: absolute; top: 8px; left: 8px; color: var(--accent-gold); font-size: 12px; display: none;
  }
  .option-card.selected .opt-check { display: block; }

  .selection-shake { animation: optionsShake 0.45s ease; border-radius: 12px; }
  @keyframes optionsShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .options-hint { font-size: 12px; font-weight: 700; color: var(--text-muted); margin: -10px 0 18px 0; }
  .options-hint.error { color: var(--danger); }

  .fixed-price-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
    background: var(--bg-main);
    border-top: 1px solid var(--border-color);
    box-shadow: 0 -6px 20px rgba(0,0,0,0.06);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)) 20px;
    display: flex; align-items: center; justify-content: space-between; box-sizing: border-box;
  }
  .fixed-price-bar .fpb-label { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; }
  .fixed-price-bar .fpb-amount {
    font-size: 20px; font-weight: 900; color: var(--accent-gold); transition: all 0.15s ease;
  }
  .fixed-price-bar .fpb-amount.placeholder { color: var(--text-muted); font-size: 14px; font-weight: 700; }
  .product-page { padding-bottom: 90px; }

  .product-instructions-box { background: var(--bg-card); border: 1px solid var(--border-color); border-right: 4px solid var(--accent-gold); padding: 16px; border-radius: 10px; margin-bottom: 25px; font-size: 14px; line-height: 1.6; color: #1a1d29; white-space: pre-line; }
  .product-instructions-title { color: var(--accent-gold); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 15px; font-weight: 700; }
  .section-label { font-size: 14px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--text-light); margin-bottom: 8px; }
  .field input[type="text"], .field select { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; box-sizing: border-box; color: var(--text-light); font-size: 15px; font-weight: 600; transition: all 0.2s ease; }
  .field input[type="text"]:focus, .field select:focus { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(255, 106, 26, 0.1); outline: none; }
  
  .btn-secondary-cart { width: 100%; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 800; font-family:var(--font-display); cursor: pointer; margin-top: 10px; margin-bottom: 25px; background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; box-sizing: border-box; }
  .btn-secondary-cart:hover { background: rgba(255, 106, 26, 0.04); }
  .btn-secondary-cart:active { transform: scale(0.98); }
  .product-quantity-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:18px 0 12px; padding:12px 14px; border:1px solid var(--border-color); border-radius:12px; background:var(--bg-card); }
  .product-quantity-label { display:inline-flex; align-items:center; gap:7px; color:var(--text-light); font-size:13px; font-weight:800; }
  .product-quantity-label i { color:var(--accent-gold); }
  .product-qty-stepper { display:inline-flex; align-items:center; gap:12px; }
  .product-qty-stepper button { width:34px; height:34px; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--accent-gold); border-radius:9px; background:transparent; color:var(--accent-gold); font-size:20px; font-weight:900; line-height:1; transition:transform .15s ease, background .15s ease, opacity .15s ease; }
  .product-qty-stepper button:hover:not(:disabled), .product-qty-stepper button:focus-visible:not(:disabled) { background:rgba(255,106,26,.08); outline:3px solid rgba(255,106,26,.14); outline-offset:1px; }
  .product-qty-stepper button:active:not(:disabled) { transform:scale(.92); }
  .product-qty-stepper button:disabled { border-color:var(--border-color); color:var(--text-muted); opacity:.45; cursor:not-allowed; }
  .product-qty-value { min-width:24px; color:var(--text-light); font-family:var(--font-mono); font-size:16px; font-weight:900; text-align:center; }
  .product-summary-box { margin:12px 0 14px; }
  .product-confirm-btn { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px; }
  .product-checkout-hint { display:flex; align-items:flex-start; gap:6px; margin:0 0 24px; color:var(--text-muted); font-size:11px; line-height:1.7; text-align:center; justify-content:center; }
  .product-checkout-hint i { color:var(--accent-gold); margin-top:3px; }
  
  .payment-option { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s ease; }
  .payment-option:hover { border-color: rgba(255, 106, 26, 0.2); }
  .payment-option.selected { border-color: var(--accent-gold); background: rgba(255, 106, 26, 0.03); box-shadow: 0 0 12px rgba(255, 106, 26, 0.1); }
  .payment-option.disabled { pointer-events: auto !important; cursor: pointer !important; opacity: 0.75; }
  .payment-option-title { font-size: 15px; font-weight: 700; color: var(--text-light); margin-bottom: 4px; }
  .payment-option-sub { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
  .recharge-highlight-link { color: var(--accent-gold) !important; font-weight: 800 !important; text-decoration: underline !important; margin-right: 4px; display: inline-block; }
  
  .bank-details { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: none; }
  .copy-account-btn { flex-shrink: 0; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 700; color: var(--accent-gold); cursor: pointer; }
  .copy-account-btn.copied { color: #16a34a; border-color: #16a34a; }
  .bank-details.show { display: block !important; }
  
  .file-upload { background: var(--bg-card); border: 1px dashed var(--border-color); border-radius: 12px; padding: 16px; text-align: center; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: all 0.2s ease; margin-top: 14px; }
  .file-upload:hover, .file-upload.has-file { border-color: var(--accent-gold); color: var(--text-light); }
  
  #couponInput { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-light); font-family:var(--font-display); font-size: 14px; font-weight: 600; transition: border-color 0.2s; }
  #couponInput:focus { border-color: var(--accent-gold); outline: none; }
  #applyCouponBtn { padding: 0 20px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-light); font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  #applyCouponBtn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

  .summary-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin: 24px 0 16px 0; }
  .summary-box span { font-size: 14px; font-weight: 700; color: var(--text-muted); }
  .summary-box .total { font-size: 22px; font-weight: 900; color: var(--accent-gold); }

  .auth-btn { width: 100%; padding: 16px; background: var(--accent-gold) !important; color: #1a1d29 !important; font-size: 16px; font-weight: 900; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.1s ease; box-sizing: border-box; }
  .auth-btn:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="product-page" id="productPage">
  <div class="product-header-actions">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> رجوع للمتجر</a>
    <a href="cart.html" class="cart-badge-link">
      <i class="fas fa-shopping-cart"></i> السلة <span id="globalCartCount">0</span>
    </a>
  </div>

  <div id="loadingBox" style="text-align:center; padding:60px 0; color:var(--text-muted);">جارِ التحميل...</div>
  <div id="content" style="display:none;"></div>
</div>

<div class="fixed-price-bar" id="fixedPriceBar" style="display:none;">
  <span class="fpb-label"><i class="fas fa-tag" style="color:var(--accent-gold); margin-left:4px;"></i>السعر الإجمالي</span>
  <span class="fpb-amount" id="fixedPriceAmount">—</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const productId = params.get('id');
let currentUser = null;
let product = null;
let exchangeRate = 1;

// متغيرات الخيارات المتداخلة
let selectedMainCat = null; 
let selectedOption = null;  
let groupedOptions = {};    

let walletBalance = 0;
let paymentMethods = [];
let selectedPayment = null;
let selectedMethodId = null;
let receiptFile = null;
let appliedCoupon = null;
let welcomeDiscount = null;
let quantity = 1;

function updateCartBadgeGlobal() {
  const cart = JSON.parse(localStorage.getItem('raizey_store_cart')) || [];
  document.getElementById('globalCartCount').textContent = cart.length;
}

async function init() {
  updateCartBadgeGlobal();
  if (!productId) { window.location.href = 'index.html'; return; }

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    sessionStorage.setItem('redirect_after_login', window.location.href);
    window.location.href = 'login.html';
    return;
  }
  currentUser = session.user;

  exchangeRate = await getExchangeRate();

  const { data: p, error } = await supabaseClient
    .from('products')
    .select('*')
    .eq('id', productId)
    .eq('is_active', true)
    .single();

  if (error || !p) {
    document.getElementById('loadingBox').textContent = 'المنتج غير موجود';
    return;
  }
  
  product = p;
  selectedMainCat = null;
  selectedOption = null;
  if (!hasOptions()) {
    selectedMainCat = String(product.name || 'المنتج');
    selectedOption = {
      id: 'main',
      label: selectedMainCat,
      display_label: selectedMainCat,
      price_usd: product.price_usd
    };
  }

  const { data: wallet } = await supabaseClient
    .from('wallets')
    .select('balance')
    .eq('user_id', currentUser.id)
    .single();
  walletBalance = wallet ? wallet.balance : 0;

  const { data: myProfile } = await supabaseClient
    .from('profiles')
    .select('referred_by, referral_discount_used')
    .eq('id', currentUser.id)
    .single();

  if (myProfile && myProfile.referred_by && !myProfile.referral_discount_used) {
    const { data: discountRow } = await supabaseClient
      .from('settings').select('value').eq('key', 'referral_signup_discount_percent').single();
    welcomeDiscount = discountRow ? Math.min(100, Math.max(0, Number(discountRow.value) || 0)) : 0;
  }

  const { data: methods } = await supabaseClient
    .from('payment_methods')
    .select('*')
    .eq('is_active', true);
  paymentMethods = methods || [];

  render();
}

function hasOptions() {
  return Array.isArray(product.options) && product.options.length > 0;
}

function getSelectedPriceUsd() {
  if (selectedOption) return parseFloat(selectedOption.price_usd ?? selectedOption.price ?? 0);
  return parseFloat(product.price_usd || 0);
}

function getSelectedPriceSdg() {
  const usd = getSelectedPriceUsd();
  return usd === null ? null : usd * exchangeRate;
}

function updateFixedPriceBar() {
  const bar = document.getElementById('fixedPriceBar');
  const amountEl = document.getElementById('fixedPriceAmount');
  if (!bar || !amountEl) return;
  bar.style.display = 'flex';
  if (!selectedOption) {
    amountEl.textContent = 'اختر الخيار النهائي أولاً';
    amountEl.classList.add('placeholder');
  } else {
    amountEl.textContent = formatSDG(getSelectedPriceSdg() * quantity) + ' ج.س';
    amountEl.classList.remove('placeholder');
  }
}

function render() {
  document.getElementById('loadingBox').style.display = 'none';
  const content = document.getElementById('content');
  content.style.display = 'block';

  // --- 1. تجميع الخيارات تلقائياً حسب الفئة الأساسية ---
  groupedOptions = {};
  if (hasOptions()) {
    product.options.forEach(opt => {
      let cat = 'الخيارات المتاحة';
      let label = String(opt.label || 'خيار');
      // إذا كان الاسم يحتوي على " - "، نقسمه (فئة - خيار)
      if (label.includes(' - ')) {
        const parts = label.split(' - ');
        cat = parts[0].trim();
        label = parts.slice(1).join(' - '); 
      } else if (label.includes('-')) {
        const parts = label.split('-');
        cat = parts[0].trim();
        label = parts.slice(1).join('-');
      }
      if (!groupedOptions[cat]) groupedOptions[cat] = [];
      groupedOptions[cat].push({ ...opt, display_label: label });
    });
  }

  const mainCategories = Object.keys(groupedOptions);

  const fields = product.required_fields || [];
  const canUseWallet = (selectedOption && walletBalance >= getSelectedPriceSdg());
  const heroPriceText = selectedOption ? `${formatSDG(getSelectedPriceSdg())} ج.س` : 'اختر الخيار المناسب';

  // --- 2. بناء الواجهة ---
  let htmlContent = `
    <div class="product-hero">
      <div class="product-hero-thumb">
        ${product.image_url ? `<img src="${escapeAttribute(sanitizeUrl(product.image_url))}" alt="${escapeAttribute(product.name)}">` : 'لا توجد صورة'}
      </div>
      <div class="product-hero-info">
        <h1>${escapeHtml(product.name)}</h1>
        <div class="product-hero-price" id="heroPriceDisplay">${escapeHtml(heroPriceText)}</div>
      </div>
    </div>
  `;

  // عرض أزرار الفئات الأساسية (إذا كان فيه فئات متعددة)
  if (mainCategories.length > 0) {
    htmlContent += `
      <div class="section-label">
        <i class="fas fa-layer-group" style="color:var(--accent-gold);"></i> اختر الباقة الأساسية:
      </div>
      <div class="main-category-grid" id="mainCategoryGrid">
        ${mainCategories.map(cat => `
          <div class="main-cat-btn" data-main-cat="${escapeAttribute(cat)}">
            ${escapeHtml(cat)}
          </div>
        `).join('')}
      </div>
      <div class="options-hint" id="mainHint">اختر الباقة لعرض الخيارات المتاحة</div>
    `;
  }

  // عرض الخيارات الفرعية (سيتم التحكم في إظهارها عبر JS عند الضغط)
  if (hasOptions()) {
    htmlContent += `
      <div class="section-label" style="display:none;" id="subLabel">
        <i class="fas fa-list-check" style="color:var(--accent-gold);"></i> اختر الخيار المطلوب:
      </div>
      <div class="sub-options-grid" id="subOptionsGrid"></div>
    `;
  }

  // باقي محتوى الصفحة
  htmlContent += `
    ${product.instructions ? `
      <div class="product-instructions-box">
        <div class="product-instructions-title"><i class="fas fa-circle-info"></i> تفاصيل وطريقة استلام المنتج:</div>
        ${escapeHtml(product.instructions).replace(/\n/g, '<br>')}
      </div>
    ` : ''}

    ${fields.length > 0 ? `
      <div class="section-label"><i class="fas fa-pen-to-square" style="color:var(--accent-gold);"></i> بيانات الطلب</div>
      ${fields.map(f => `
          <div class="field">
            <label>${escapeHtml(f.label)}</label>
            <input type="text" data-field-key="${escapeAttribute(f.key)}" required maxlength="500" placeholder="${escapeAttribute(f.placeholder ? f.placeholder : `اكتب ${f.label} هنا...`)}">
          </div>
        `).join('')}
    ` : ''}

    <div class="product-quantity-row" aria-label="تحديد الكمية">
      <span class="product-quantity-label"><i class="fas fa-boxes-stacked" aria-hidden="true"></i> الكمية</span>
      <div class="product-qty-stepper">
        <button type="button" id="qtyMinus" aria-label="إنقاص الكمية">&minus;</button>
        <span id="qtyValue" class="product-qty-value" aria-live="polite">1</span>
        <button type="button" id="qtyPlus" aria-label="زيادة الكمية">+</button>
      </div>
    </div>

    <div class="summary-box product-summary-box">
      <span>الإجمالي الحالي</span>
      <span class="total" id="summaryTotal">${selectedOption ? formatSDG(currentPrice() * quantity) + ' ج.س' : 'اختر الخيار'}</span>
    </div>

    <div class="form-error" id="formError" style="margin-bottom:12px; font-weight:700; color:var(--danger);"></div>

    <button class="auth-btn product-confirm-btn" id="confirmPurchaseBtn"><i class="fas fa-arrow-left" aria-hidden="true"></i> تأكيد الشراء والمتابعة للدفع</button>
    <button class="btn-secondary-cart" id="addToCartBtn"><i class="fas fa-cart-plus" aria-hidden="true"></i> إضافة إلى السلة</button>
    <p class="product-checkout-hint"><i class="fas fa-shield-halved" aria-hidden="true"></i> ستكمل فحص الإيصال واختيار طريقة الدفع في صفحة تأكيد الدفع.</p>
  `;

  content.innerHTML = htmlContent;
  updateFixedPriceBar();
  attachEvents();
}

function buildCartItem() {
  const fieldValues = collectFieldValues();
  if (fieldValues === null) return null;
  const fieldLabels = {};
  (product.required_fields || []).forEach(f => { if (f.key) fieldLabels[f.key] = f.label; });
  return {
    cart_item_id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
    product_id: product.id,
    name: product.name,
    price_sdg: getSelectedPriceSdg(),
    quantity,
    image_url: product.image_url,
    selected_option: {
      id: selectedOption.id,
      label: selectedMainCat ? `${selectedMainCat} - ${selectedOption.display_label}` : selectedOption.display_label,
      price_usd: getSelectedPriceUsd(),
      price_sdg: getSelectedPriceSdg()
    },
    field_values: fieldValues,
    field_labels: fieldLabels
  };
}

function attachEvents() {
  const errorBox = document.getElementById('formError');
  const addToCartBtn = document.getElementById('addToCartBtn');
  const confirmPurchaseBtn = document.getElementById('confirmPurchaseBtn');
  const mainGrid = document.getElementById('mainCategoryGrid');
  const subGrid = document.getElementById('subOptionsGrid');
  const subLabel = document.getElementById('subLabel');
  const mainHint = document.getElementById('mainHint');

  const addCurrentToCart = () => {
    errorBox.textContent = '';
    if (!validateSelection(errorBox)) return false;
    const item = buildCartItem();
    if (!item) { errorBox.textContent = 'املأ بيانات الطلب المطلوبة أولاً.'; return false; }
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem('raizey_store_cart')) || []; } catch (e) { cart = []; }
    cart.push(item);
    localStorage.setItem('raizey_store_cart', JSON.stringify(cart));
    updateCartBadgeGlobal();
    return true;
  };

  if (mainGrid) {
    mainGrid.querySelectorAll('.main-cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.mainCat;
        selectedMainCat = cat;
        selectedOption = null;
        mainGrid.querySelectorAll('.main-cat-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        if (mainHint) { mainHint.classList.remove('error'); mainHint.textContent = 'اختر الخيار المطلوب من القائمة'; }
        const subOptions = groupedOptions[cat] || [];
        if (subLabel) subLabel.style.display = subOptions.length ? 'flex' : 'none';
        if (subGrid) {
          subGrid.innerHTML = subOptions.map(opt => `
            <button type="button" class="option-card" data-option-id="${escapeAttribute(opt.id)}">
              <i class="fas fa-circle-check opt-check" aria-hidden="true"></i>
              <span class="opt-title">${escapeHtml(opt.display_label)}</span>
              <span class="opt-price-tag">${formatSDG(opt.price_usd * exchangeRate)} ج.س</span>
            </button>
          `).join('');
          subGrid.classList.toggle('visible', subOptions.length > 0);
          subGrid.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', () => {
              const found = subOptions.find(o => String(o.id) === String(card.dataset.optionId));
              if (!found) return;
              selectedOption = found;
              subGrid.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
              card.classList.add('selected');
              const hero = document.getElementById('heroPriceDisplay');
              if (hero) hero.textContent = formatSDG(getSelectedPriceSdg() * quantity) + ' ج.س';
              updateQuantityUI();
            });
          });
        }
        updateQuantityUI();
      });
    });
  }

  document.getElementById('qtyMinus')?.addEventListener('click', () => {
    quantity = Math.max(1, quantity - 1);
    updateQuantityUI();
  });
  document.getElementById('qtyPlus')?.addEventListener('click', () => {
    quantity = Math.min(99, quantity + 1);
    updateQuantityUI();
  });

  addToCartBtn?.addEventListener('click', () => {
    if (!addCurrentToCart()) return;
    errorBox.style.color = 'var(--accent-gold)';
    errorBox.textContent = 'تمت إضافة الباقة إلى السلة.';
    addToCartBtn.innerHTML = '<i class="fas fa-check-circle" aria-hidden="true"></i> تمت الإضافة';
    setTimeout(() => {
      addToCartBtn.innerHTML = '<i class="fas fa-cart-plus" aria-hidden="true"></i> إضافة إلى السلة';
      errorBox.textContent = '';
    }, 2200);
  });

  confirmPurchaseBtn?.addEventListener('click', () => {
    errorBox.textContent = '';
    if (!validateSelection(errorBox)) return;
    const item = buildCartItem();
    if (!item) { errorBox.textContent = 'املأ بيانات الطلب المطلوبة أولاً.'; return; }
    sessionStorage.setItem('raizey_direct_buy', JSON.stringify({ created_at: Date.now(), items: [item] }));
    window.location.href = 'checkout.html';
  });
}


// --- دوال المساعدة ---
function currentPrice() {
  if (!selectedOption) return 0;
  let base = Number(getSelectedPriceSdg());
  if (!Number.isFinite(base) || base < 0) return 0;
  const couponPercent = appliedCoupon ? Math.min(100, Math.max(0, Number(appliedCoupon.discount_percent) || 0)) : 0;
  const welcomePercent = Math.min(100, Math.max(0, Number(welcomeDiscount) || 0));
  if (couponPercent) base -= base * couponPercent / 100;
  if (welcomePercent) base -= base * welcomePercent / 100;
  return Math.max(0, base);
}
function updateSummary() {
  const summary = document.getElementById('summaryTotal');
  if (summary) summary.textContent = selectedOption ? formatSDG(currentPrice() * quantity) + ' ج.س' : 'اختر الخيار';
}

function updateQuantityUI() {
  const value = document.getElementById('qtyValue');
  const minus = document.getElementById('qtyMinus');
  if (value) value.textContent = String(quantity);
  if (minus) minus.disabled = quantity <= 1;
  updateSummary();
  updateFixedPriceBar();
}

async function applyCoupon() {
  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  const msgBox = document.getElementById('couponMessage');
  msgBox.style.color = '';
  if (!code) { msgBox.style.color = 'var(--danger)'; msgBox.textContent = 'اكتب الكود الأول'; return; }
  const { data, error } = await supabaseClient.rpc('validate_coupon', { p_code: code });
  if (error || !data || data.length === 0) { appliedCoupon = null; msgBox.style.color = 'var(--danger)'; msgBox.textContent = 'الكود غير صالح'; updateSummary(); return; }
  appliedCoupon = {
    coupon_id: data[0].coupon_id,
    discount_percent: Math.min(100, Math.max(0, Number(data[0].discount_percent) || 0))
  };
  msgBox.style.color = 'var(--accent-gold)'; msgBox.textContent = `خصم ${appliedCoupon.discount_percent}%`; updateSummary();
}

// فحص الإجبارية للمستويين
function validateSelection(errorBox) {
  if (hasOptions() && !selectedMainCat) {
    errorBox.style.color = 'var(--danger)'; errorBox.textContent = 'يرجى اختيار الباقة الأساسية أولاً.'; document.getElementById('mainCategoryGrid')?.classList.add('selection-shake');
    setTimeout(() => document.getElementById('mainCategoryGrid')?.classList.remove('selection-shake'), 500); return false;
  }
  // إذا كانت الفئة تحتوي على خيارات فرعية، أو كانت فئة واحدة، نتحقق من اختيار خيار.
  if (hasOptions() && !selectedOption) {
    errorBox.style.color = 'var(--danger)'; errorBox.textContent = 'يرجى اختيار الخيار المطلوب أولاً.';
    document.getElementById('subOptionsGrid')?.classList.add('selection-shake');
    setTimeout(() => document.getElementById('subOptionsGrid')?.classList.remove('selection-shake'), 500); return false;
  }
  return true;
}

function collectFieldValues() {
  const values = {};
  const inputs = document.querySelectorAll('[data-field-key]');
  for (const input of inputs) { if (!input.value.trim()) return null; values[input.dataset.fieldKey] = input.value.trim(); }
  return values;
}

async function submitOrder(errorBox, submitBtn) {
  errorBox.textContent = '';
  if (!validateSelection(errorBox)) return;

  const selectedOptionId = String(selectedOption.id);
  const productHadOptions = hasOptions();
  const { data: freshProduct, error: refreshError } = await supabaseClient
    .from('products')
    .select('*')
    .eq('id', productId)
    .eq('is_active', true)
    .single();
  const freshOption = (freshProduct?.options || []).find(option => String(option.id) === selectedOptionId);
  if (refreshError || !freshProduct || (productHadOptions && !freshOption)) {
    errorBox.textContent = 'المنتج أو الخيار لم يعد متاحاً، حدّث الصفحة وحاول مرة أخرى';
    return;
  }
  product = freshProduct;
  selectedOption = freshOption
    ? { ...freshOption, display_label: selectedOption.display_label }
    : { ...selectedOption, price_usd: freshProduct.price_usd };
  updateSummary();
  updateFixedPriceBar();

  const fieldValues = collectFieldValues();
  if (fieldValues === null) { errorBox.textContent = 'املأ البيانات'; return; }
  if (!selectedPayment) { errorBox.textContent = 'اختر طريقة الدفع'; return; }

  submitBtn.disabled = true; submitBtn.textContent = 'جارٍ...';

  const productNameSnapshot = `${product.name} (${selectedMainCat} - ${selectedOption.display_label})`;

  // دفع المحفظة
  if (selectedPayment === 'wallet') {
    const fieldLabels = {};
    (product.required_fields || []).forEach(f => { if (f.key) fieldLabels[f.key] = f.label; });
    const { data: rpcData, error } = await supabaseClient.rpc('create_wallet_order', {
      p_product_id: productId, p_field_values: fieldValues,
      p_field_labels: fieldLabels,
      p_coupon_code: appliedCoupon ? document.getElementById('couponInput').value.trim().toUpperCase() : null,
      p_selected_option_id: selectedOption.id
    });
    if (error) { errorBox.textContent = error.message.includes('insufficient_balance') ? 'رصيدك غير كافٍ' : 'خطأ، حاول تاني'; submitBtn.disabled = false; submitBtn.textContent = 'تأكيد الطلب'; return; }
    const orderId = rpcData && rpcData.length > 0 ? rpcData[0].id : null;
    window.location.href = orderId ? `receipt.html?order_id=${orderId}` : 'my-orders.html';
    return;
  }

  // دفع بنكي
  if (!selectedMethodId || !receiptFile) { errorBox.textContent = !selectedMethodId ? 'اختر وسيلة التحويل' : 'ارفع الإيصال'; submitBtn.disabled = false; submitBtn.textContent = 'تأكيد الطلب'; return; }
  const transactionRef = document.getElementById('transactionRefInput').value.trim();
  if (!transactionRef) { errorBox.textContent = 'اكتب رقم العملية'; submitBtn.disabled = false; submitBtn.textContent = 'تأكيد الطلب'; return; }

  const preCheck = await validateReceiptImage(receiptFile);
  if (!preCheck.valid) { errorBox.textContent = preCheck.message; submitBtn.disabled = false; submitBtn.textContent = 'تأكيد الطلب'; return; }

  submitBtn.textContent = 'جارِ حساب بصمة الملف...';
  const receiptHash = await hashFile(receiptFile);
  if (!receiptHash) { errorBox.textContent = 'تعذّر معالجة صورة الإيصال، جرّب صورة أخرى.'; submitBtn.disabled = false; submitBtn.textContent = 'تأكيد الطلب'; return; }

  submitBtn.textContent = 'جارِ رفع الإيصال...';
  const fileExt = receiptFile.name.split('.').pop().toLowerCase();
  const filePath = `${currentUser.id}/${Date.now()}_receipt.${fileExt}`;
  const { error: uploadError } = await supabaseClient.storage.from('receipts').upload(filePath, receiptFile);
  if (uploadError) { errorBox.textContent = 'فشل رفع الإيصال، تأكد من الاتصال وحجم الصورة.'; submitBtn.disabled = false; submitBtn.textContent = 'تأكيد الطلب'; return; }

  // ── الحجز الذرّي للإيصال (نفس حاجز checkout.html) — لا يوجد فحص OCR في
  // هذه الصفحة بعد، لذلك يُعلَّم الطلب دائماً "قيد المراجعة اليدوية" ولا
  // يُقبل تلقائياً أبداً، لكن التكرار يُمنع فوراً على مستوى القاعدة. ──
  submitBtn.textContent = 'جارِ تسجيل الإيصال...';
  let receiptId = null;
  try {
    const { data: claimData, error: claimErr } = await supabaseClient.rpc('claim_payment_receipt', {
      p_purpose: 'order', p_tx_ref: transactionRef, p_receipt_hash: receiptHash,
      p_receipt_path: filePath, p_provider: null, p_payment_method_id: selectedMethodId,
      p_amount_expected: currentPrice(), p_amount_detected: null, p_tx_ref_ocr: null,
      p_ocr_status: 'needs_review', p_ocr_confidence: null, p_risk_flags: ['no_ocr_engine_on_this_page'], p_ocr_data: {}
    });
    if (claimErr) throw claimErr;
    receiptId = claimData && claimData.length ? claimData[0].id : null;
    if (!receiptId) throw new Error('receipt_claim_failed');
  } catch (err) {
    const msg = err.message || String(err);
    errorBox.textContent = getFriendlyError(msg);
    submitBtn.disabled = false; submitBtn.textContent = 'تأكيد الطلب'; return;
  }

  // ── استخدام الكوبون ذرياً بعد نجاح حجز الإيصال (لمنع Race Condition) ──
  if (appliedCoupon) {
    const couponCode = document.getElementById('couponInput').value.trim().toUpperCase();
    const { data: couponAtomicData, error: couponAtomicErr } = await supabaseClient.rpc('use_coupon_atomic', { p_code: couponCode, p_order_total: currentPrice() });
    if (couponAtomicErr || !couponAtomicData || couponAtomicData.length === 0) {
      errorBox.textContent = 'انتهت صلاحية كود الخصم أو نفدت كميته أو استخدمته من قبل.';
      submitBtn.disabled = false; submitBtn.textContent = 'تأكيد الطلب'; return;
    }
  }

  const orderPayload = {
    user_id: currentUser.id, product_id: productId, product_name_snapshot: productNameSnapshot,
    price_sdg_snapshot: currentPrice(), field_values: fieldValues,
    field_labels: (() => { const fl = {}; (product.required_fields || []).forEach(f => { if (f.key) fl[f.key] = f.label; }); return fl; })(),
    selected_option: { id: selectedOption.id, label: selectedMainCat + ' - ' + selectedOption.display_label, price_usd: getSelectedPriceUsd(), price_sdg: getSelectedPriceSdg() },
    payment_type: 'bank', payment_method_id: selectedMethodId, receipt_id: receiptId
  };

  const { data: insertedOrder, error: orderError } = await supabaseClient.from('orders').insert(orderPayload).select('id').single();
  if (orderError) { errorBox.textContent = getFriendlyError(orderError.message); submitBtn.disabled = false; submitBtn.textContent = 'تأكيد الطلب'; return; }

  // الكوبون استُخدم ذرياً أعلاه؛ welcomeDiscount يُحدَّث هنا
  if (welcomeDiscount) await supabaseClient.from('profiles').update({ referral_discount_used: true }).eq('id', currentUser.id);

  window.location.href = insertedOrder && insertedOrder.id ? `receipt.html?order_id=${insertedOrder.id}` : 'my-orders.html';
}

init();
</script>
