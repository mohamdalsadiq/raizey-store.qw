<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="https://js.sentry-cdn.com/b654a99332aedb9fbaf8e802ca53e55b.min.js" crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تفاصيل المنتج — RAIZEY STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
<style>
  :root { --product-bg:#fff; --product-card:#f5f1ea; --product-primary:#ff6a1a; --product-border:#e8e1d6; --product-ink:#1a1d29; --product-muted:#7a7468; --product-danger:#e5484d; }
  body { margin:0; background:var(--product-bg)!important; color:var(--product-ink)!important; font-family:var(--font-display); }
  .product-page { width:min(100%, 680px); margin:0 auto; padding:20px 16px 112px; box-sizing:border-box; }
  .product-header-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
  .back-link,.cart-badge-link { color:var(--product-ink); text-decoration:none; font-size:13px; font-weight:800; }
  .back-link:hover,.back-link:focus-visible { color:var(--product-primary); }
  .cart-badge-link { display:inline-flex; align-items:center; gap:8px; background:var(--product-card); border:1px solid var(--product-border); border-radius:999px; padding:9px 13px; }
  .cart-badge-link i { color:var(--product-primary); }
  .cart-badge-link span { min-width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:var(--product-primary); color:var(--product-ink); font:800 11px var(--font-mono); }
  .product-hero { display:flex; align-items:center; gap:16px; padding:16px; margin-bottom:20px; border:1px solid var(--product-border); border-radius:18px; background:var(--product-card); box-shadow:0 8px 24px rgba(31,34,43,.06); }
  .product-hero-thumb { flex:0 0 88px; width:88px; height:88px; overflow:hidden; display:grid; place-items:center; border:1px solid var(--product-border); border-radius:14px; background:#fff; color:var(--product-primary); font-size:26px; }
  .product-hero-thumb img { width:100%; height:100%; object-fit:cover; }
  .product-hero-info { min-width:0; }
  .product-hero-info h1 { margin:0 0 8px; color:var(--product-ink); font-size:clamp(19px,5vw,25px); line-height:1.35; font-weight:900; }
  .product-hero-price { color:var(--product-primary); font:900 clamp(21px,6vw,30px)/1.2 var(--font-mono); }
  .product-hero-price.pending { color:var(--product-muted); font:800 14px/1.5 var(--font-display); }
  .section-label { display:flex; align-items:center; gap:8px; margin:20px 0 10px; color:var(--product-muted); font-size:13px; font-weight:900; }
  .section-label i { color:var(--product-primary); }
  .option-group { margin-bottom:16px; }
  .option-group-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; color:var(--product-ink); font-size:14px; font-weight:900; }
  .option-group-title small { color:var(--product-muted); font-size:11px; font-weight:700; }
  .option-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .option-button { position:relative; min-height:68px; padding:11px 10px; border:2px solid var(--product-border); border-radius:14px; background:var(--product-card); color:var(--product-ink); cursor:pointer; text-align:center; transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease; }
  .option-button:hover,.option-button:focus-visible { border-color:rgba(255,106,26,.55); outline:3px solid rgba(255,106,26,.14); outline-offset:1px; }
  .option-button:active { transform:scale(.98); }
  .option-button.selected { border-color:var(--product-primary); background:rgba(255,106,26,.09); box-shadow:0 8px 18px rgba(255,106,26,.14); }
  .option-button .check { position:absolute; top:7px; left:8px; display:none; color:var(--product-primary); font-size:12px; }
  .option-button.selected .check { display:block; }
  .option-button .option-label { display:block; font-size:14px; line-height:1.35; font-weight:900; }
  .option-button .option-price { display:block; margin-top:5px; color:var(--product-primary); font:800 12px var(--font-mono); }
  .option-group.required .option-group-title::after { content:'إجباري'; color:var(--product-primary); font-size:10px; }
  .option-group.optional { border-right:3px solid rgba(122,116,104,.35); padding-right:10px; }
  .option-hint { margin:7px 0 0; color:var(--product-muted); font-size:11px; line-height:1.55; }
  .option-hint.error { color:var(--product-danger); font-weight:800; }
  .field { margin-bottom:15px; }
  .field label { display:block; margin-bottom:7px; color:var(--product-ink); font-size:13px; font-weight:800; }
  .field input { width:100%; box-sizing:border-box; padding:13px 14px; border:1px solid var(--product-border); border-radius:12px; background:var(--product-card); color:var(--product-ink); font:600 14px var(--font-display); }
  .field input:focus { border-color:var(--product-primary); outline:3px solid rgba(255,106,26,.14); }
  .product-quantity-row,.summary-box { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 14px; border:1px solid var(--product-border); border-radius:14px; background:var(--product-card); }
  .product-quantity-row { margin:19px 0 12px; }
  .product-quantity-label { display:inline-flex; align-items:center; gap:7px; color:var(--product-ink); font-size:13px; font-weight:900; }
  .product-quantity-label i { color:var(--product-primary); }
  .product-qty-stepper { display:inline-flex; align-items:center; gap:12px; }
  .product-qty-stepper button { width:34px; height:34px; border:1.5px solid var(--product-primary); border-radius:9px; background:transparent; color:var(--product-primary); font-size:20px; font-weight:900; cursor:pointer; }
  .product-qty-stepper button:disabled { opacity:.4; cursor:not-allowed; }
  .product-qty-value { min-width:24px; text-align:center; color:var(--product-ink); font:900 16px var(--font-mono); }
  .summary-box { margin:12px 0 14px; }
  .summary-box span:first-child { color:var(--product-muted); font-size:13px; font-weight:800; }
  .summary-box .total { color:var(--product-primary); font:900 20px var(--font-mono); }
  .form-error { min-height:22px; margin-bottom:8px; color:var(--product-danger); font-size:12px; font-weight:800; line-height:1.55; }
  .product-confirm-btn,.btn-secondary-cart { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; box-sizing:border-box; padding:15px; border-radius:13px; font:900 15px var(--font-display); cursor:pointer; transition:transform .15s ease,opacity .15s ease,background .15s ease; }
  .product-confirm-btn { border:0; background:var(--product-primary); color:var(--product-ink); }
  .btn-secondary-cart { margin-top:10px; border:1.5px solid var(--product-primary); background:transparent; color:var(--product-primary); }
  .product-confirm-btn:active,.btn-secondary-cart:active { transform:scale(.985); }
  .product-checkout-hint { display:flex; align-items:flex-start; justify-content:center; gap:6px; margin:11px 0 20px; color:var(--product-muted); font-size:11px; line-height:1.7; text-align:center; }
  .product-checkout-hint i { color:var(--product-primary); margin-top:3px; }
  .product-instructions-box { padding:15px; margin-top:18px; border-right:4px solid var(--product-primary); border-radius:12px; background:var(--product-card); color:var(--product-ink); font-size:13px; line-height:1.75; }
  .product-instructions-title { display:flex; align-items:center; gap:7px; margin-bottom:7px; color:var(--product-primary); font-weight:900; }
  .fixed-price-bar { position:fixed; right:0; bottom:0; left:0; z-index:90; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--product-border); background:rgba(255,255,255,.96); box-shadow:0 -8px 24px rgba(31,34,43,.08); backdrop-filter:blur(10px); }
  .fixed-price-bar .fpb-label { color:var(--product-muted); font-size:11px; font-weight:800; }
  .fixed-price-bar .fpb-amount { color:var(--product-primary); font:900 19px var(--font-mono); }
  .fixed-price-bar .fpb-amount.placeholder { color:var(--product-muted); font:800 12px var(--font-display); }
  @media (min-width:620px) { .product-page { padding-inline:22px; } .option-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
</style>
</head>
<body>
<main class="product-page" id="productPage">
  <div class="product-header-actions">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-right" aria-hidden="true"></i> رجوع للمتجر</a>
    <a href="cart.html" class="cart-badge-link" aria-label="فتح السلة"><i class="fas fa-shopping-cart" aria-hidden="true"></i> السلة <span id="globalCartCount">0</span></a>
  </div>
  <div id="loadingBox" style="text-align:center;padding:60px 0;color:var(--product-muted);">جارِ تحميل المنتج...</div>
  <div id="content" hidden></div>
</main>
<div class="fixed-price-bar" id="fixedPriceBar" hidden>
  <span class="fpb-label"><i class="fas fa-tag" aria-hidden="true"></i> السعر اللحظي</span>
  <span class="fpb-amount placeholder" id="fixedPriceAmount">اختر المنتج</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
'use strict';
const params = new URLSearchParams(window.location.search);
const productId = params.get('id');
let product = null;
let exchangeRate = 1;
let optionGroups = [];
let selections = new Map();
let selectionOrder = [];
let quantity = 1;

const $ = (id) => document.getElementById(id);
function text(value, fallback = '') { return typeof value === 'string' && value.trim() ? value.trim() : fallback; }
function safeUrl(value) {
  try { const url = new URL(value, window.location.href); return ['http:', 'https:'].includes(url.protocol) ? url.href : ''; } catch { return ''; }
}
function moneyUsd(value) { const n = Number(value); return Number.isFinite(n) ? n : 0; }
function moneySdg(value) { return formatSDG(Math.max(0, moneyUsd(value) * exchangeRate)) + ' ج.س'; }
function updateCartBadge() { try { $('globalCartCount').textContent = String((JSON.parse(localStorage.getItem('raizey_store_cart') || '[]') || []).length); } catch { $('globalCartCount').textContent = '0'; } }

function normalizeOptionTree(row) {
  const tree = Array.isArray(row.option_tree) ? row.option_tree : [];
  if (tree.length) {
    return tree.map((group, index) => ({
      id: text(group?.id, `group_${index}`),
      label: text(group?.label, 'اختر الخيار'),
      required: group?.required === true,
      options: Array.isArray(group?.options) ? group.options.map((option, optionIndex) => normalizeOption(option, `option_${index}_${optionIndex}`)) : []
    })).filter(group => group.options.length);
  }

  const legacy = Array.isArray(row.options) ? row.options : [];
  if (!legacy.length) return [];
  const groups = new Map();
  legacy.forEach((raw, index) => {
    let groupLabel = text(raw?.group, '');
    let optionLabel = text(raw?.label, 'خيار');
    if (!groupLabel && optionLabel.includes(' - ')) {
      const parts = optionLabel.split(' - '); groupLabel = text(parts.shift(), 'خيارات المنتج'); optionLabel = text(parts.join(' - '), 'خيار');
    }
    groupLabel = groupLabel || 'خيارات المنتج';
    const groupId = slug(groupLabel) || `legacy_group_${index}`;
    if (!groups.has(groupId)) groups.set(groupId, { id: groupId, label: groupLabel, required: true, options: [] });
    groups.get(groupId).options.push(normalizeOption({ ...raw, label: optionLabel }, `legacy_option_${index}`));
  });
  return [...groups.values()];
}
function normalizeOption(raw, fallbackId) {
  return {
    id: text(raw?.id, fallbackId),
    label: text(raw?.label, 'خيار'),
    price_usd: moneyUsd(raw?.price_usd ?? raw?.price),
    children_label: text(raw?.children_label, 'الخيارات الفرعية'),
    children: Array.isArray(raw?.children) ? raw.children.map((child, index) => normalizeOption(child, `${fallbackId}_child_${index}`)) : []
  };
}
function slug(value) { return String(value).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_|_$/g, '').slice(0, 80); }
function optionsAreRequired() { return product?.options_required === true || (!Array.isArray(product?.option_tree) || product.option_tree.length === 0) && Array.isArray(product?.options) && product.options.length > 0; }

function selectedFinalOption() {
  let final = null;
  for (const group of optionGroups) {
    const option = selections.get(group.id);
    if (!option) break;
    final = option;
    let childGroup = childGroupFor(group, option);
    while (childGroup) {
      const child = selections.get(childGroup.id);
      if (!child) break;
      final = child;
      childGroup = childGroupFor(childGroup, child);
    }
  }
  return final;
}
function childGroupFor(group, option) {
  return option?.children?.length ? { id: `${group.id}__${option.id}`, label: option.children_label || 'الخيارات الفرعية', required: optionsAreRequired(), options: option.children } : null;
}
function selectedUsd() { return selectedFinalOption() ? selectedFinalOption().price_usd : moneyUsd(product?.price_usd); }
function updatePriceUI() {
  const price = moneySdg(selectedUsd() * quantity);
  $('heroPriceDisplay').textContent = price;
  $('summaryTotal').textContent = price;
  $('fixedPriceAmount').textContent = price;
  $('fixedPriceAmount').classList.remove('placeholder');
}

function renderOptionTree() {
  const container = $('optionTree');
  container.replaceChildren();
  const renderGroup = (group, depth = 0) => {
    const section = document.createElement('section');
    section.className = `option-group ${group.required || optionsAreRequired() ? 'required' : 'optional'}`;
    section.dataset.groupId = group.id;
    const title = document.createElement('div'); title.className = 'option-group-title';
    const label = document.createElement('span'); label.textContent = group.label;
    const hint = document.createElement('small'); hint.textContent = group.required || optionsAreRequired() ? 'اختر واحدًا' : 'اختياري';
    title.append(label, hint);
    const grid = document.createElement('div'); grid.className = 'option-grid';
    group.options.forEach(option => {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'option-button'; button.dataset.optionId = option.id;
      button.setAttribute('aria-pressed', selections.get(group.id)?.id === option.id ? 'true' : 'false');
      const check = document.createElement('i'); check.className = 'fas fa-check check'; check.setAttribute('aria-hidden', 'true');
      const optionLabel = document.createElement('span'); optionLabel.className = 'option-label'; optionLabel.textContent = option.label;
      const optionPrice = document.createElement('span'); optionPrice.className = 'option-price'; optionPrice.textContent = moneySdg(option.price_usd);
      button.append(check, optionLabel, optionPrice);
      if (selections.get(group.id)?.id === option.id) button.classList.add('selected');
      button.addEventListener('click', () => {
        selections.set(group.id, option);
        selectionOrder = selectionOrder.filter(item => item.groupId !== group.id && !item.groupId.startsWith(`${group.id}__`));
        selectionOrder.push({ groupId: group.id, option });
        for (const key of [...selections.keys()]) if (key.startsWith(`${group.id}__`)) selections.delete(key);
        renderOptionTree(); updatePriceUI();
      });
      grid.appendChild(button);
    });
    section.append(title, grid);
    const selected = selections.get(group.id);
    if (selected?.children?.length) {
      const childGroup = childGroupFor(group, selected);
      section.appendChild(renderGroup(childGroup, depth + 1));
    }
    return section;
  };
  optionGroups.forEach(group => container.appendChild(renderGroup({ ...group, required: group.required || optionsAreRequired() })));
  $('optionTree').hidden = optionGroups.length === 0;
}

function hasRequiredGap() {
  if (!optionsAreRequired()) return false;
  const checkGroup = (group) => {
    const selected = selections.get(group.id);
    if (!selected) return true;
    const child = childGroupFor(group, selected);
    return child ? checkGroup(child) : false;
  };
  return optionGroups.some(checkGroup);
}
function validateSelection(errorBox) {
  if (hasRequiredGap()) {
    errorBox.textContent = 'اختر جميع الخيارات المطلوبة قبل المتابعة.';
    errorBox.focus?.();
    return false;
  }
  return true;
}
function collectFields() {
  const values = {}, labels = {};
  for (const input of document.querySelectorAll('[data-field-key]')) {
    const value = input.value.trim();
    if (!value) return null;
    values[input.dataset.fieldKey] = value;
    labels[input.dataset.fieldKey] = input.dataset.fieldLabel || input.dataset.fieldKey;
  }
  return { values, labels };
}
function buildCartItem() {
  const fields = collectFields();
  if (!fields) return null;
  const final = selectedFinalOption();
  const selectedPath = selectionOrder.map(item => ({ group_id: item.groupId, option_id: item.option.id, label: item.option.label, price_usd: item.option.price_usd }));
  return {
    cart_item_id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
    product_id: product.id,
    name: product.name,
    price_sdg: selectedUsd() * exchangeRate,
    quantity,
    image_url: product.image_url,
    selected_option: final ? { id: final.id, label: final.label, price_usd: final.price_usd, price_sdg: final.price_usd * exchangeRate, path: selectedPath } : null,
    field_values: fields.values,
    field_labels: fields.labels
  };
}
function addToCart() {
  const error = $('formError'); error.textContent = '';
  if (!validateSelection(error)) return;
  const item = buildCartItem();
  if (!item) { error.textContent = 'أكمل بيانات العميل المطلوبة أولاً.'; return; }
  let cart = []; try { cart = JSON.parse(localStorage.getItem('raizey_store_cart') || '[]') || []; } catch { cart = []; }
  cart.push(item); localStorage.setItem('raizey_store_cart', JSON.stringify(cart)); updateCartBadge();
  error.style.color = 'var(--product-primary)'; error.textContent = 'تمت إضافة المنتج إلى السلة.';
  $('addToCartBtn').innerHTML = '<i class="fas fa-check-circle" aria-hidden="true"></i> تمت الإضافة';
  setTimeout(() => { $('addToCartBtn').innerHTML = '<i class="fas fa-cart-plus" aria-hidden="true"></i> إضافة إلى السلة'; error.textContent = ''; error.style.color = ''; }, 2200);
}
async function buyNow() {
  const error = $('formError'); error.textContent = ''; error.style.color = '';
  if (!validateSelection(error)) return;
  const item = buildCartItem();
  if (!item) { error.textContent = 'أكمل بيانات العميل المطلوبة أولاً.'; return; }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    sessionStorage.setItem('redirect_after_login', window.location.href);
    window.location.href = 'login.html';
    return;
  }
  sessionStorage.setItem('raizey_direct_buy', JSON.stringify({ created_at: Date.now(), items: [item] }));
  window.location.href = 'checkout-v2.html';
}

function renderProduct() {
  const imageUrl = safeUrl(product.image_url);
  $('loadingBox').hidden = true; $('content').hidden = false;
  $('content').innerHTML = `
    <div class="product-hero">
      <div class="product-hero-thumb">${imageUrl ? `<img src="${escapeAttribute(imageUrl)}" alt="${escapeAttribute(text(product.name, 'منتج'))}">` : '<i class="fas fa-box-open" aria-hidden="true"></i>'}</div>
      <div class="product-hero-info"><h1>${escapeHtml(text(product.name, 'منتج رقمي'))}</h1><div class="product-hero-price ${optionGroups.length && optionsAreRequired() ? 'pending' : ''}" id="heroPriceDisplay">${optionGroups.length && optionsAreRequired() ? 'اختر الخيار المطلوب' : moneySdg(selectedUsd() * quantity)}</div></div>
    </div>
    ${optionGroups.length ? '<div class="section-label"><i class="fas fa-layer-group" aria-hidden="true"></i> اختر المنتج أو الخيارات</div><div id="optionTree"></div>' : ''}
    ${(Array.isArray(product.required_fields) && product.required_fields.length) ? `<div class="section-label"><i class="fas fa-pen-to-square" aria-hidden="true"></i> بيانات الطلب</div>${product.required_fields.map(field => `<div class="field"><label>${escapeHtml(text(field.label, 'بيانات العميل'))}</label><input type="text" maxlength="500" data-field-key="${escapeAttribute(text(field.key, 'field'))}" data-field-label="${escapeAttribute(text(field.label, 'بيانات العميل'))}" placeholder="${escapeAttribute(text(field.placeholder, `اكتب ${text(field.label, 'البيانات')} هنا...`))}"></div>`).join('')}` : ''}
    <div class="product-quantity-row"><span class="product-quantity-label"><i class="fas fa-boxes-stacked" aria-hidden="true"></i> الكمية</span><div class="product-qty-stepper"><button type="button" id="qtyMinus" aria-label="إنقاص الكمية">−</button><span id="qtyValue" class="product-qty-value">1</span><button type="button" id="qtyPlus" aria-label="زيادة الكمية">+</button></div></div>
    <div class="summary-box"><span>السعر الإجمالي اللحظي</span><span class="total" id="summaryTotal">${moneySdg(selectedUsd() * quantity)}</span></div>
    <div class="form-error" id="formError" tabindex="-1"></div>
    <button class="product-confirm-btn" id="buyNowBtn" type="button"><i class="fas fa-bolt" aria-hidden="true"></i> اشتري الآن</button>
    <button class="btn-secondary-cart" id="addToCartBtn" type="button"><i class="fas fa-cart-plus" aria-hidden="true"></i> إضافة إلى السلة</button>
    <p class="product-checkout-hint"><i class="fas fa-shield-halved" aria-hidden="true"></i> ستكمل الدفع وفحص الإيصال في صفحة التأكيد الآمنة.</p>
    ${product.instructions ? `<div class="product-instructions-box"><div class="product-instructions-title"><i class="fas fa-circle-info" aria-hidden="true"></i> التفاصيل وطريقة الاستلام</div><div>${escapeHtml(product.instructions).replace(/\n/g, '<br>')}</div></div>` : ''}
  `;
  if (optionGroups.length) { renderOptionTree(); $('fixedPriceBar').hidden = false; } else { $('fixedPriceBar').hidden = false; updatePriceUI(); }
  $('qtyMinus').addEventListener('click', () => { quantity = Math.max(1, quantity - 1); $('qtyValue').textContent = quantity; updatePriceUI(); });
  $('qtyPlus').addEventListener('click', () => { quantity = Math.min(99, quantity + 1); $('qtyValue').textContent = quantity; updatePriceUI(); });
  $('buyNowBtn').addEventListener('click', buyNow); $('addToCartBtn').addEventListener('click', addToCart);
}

async function init() {
  updateCartBadge();
  if (!productId) { window.location.href = 'index.html'; return; }
  // التصفح عام، ويُطلب تسجيل الدخول فقط عند الضغط على الشراء.
  exchangeRate = Number(await getExchangeRate()) || 1;
  const { data, error } = await supabaseClient.from('products').select('*').eq('id', productId).eq('is_active', true).single();
  if (error || !data) { $('loadingBox').textContent = 'المنتج غير موجود أو غير متاح حالياً.'; return; }
  product = data; optionGroups = normalizeOptionTree(product);
  document.title = `${text(product.name, 'تفاصيل المنتج')} — RAIZEY STORE`;
  renderProduct();
}
init();
</script>
