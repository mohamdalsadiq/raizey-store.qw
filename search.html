<style>
  /* لوحة الألوان الملكية المتوافقة مع الهوية الجديدة للمتجر */
  :root {
    --bg-main: #ffffff;         /* الورقي الصافي - خلفية الموقع */
    --bg-card: #F8EBDD;         /* الورقي الخافت - خلفية البطاقات */
    --accent-gold: #FF6500;     /* البرتقالي الحيوي - العنصر التفاعلي الأساسي */
    --border-color: #E8D6C6;    /* لون الحدود المتناسق */
    --text-light: #17100C;      /* الحبري الداكن - لون النصوص */
    --text-muted: #70645C;      /* نصوص ثانوية مريحة */
  }

  body {
    background-color: var(--bg-main) !important;
    color: var(--text-light) !important;
    font-family:var(--font-display);
  }

  .site-header {
    background: var(--bg-card) !important;
    border-bottom: 1px solid var(--border-color) !important;
  }

  /* شبكة عرض كروت التصنيفات والألعاب */
  .categories-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)) !important;
    gap: 16px !important;
    padding: 10px 20px !important;
    margin-bottom: 30px;
  }

  /* كارت اللعبة الموحد */
  .game-card {
    background: var(--bg-card) !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 16px !important;
    padding: 12px !important;
    display: flex !important;
    flex-direction: column !important;
    transition: transform 0.25s ease-in-out, border-color 0.25s ease-in-out, box-shadow 0.25s ease-in-out, background-color 0.25s ease-in-out !important;
    text-decoration: none !important;
    position: relative !important;
    overflow: hidden !important;
  }
  .game-card:hover, .game-card:active {
    border-color: var(--rz-accent-text)!important;
    box-shadow: 0 0 15px rgba(255, 106, 26, 0.12) !important;
    transform: translateY(-2px) !important;
  }
  .game-thumb {
    width: 100% !important;
    height: 125px !important;
    overflow: hidden !important;
    border-radius: 12px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: var(--bg-main) !important;
    border: 1px solid var(--border-color) !important;
  }
  .game-thumb img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }
  .game-info {
    display: flex !important;
    flex-direction: column !important;
    flex-grow: 1 !important;
    margin-top: 10px !important;
  }
  .game-name {
    color: var(--text-light) !important;
    font-size: 14px !important;
    font-weight: 800 !important;
    text-align: right !important;
    margin-bottom: 4px !important;
  }
  .game-desc {
    color: var(--text-muted) !important;
    font-size: 11px !important;
    line-height: 1.4 !important;
    text-align: right !important;
    display: -webkit-box !important;
    -webkit-line-clamp: 2 !important;
    -webkit-box-orient: vertical !important;
    overflow: hidden !important;
    height: 30px !important;
    margin-bottom: 10px !important;
  }
  .game-btn {
    width: 100% !important;
    background: rgba(255, 106, 26, 0.06) !important;
    color: var(--rz-accent-text)!important;
    border: 1px solid rgba(255, 106, 26, 0.3) !important;
    border-radius: 8px !important;
    text-align: center !important;
    padding: 8px 0 !important;
    font-size: 12px !important;
    font-weight: 800 !important;
    transition: transform 0.2s, opacity 0.2s, color 0.2s, background-color 0.2s !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
  }
  .game-card:hover .game-btn {
    background: var(--accent-gold) !important;
    color: #17100C !important;
    border-color: var(--rz-accent-text)!important;
  }

  /* كروت باقات الشحن الفردية */
  .products-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important;
    gap: 14px !important;
    padding: 10px 20px !important;
  }
  .products-grid .voucher-card {
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
    box-sizing: border-box !important;
    background: var(--bg-card) !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 14px !important;
    padding: 10px !important;
    transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
    text-decoration: none !important;
  }
  .products-grid .voucher-card:hover, 
  .products-grid .voucher-card:active {
    border-color: var(--rz-accent-text)!important;
    box-shadow: 0 0 12px rgba(255, 106, 26, 0.15) !important;
  }
  .voucher-thumb {
    width: 100% !important;
    height: 105px !important;
    overflow: hidden !important;
    border-radius: 10px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: var(--bg-main) !important;
    border: 1px solid var(--border-color) !important;
  }
  .voucher-thumb img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }
  .voucher-name {
    color: var(--text-light) !important;
    font-size: 13px !important;
    font-weight: 700 !important;
    margin-top: 8px !important;
    text-align: center !important;
  }
  .voucher-divider {
    border-top: 1px dashed var(--border-color) !important;
    margin: 8px 0 !important;
  }
  .voucher-bottom {
    display: flex !important;
    flex-direction: column !important;
    gap: 6px !important;
    align-items: center !important;
  }
  .voucher-price {
    color: var(--rz-accent-text)!important;
    font-size: 14px !important;
    font-weight: 900 !important;
  }
  .voucher-price small {
    font-size: 10px !important;
    color: var(--text-muted) !important;
  }
  .buy-btn {
    width: 100% !important;
    background: rgba(255, 106, 26, 0.08) !important;
    color: var(--rz-accent-text)!important;
    border: 1px solid var(--accent-gold) !important;
    border-radius: 8px !important;
    text-align: center !important;
    padding: 6px 0 !important;
    font-size: 12px !important;
    font-weight: 800 !important;
    transition: transform 0.2s, opacity 0.2s, color 0.2s, background-color 0.2s !important;
  }
  .voucher-card:hover .buy-btn {
    background: var(--accent-gold) !important;
    color: #17100C !important;
  }

  .section-title {
    color: var(--text-muted);
    padding: 20px 20px 5px 20px;
    font-size: 15px;
    font-weight: 700;
  }
</style>

<div class="section-title" id="resultsTitle">اكتب اسم اللعبة أو الباقة اللي تدور عليها</div>
<div class="products-grid" id="productsGrid"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
let rate = 0;
let searchTimeout = null;
let latestSearchId = 0;

function sanitizeSearchTerm(value) {
  return String(value || '')
    .normalize('NFKC')
    .replace(/[\u0000-\u001F\u007F<>%_\\,()]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 80);
}

async function init() {
  rate = await getExchangeRate();

  const params = new URLSearchParams(window.location.search);
  const initialQuery = sanitizeSearchTerm(params.get('q'));
  document.getElementById('searchInput').value = initialQuery;

  if (initialQuery) await search(initialQuery);

  document.getElementById('searchInput').addEventListener('input', (e) => {
    // تركيز وتأثير إضاءة الحدود
    e.target.style.borderColor = e.target.value ? 'var(--accent-gold)' : 'var(--border-color)';
    
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => search(e.target.value), 400);
  });
}

async function search(query) {
  const productsGrid = document.getElementById('productsGrid');
  const categoriesGrid = document.getElementById('categoriesGrid');
  const resultsTitle = document.getElementById('resultsTitle');
  const categoriesTitle = document.getElementById('categoriesTitle');
  const safeQuery = sanitizeSearchTerm(query);
  const searchId = ++latestSearchId;

  if (!safeQuery) {
    resultsTitle.textContent = 'اكتب اسم اللعبة أو الباقة اللي تدور عليها';
    categoriesTitle.style.display = 'none';
    productsGrid.innerHTML = '';
    categoriesGrid.innerHTML = '';
    return;
  }

  resultsTitle.textContent = 'جارِ البحث الفوري...';
  categoriesTitle.style.display = 'none';
  categoriesGrid.innerHTML = '';

  try {
    const [categoriesResponse, productsResponse] = await Promise.all([
      supabaseClient
        .from('categories')
        .select('*')
        .eq('is_active', true)
        .ilike('name', `%${safeQuery}%`)
        .order('display_order'),
      supabaseClient
        .from('products')
        .select('*')
        .eq('is_active', true)
        .ilike('name', `%${safeQuery}%`)
        .order('display_order')
    ]);

    if (searchId !== latestSearchId) return;
    if (categoriesResponse.error || productsResponse.error) throw new Error('search_failed');

    const categories = categoriesResponse.data;
    const products = productsResponse.data;
    const productResults = (products || []).map(p => ({ ...p, price_sdg: Number(p.price_usd) * Number(rate) }));
    const categoryResults = categories || [];

    // إعداد وضبط عناوين النتائج والمجاميع
    if (categoryResults.length === 0 && productResults.length === 0) {
      resultsTitle.textContent = 'لا توجد نتائج مطابقة، تأكد من كتابة الاسم الصحيح';
      productsGrid.innerHTML = '';
      return;
    }

    // عرض الألعاب/التصنيفات الموحدة إذا وُجدت
    if (categoryResults.length > 0) {
      categoriesTitle.style.display = 'block';
      categoriesTitle.textContent = `الألعاب والخدمات المطابقة (${categoryResults.length})`;
      
      categoriesGrid.innerHTML = categoryResults.map(cat => {
        const imgHtml = cat.image_url 
          ? `<img src="${escapeAttribute(sanitizeUrl(cat.image_url))}" alt="${escapeAttribute(cat.name)}" loading="lazy">`
          : `<div style="color:#70645C; font-size:32px;"><svg class="rz-i" aria-hidden="true"><use href="assets/icons/lucide-sprite.svg#i-gamepad-2"></use></svg></div>`;
        const descText = escapeHtml(cat.description ? cat.description : 'تصفح الباقات والشدات المتوفرة حصرياً');

        return `
          <a href="category.html?id=${encodeURIComponent(cat.id)}" class="game-card">
            <div class="game-thumb">${imgHtml}</div>
            <div class="game-info">
              <div class="game-name">${escapeHtml(cat.name)}</div>
              <div class="game-desc" title="${descText}">${descText}</div>
              <div class="game-btn">
                <span>عرض الباقات</span>
                <svg class="rz-i" style="font-size:10px;" aria-hidden="true"><use href="assets/icons/lucide-sprite.svg#i-chevron-left"></use></svg>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    // عرض باقات الشحن المباشرة المطابقة
    if (productResults.length > 0) {
      resultsTitle.textContent = `باقات الشحن المباشرة المطابقة (${productResults.length})`;
      productsGrid.innerHTML = productResults.map(p => `
        <a href="category.html?id=${encodeURIComponent(p.category_id)}" class="voucher-card">
          <div class="voucher-top">
            <div class="voucher-thumb">
              ${p.image_url ? `<img src="${escapeAttribute(sanitizeUrl(p.image_url))}" alt="${escapeAttribute(p.name)}" loading="lazy">` : '<div style="color:#70645C; font-size:24px;"><svg class="rz-i" aria-hidden="true"><use href="assets/icons/lucide-sprite.svg#i-package"></use></svg></div>'}
            </div>
            <div class="voucher-name">${escapeHtml(p.name)}</div>
          </div>
          <div class="voucher-divider"></div>
          <div class="voucher-bottom">
            <div class="voucher-price">${formatSDG(p.price_sdg)} <small>ج.س</small></div>
            <div class="buy-btn">اشترِ</div>
          </div>
        </a>
      `).join('');
    } else {
      resultsTitle.textContent = categoryResults.length > 0 ? 'نتائج باقات الشحن الفردية' : '';
      productsGrid.innerHTML = categoryResults.length > 0 ? `<div style="color:var(--text-muted); font-size:13px; padding:10px 20px;">اضغط على اللعبة في الأعلى لعرض كافة باقاتها المتوفرة.</div>` : '';
    }

  } catch (err) {
    console.error(err);
    resultsTitle.textContent = 'حدث خطأ غير متوقع أثناء البحث.';
  }
}

init();
</script>
