<link rel="stylesheet" href="assets/css/style.css">

<style>
  /* لوحة الألوان الملكية المتوافقة مع الهوية الجديدة للمتجر */
  :root {
    --bg-main: var(--mm-bg);         /* الورقي الصافي - خلفية الموقع */
    --bg-card: var(--mm-surface-2);         /* الورقي الخافت - خلفية البطاقات */
    --accent-gold: var(--mm-gold);     /* الذهبي - العنصر التفاعلي الأساسي */
    --border-color: var(--mm-border);    /* لون الحدود المتناسق */
    --text-light: var(--mm-text);      /* الحبري الداكن - لون النصوص */
    --text-muted: var(--mm-text-muted);      /* نصوص ثانوية مريحة */
  }

  body {
    background-color: var(--bg-main) !important;
    color: var(--text-light) !important;
    font-family: var(--font-display);
  }

  .site-header {
    background: var(--bg-card) !important;
    border-bottom: 1px solid var(--border-color) !important;
  }

  /* شبكة عرض كروت التصنيفات والألعاب */
  .categories-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)) !important;
    gap: 16px !important;
    padding: 10px 20px !important;
    margin-bottom: 30px;
  }

  /* كارت اللعبة الموحد */
  .game-card {
    background: var(--bg-card) !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 16px !important;
    padding: 12px !important;
    display: flex !important;
    flex-direction: column !important;
    transition: transform 0.25s ease-in-out, border-color 0.25s ease-in-out, box-shadow 0.25s ease-in-out, background-color 0.25s ease-in-out !important;
    text-decoration: none !important;
    position: relative !important;
    overflow: hidden !important;
  }
  .game-card:hover, .game-card:active {
    border-color: var(--mm-accent-text)!important;
    box-shadow: 0 0 15px rgba(255, 212, 0, 0.12) !important;
    transform: translateY(-2px) !important;
  }
  .game-thumb {
    width: 100% !important;
    height: 125px !important;
    overflow: hidden !important;
    border-radius: 12px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: var(--bg-main) !important;
    border: 1px solid var(--border-color) !important;
  }
  .game-thumb img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }
  .game-info {
    display: flex !important;
    flex-direction: column !important;
    flex-grow: 1 !important;
    margin-top: 10px !important;
  }
  .game-name {
    color: var(--text-light) !important;
    font-size: 14px !important;
    font-weight: 800 !important;
    text-align: right !important;
    margin-bottom: 4px !important;
  }
  .game-desc {
    color: var(--text-muted) !important;
    font-size: 11px !important;
    line-height: 1.4 !important;
    text-align: right !important;
    display: -webkit-box !important;
    -webkit-line-clamp: 2 !important;
    -webkit-box-orient: vertical !important;
    overflow: hidden !important;
    height: 30px !important;
    margin-bottom: 10px !important;
  }
  .game-btn {
    width: 100% !important;
    background: rgba(255, 212, 0, 0.06) !important;
    color: var(--mm-accent-text)!important;
    border: 1px solid rgba(255, 212, 0, 0.3) !important;
    border-radius: 8px !important;
    text-align: center !important;
    padding: 8px 0 !important;
    font-size: 12px !important;
    font-weight: 800 !important;
    transition: transform 0.2s, opacity 0.2s, color 0.2s, background-color 0.2s !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
  }
  .game-card:hover .game-btn {
    background: var(--accent-gold) !important;
    color: var(--mm-text) !important;
    border-color: var(--mm-accent-text)!important;
  }

  /* كروت باقات الشحن الفردية */
  .products-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important;
    gap: 14px !important;
    padding: 10px 20px !important;
  }
  .products-grid .voucher-card {
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
    box-sizing: border-box !important;
    background: var(--bg-card) !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 14px !important;
    padding: 10px !important;
    transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
    text-decoration: none !important;
  }
  .products-grid .voucher-card:hover, 
  .products-grid .voucher-card:active {
    border-color: var(--mm-accent-text)!important;
    box-shadow: 0 0 12px rgba(255, 212, 0, 0.15) !important;
  }
  .voucher-thumb {
    width: 100% !important;
    height: 105px !important;
    overflow: hidden !important;
    border-radius: 10px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: var(--bg-main) !important;
    border: 1px solid var(--border-color) !important;
  }
  .voucher-thumb img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }
  .voucher-name {
    color: var(--text-light) !important;
    font-size: 13px !important;
    font-weight: 700 !important;
    margin-top: 8px !important;
    text-align: center !important;
  }
  .voucher-divider {
    border-top: 1px dashed var(--border-color) !important;
    margin: 8px 0 !important;
  }
  .voucher-bottom {
    display: flex !important;
    flex-direction: column !important;
    gap: 6px !important;
    align-items: center !important;
  }
  .voucher-price {
    color: var(--mm-accent-text)!important;
    font-size: 14px !important;
    font-weight: 900 !important;
  }
  .voucher-price small {
    font-size: 10px !important;
    color: var(--text-muted) !important;
  }
  .buy-btn {
    width: 100% !important;
    background: rgba(255, 212, 0, 0.08) !important;
    color: var(--mm-accent-text)!important;
    border: 1px solid var(--accent-gold) !important;
    border-radius: 8px !important;
    text-align: center !important;
    padding: 6px 0 !important;
    font-size: 12px !important;
    font-weight: 800 !important;
    transition: transform 0.2s, opacity 0.2s, color 0.2s, background-color 0.2s !important;
  }
  .voucher-card:hover .buy-btn {
    background: var(--accent-gold) !important;
    color: var(--mm-text) !important;
  }

  .section-title {
    color: var(--text-muted);
    padding: 20px 20px 5px 20px;
    font-size: 15px;
    font-weight: 700;
  }
</style>
