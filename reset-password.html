<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلمة سر جديدة — RAIZEY STORE</title>
<link rel="icon" href="assets/brand/raizey-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-logo" aria-label="RAIZEY STORE — الرئيسية">
      <img src="assets/brand/raizey-store-logo.svg" alt="RAIZEY STORE" width="208" height="53">
    </a>
    <h1 class="auth-title">تعيين كلمة سر جديدة</h1>
    <p class="auth-sub">أدخل كلمة السر الجديدة لحسابك</p>

    <div class="field">
      <label>كلمة السر الجديدة</label>
      <input type="password" id="newPassword" minlength="8" placeholder="8 أحرف على الأقل">
    </div>

    <div class="field">
      <label>تأكيد كلمة السر</label>
      <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة السر">
    </div>

    <div class="form-error" id="formError"></div>
    <div class="form-success" id="formSuccess"></div>

    <button class="auth-btn" id="submitBtn" disabled>جارِ التحقق من الرابط...</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
const submitBtn = document.getElementById('submitBtn');
const errorBox = document.getElementById('formError');
const successBox = document.getElementById('formSuccess');
let recoveryReady = false;

async function initializeRecovery() {
  const params = new URLSearchParams(window.location.hash.slice(1));
  const recoveryToken = params.get('access_token');
  const isRecoveryLink = params.get('type') === 'recovery' && Boolean(recoveryToken);

  try {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    const tokenMatchesSession = session?.access_token === recoveryToken;
    if (error || !session || !isRecoveryLink || !tokenMatchesSession) {
      throw new Error('invalid recovery session');
    }

    recoveryReady = true;
    window.history.replaceState(null, '', window.location.pathname);
    submitBtn.disabled = false;
    submitBtn.textContent = 'حفظ كلمة السر الجديدة';
  } catch (_) {
    errorBox.textContent = 'الرابط غير صالح أو منتهي الصلاحية، اطلب رابطًا جديدًا';
    submitBtn.textContent = 'الرابط غير صالح';
  }
}

initializeRecovery();

document.getElementById('submitBtn').addEventListener('click', async () => {
  errorBox.textContent = '';
  successBox.textContent = '';

  if (!recoveryReady) {
    errorBox.textContent = 'الرابط غير صالح أو منتهي الصلاحية، اطلب رابطًا جديدًا';
    return;
  }

  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword.length < 8 || !/[A-Za-z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
    errorBox.textContent = 'كلمة السر لازم تكون 8 أحرف على الأقل وتحتوي على حرف ورقم';
    return;
  }
  if (newPassword !== confirmPassword) {
    errorBox.textContent = 'كلمة السر غير متطابقة';
    return;
  }

  recoveryReady = false;
  submitBtn.disabled = true;
  submitBtn.textContent = 'جارِ الحفظ...';

  try {
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
    if (error) throw error;

    await supabaseClient.auth.signOut({ scope: 'local' });
    window.history.replaceState(null, '', window.location.pathname);
    successBox.textContent = 'تم تغيير كلمة السر بنجاح، جارِ تحويلك لتسجيل الدخول...';
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  } catch (_) {
    errorBox.textContent = 'تعذر تغيير كلمة السر؛ قد يكون الرابط منتهي الصلاحية';
    submitBtn.textContent = 'اطلب رابطًا جديدًا';
  }
});
</script>
</body>
</html>
