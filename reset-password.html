<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6a1a">
<meta name="robots" content="noindex, nofollow">
<title>كلمة سر جديدة — RAIZEY STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">RAIZEY <span>STORE</span></div>
    <h1 class="auth-title">تعيين كلمة سر جديدة</h1>
    <p class="auth-sub" id="subText">جارِ التحقق من الرابط...</p>

    <!-- حالة الانتظار: نتأكد أولاً أن رابط الاستعادة صالح قبل عرض الفورم -->
    <div class="auth-state" id="loadingState" role="status" aria-live="polite">
      <span class="btn-spinner" aria-hidden="true" style="display:inline-block; vertical-align:-3px; margin-inline-end:8px;"></span>
      لحظة واحدة...
    </div>

    <!-- حالة رابط غير صالح / منتهي -->
    <div id="invalidState" class="hidden">
      <div class="form-error" role="alert">الرابط غير صالح أو انتهت صلاحيته. روابط إعادة التعيين صالحة لمدة 30 دقيقة وتُستخدم مرة واحدة فقط.</div>
      <a class="auth-btn" href="login.html" style="text-decoration:none;">اطلب رابط جديد</a>
    </div>

    <!-- الفورم -->
    <form id="resetForm" class="hidden" novalidate>
      <div class="field field-pw">
        <label for="newPassword">كلمة السر الجديدة</label>
        <input type="password" id="newPassword" name="new-password" required
               autocomplete="new-password" placeholder="كلمة سر قوية">
        <button type="button" class="pw-toggle" data-target="newPassword"
                aria-label="إظهار كلمة السر" aria-pressed="false">
          <i class="fa-regular fa-eye" aria-hidden="true"></i>
        </button>
        <div class="pw-strength-bar" aria-hidden="true"><div class="pw-strength-fill" id="pwStrengthFill"></div></div>
        <div class="pw-strength-label" id="pwStrengthLabel" aria-live="polite"></div>
        <ul class="pw-rules" id="pwRules"></ul>
      </div>

      <div class="field field-pw">
        <label for="confirmPassword">تأكيد كلمة السر</label>
        <input type="password" id="confirmPassword" name="confirm-password" required
               autocomplete="new-password" placeholder="أعد كتابة كلمة السر">
        <button type="button" class="pw-toggle" data-target="confirmPassword"
                aria-label="إظهار كلمة السر" aria-pressed="false">
          <i class="fa-regular fa-eye" aria-hidden="true"></i>
        </button>
      </div>

      <div class="form-error" id="formError" role="alert" aria-live="assertive"></div>
      <div class="form-success" id="formSuccess" role="status" aria-live="polite"></div>

      <button type="submit" class="auth-btn" id="submitBtn">حفظ كلمة السر الجديدة</button>

      <p class="auth-note">بعد الحفظ هيتم تسجيل خروجك من كل الأجهزة وتسجّل دخولك من جديد بكلمة السر الجديدة.</p>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-utils.js"></script>
<script>
(() => {
  'use strict';

  const subText      = document.getElementById('subText');
  const loadingState = document.getElementById('loadingState');
  const invalidState = document.getElementById('invalidState');
  const resetForm    = document.getElementById('resetForm');
  const errorBox     = document.getElementById('formError');
  const successBox   = document.getElementById('formSuccess');
  const submitBtn    = document.getElementById('submitBtn');
  const pwInput      = document.getElementById('newPassword');
  const pw2Input     = document.getElementById('confirmPassword');
  const pwRules      = document.getElementById('pwRules');
  const strengthFil  = document.getElementById('pwStrengthFill');
  const strengthLbl  = document.getElementById('pwStrengthLabel');

  AuthUI.initPasswordToggles();
  AuthUI.renderPasswordRules(pwRules, '');

  pwInput.addEventListener('input', () => {
    AuthUI.renderPasswordRules(pwRules, pwInput.value);
    AuthUI.renderPasswordStrength(strengthFil, strengthLbl, pwInput.value);
  });

  function showInvalid() {
    loadingState.classList.add('hidden');
    resetForm.classList.add('hidden');
    invalidState.classList.remove('hidden');
    subText.textContent = 'ما قدرنا نتحقق من رابط إعادة التعيين';
  }

  function showForm(userEmail) {
    loadingState.classList.add('hidden');
    invalidState.classList.add('hidden');
    resetForm.classList.remove('hidden');
    // textContent = آمن من XSS
    subText.textContent = userEmail
      ? 'أدخل كلمة السر الجديدة لحساب ' + userEmail
      : 'أدخل كلمة السر الجديدة لحسابك';
    pwInput.focus();
  }

  // ---------------------------------------------------------
  // البق القديم: getSession() كانت تُنادى فوراً، قبل ما ينتهي
  // detectSessionInUrl من تبادل توكن الاستعادة (عملية غير متزامنة)،
  // فتظهر رسالة "الرابط منتهي الصلاحية" لروابط صالحة تماماً.
  // الحل: ننتظر حدث PASSWORD_RECOVERY / SIGNED_IN مع مهلة أمان.
  // ---------------------------------------------------------
  (async function waitForRecoverySession() {
    if (!AuthUI.isClientReady()) { showInvalid(); return; }

    // لو الرابط رجع خطأ صريح من Supabase (توكن مستخدَم/منتهي) نعرضه فوراً
    const hashParams = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
    const queryParams = new URLSearchParams(window.location.search);
    if (hashParams.get('error') || queryParams.get('error')) { showInvalid(); return; }

    let settled = false;

    const finish = (session) => {
      if (settled) return;
      settled = true;
      if (subscription) { try { subscription.unsubscribe(); } catch (e) {} }
      clearTimeout(timer);
      // ننظّف التوكن من شريط العنوان حتى لا يُشارك أو يُسجَّل في الـ history
      if (window.location.hash || queryParams.get('code') || queryParams.get('token_hash')) {
        history.replaceState(null, '', window.location.pathname);
      }
      if (session) showForm(session.user && session.user.email);
      else showInvalid();
    };

    let subscription = null;
    try {
      const res = supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
          if (session) finish(session);
        }
      });
      subscription = res && res.data ? res.data.subscription : null;
    } catch (e) { /* نكمل بالفحص اليدوي */ }

    // مهلة أمان: لو ما وصل أي حدث خلال 6 ثوانٍ نفحص الجلسة يدوياً
    const timer = setTimeout(async () => {
      try {
        const { data } = await supabaseClient.auth.getSession();
        finish(data && data.session ? data.session : null);
      } catch (e) {
        finish(null);
      }
    }, 6000);

    // فحص فوري — لو الجلسة جاهزة بالفعل لا ننتظر شيئاً
    try {
      const { data } = await supabaseClient.auth.getSession();
      if (data && data.session) { finish(data.session); return; }
    } catch (e) { /* ننتظر الحدث */ }

    // لو ما في أي توكن استعادة في الرابط أصلاً، ما في داعي ننتظر 6 ثوانٍ
    const hasRecoveryToken =
      hashParams.get('access_token')  || hashParams.get('type') ||
      queryParams.get('code')         || queryParams.get('token_hash');
    if (!hasRecoveryToken) finish(null);
  })();

  // ---------- حفظ كلمة السر الجديدة ----------
  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    AuthUI.clearMessages(errorBox, successBox);
    pwInput.setAttribute('aria-invalid', 'false');
    pw2Input.setAttribute('aria-invalid', 'false');

    const newPassword = pwInput.value;
    const confirm     = pw2Input.value;

    const check = AuthUI.validatePassword(newPassword);
    if (!check.valid) {
      pwInput.setAttribute('aria-invalid', 'true');
      AuthUI.setMessage(errorBox, check.message);
      pwInput.focus();
      return;
    }
    if (newPassword !== confirm) {
      pw2Input.setAttribute('aria-invalid', 'true');
      AuthUI.setMessage(errorBox, 'كلمتا السر غير متطابقتين.');
      pw2Input.focus();
      return;
    }

    const restore = AuthUI.startLoading(submitBtn, 'جارِ الحفظ...');

    try {
      // نتأكد أن جلسة الاستعادة ما زالت صالحة لحظة الحفظ
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData || !sessionData.session) {
        restore();
        showInvalid();
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (error) {
        const msg = String(error.message || '').toLowerCase();
        if (msg.includes('same') || msg.includes('should be different')) {
          AuthUI.setMessage(errorBox, 'كلمة السر الجديدة لازم تكون مختلفة عن القديمة.');
        } else if (msg.includes('password')) {
          AuthUI.setMessage(errorBox, 'كلمة السر ما بتحقق الشروط المطلوبة أعلاه.');
        } else if (msg.includes('expired') || msg.includes('invalid') || msg.includes('session')) {
          restore();
          showInvalid();
          return;
        } else if (msg.includes('rate limit') || msg.includes('too many')) {
          AuthUI.setMessage(errorBox, 'محاولات كتيرة جداً. حاول بعد شوية.');
        } else if (msg.includes('failed to fetch') || msg.includes('network')) {
          AuthUI.setMessage(errorBox, 'فشل الاتصال بالإنترنت. تحقق من الشبكة وحاول مجدداً.');
        } else {
          AuthUI.setMessage(errorBox, 'ما قدرنا نغيّر كلمة السر. حاول مجدداً.');
        }
        restore();
        return;
      }

      AuthUI.setMessage(successBox, 'تم تغيير كلمة السر بنجاح. جارِ تحويلك لتسجيل الدخول...');
      pwInput.disabled = true;
      pw2Input.disabled = true;

      // إبطال جلسة الاستعادة وكل الجلسات الأخرى — التوكن ما ينفع يُعاد استخدامه
      try { await supabaseClient.auth.signOut({ scope: 'global' }); } catch (e) { /* تجاهل */ }
      try { sessionStorage.removeItem('redirect_after_login'); } catch (e) { /* تجاهل */ }

      setTimeout(() => { window.location.replace('login.html'); }, 1600);
    } catch (err) {
      AuthUI.setMessage(errorBox, 'حصل خطأ غير متوقع. حاول مجدداً.');
      restore();
    }
  });
})();
</script>
</body>
</html>
