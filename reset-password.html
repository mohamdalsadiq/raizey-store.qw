<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="https://js.sentry-cdn.com/b654a99332aedb9fbaf8e802ca53e55b.min.js" crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعيين كلمة سر جديدة — RAIZEY STORE</title>
<meta name="description" content="اختر كلمة سر جديدة وقوية لحسابك في RAIZEY STORE.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark"><img src="assets/img/raizey-logo-mark.svg" alt="شعار RAIZEY STORE"></span>
      <span class="brand-text">RAIZEY <em>STORE</em></span>
    </div>

    <div class="step-badge">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
      الخطوة 3 من 3 — كلمة سر جديدة
    </div>

    <h1 class="auth-title">تعيين كلمة سر جديدة</h1>
    <p class="auth-sub" id="subText">اختر كلمة سر قوية يصعب تخمينها</p>

    <div class="form-error" id="formError"></div>
    <div class="form-success" id="formSuccess"></div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="password">كلمة السر الجديدة</label>
        <div class="input-wrap">
          <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg></span>
          <input type="password" id="password" autocomplete="new-password" required placeholder="8 أحرف على الأقل">
          <span class="trail"><button type="button" class="icon-btn" data-toggle-password="password" aria-label="إظهار كلمة السر"></button></span>
        </div>
        <div class="pw-meter"><span id="pwStrengthFill"></span></div>
        <div class="pw-label" id="pwStrengthLabel"></div>
        <ul class="pw-rules" id="pwRules">
          <li data-rule="length"><span data-rule-icon></span> 8 أحرف فأكثر</li>
          <li data-rule="letter"><span data-rule-icon></span> حرف واحد على الأقل</li>
          <li data-rule="digit"><span data-rule-icon></span> رقم واحد على الأقل</li>
          <li data-rule="symbol"><span data-rule-icon></span> رمز خاص (اختياري)</li>
        </ul>
      </div>

      <div class="field">
        <label for="confirmPassword">تأكيد كلمة السر</label>
        <div class="input-wrap">
          <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><path d="M9.5 15.5l1.8 1.8 3.4-3.4"/></svg></span>
          <input type="password" id="confirmPassword" autocomplete="new-password" required placeholder="أعد كتابة كلمة السر">
          <span class="trail"><button type="button" class="icon-btn" data-toggle-password="confirmPassword" aria-label="إظهار كلمة السر"></button></span>
        </div>
        <div class="field-hint"></div>
      </div>

      <button type="submit" class="auth-btn" id="submitBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span>حفظ كلمة السر</span>
      </button>
    </form>

    <p class="auth-switch"><a href="login.html">العودة لتسجيل الدخول</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-ui.js"></script>
<script>
const UI = window.RaizeyAuthUI;
const errorBox = document.getElementById('formError');
const successBox = document.getElementById('formSuccess');
const submitBtn = document.getElementById('submitBtn');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirmPassword');
const form = document.getElementById('resetForm');

UI.bindPasswordToggles();
UI.bindPasswordStrength(
  passwordInput,
  document.getElementById('pwStrengthFill'),
  document.getElementById('pwStrengthLabel'),
  document.getElementById('pwRules')
);
UI.bindConfirmPassword(passwordInput, confirmInput);

const recoveryEmail = sessionStorage.getItem('recovery_email');
if (recoveryEmail) {
  document.getElementById('subText').innerHTML =
    'تم التحقق من <strong dir="ltr">' + recoveryEmail + '</strong> — اختر كلمة سر جديدة';
}

/* التأكد من وجود جلسة استعادة صالحة (كود أو رابط قديم) */
(async function guard() {
  const { data } = await supabaseClient.auth.getSession();
  if (!data.session) {
    form.querySelectorAll('input, button').forEach((el) => { el.disabled = true; });
    errorBox.textContent = 'انتهت صلاحية جلسة الاستعادة، اطلب كودًا جديدًا';
    setTimeout(() => { window.location.href = 'forgot-password.html'; }, 2200);
  }
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.textContent = '';
  successBox.textContent = '';

  const password = passwordInput.value;
  const confirmPassword = confirmInput.value;

  if (password.length < 8 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
    errorBox.textContent = 'كلمة السر لازم تكون 8 أحرف على الأقل وتحتوي على حرف ورقم';
    passwordInput.focus();
    return;
  }
  if (password !== confirmPassword) {
    errorBox.textContent = 'كلمة السر غير متطابقة';
    confirmInput.focus();
    return;
  }

  UI.setLoading(submitBtn, true, 'جارِ الحفظ...');

  try {
    const { error } = await supabaseClient.auth.updateUser({ password });

    if (error) {
      errorBox.textContent = error.status === 429
        ? 'محاولات كثيرة، حاول مرة أخرى بعد قليل'
        : 'تعذر تحديث كلمة السر، اطلب كودًا جديدًا وحاول مرة أخرى';
      return;
    }

    sessionStorage.removeItem('recovery_email');
    sessionStorage.removeItem('recovery_verified');
    successBox.textContent = 'تم تحديث كلمة السر بنجاح، جارِ فتح المتجر...';
    setTimeout(() => { window.location.href = 'index.html'; }, 900);
  } catch (_) {
    errorBox.textContent = 'تعذر تحديث كلمة السر الآن، حاول مرة أخرى';
  } finally {
    UI.setLoading(submitBtn, false);
  }
});
</script>
</body>
</html>
