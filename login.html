<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — RAIZEY STORE</title>
<meta name="description" content="سجّل دخولك إلى RAIZEY STORE لمتابعة طلباتك وشحن حسابك بأمان.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark"><img src="assets/img/raizey-logo-mark.svg" alt="شعار RAIZEY STORE"></span>
      <span class="brand-text">RAIZEY <em>STORE</em></span>
    </div>

    <h1 class="auth-title">تسجيل الدخول</h1>
    <p class="auth-sub">أهلاً بيك تاني — واصل من حيث توقفت</p>

    <div class="form-error" id="formError"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-wrap">
          <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg></span>
          <input type="email" id="email" autocomplete="email" required placeholder="example@email.com">
          <span class="trail"><span class="valid-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></span>
        </div>
        <div class="field-hint"></div>
      </div>

      <div class="field">
        <label for="password">كلمة السر</label>
        <div class="input-wrap">
          <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg></span>
          <input type="password" id="password" autocomplete="current-password" required placeholder="كلمة السر">
          <span class="trail"><button type="button" class="icon-btn" data-toggle-password="password" aria-label="إظهار كلمة السر"></button></span>
        </div>
        <div class="field-hint"></div>
      </div>

      <div class="row-between">
        <label class="check-line">
          <input type="checkbox" id="rememberMe" checked>
          <span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span>تذكرني</span>
        </label>
        <a class="link-muted" href="forgot-password.html">نسيت كلمة السر؟</a>
      </div>

      <button type="submit" class="auth-btn" id="submitBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h12"/></svg>
        <span>دخول</span>
      </button>
    </form>

    <section id="otpStep" hidden>
      <div class="step-badge">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg>
        الدخول بكود لمرة واحدة
      </div>
      <p class="auth-sub" id="otpSub">أرسلنا كودًا من 6 أرقام إلى بريدك</p>

      <form id="otpForm" novalidate>
        <div class="otp-inputs" id="otpBox" dir="ltr">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" autocomplete="one-time-code">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        </div>

        <div class="form-error" id="otpError"></div>
        <div class="form-success" id="otpSuccess"></div>

        <button type="submit" class="auth-btn" id="otpVerifyBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span>تأكيد الدخول</span>
        </button>
      </form>

      <div class="resend-row">
        <span>ما وصلك الكود؟</span>
        <button id="otpResendBtn" type="button" class="resend-btn" data-idle-label="إعادة إرسال الكود">إعادة إرسال الكود</button>
        <span class="timer" id="otpResendTimer"></span>
      </div>

      <p class="auth-switch"><a href="#" id="backToPassword">الرجوع لتسجيل الدخول بكلمة السر</a></p>
    </section>

    <div class="auth-divider">أو</div>
    <div class="social-login-row">
      <button type="button" class="social-btn" id="otpLoginBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg>
        <span>الدخول بكود يُرسل إلى بريدي</span>
      </button>
      <button type="button" class="social-btn" id="googleLoginBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.8l7.8 6C12.3 14 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.2 7.1-17.6z"/><path fill="#FBBC05" d="M10.4 28.2a14.6 14.6 0 0 1 0-8.4l-7.8-6a23.5 23.5 0 0 0 0 20.4l7.8-6z"/><path fill="#34A853" d="M24 47.5c6.2 0 11.5-2 15.4-5.4l-7.6-5.9c-2.1 1.4-4.8 2.3-7.8 2.3-6.4 0-11.7-4.5-13.6-10.3l-7.8 6C6.5 42.1 14.6 47.5 24 47.5z"/></svg>
        <span>المتابعة باستخدام جوجل</span>
      </button>
    </div>
    <div class="form-error" id="socialError" style="margin-top:12px;"></div>

    <p class="auth-switch">ما عندك حساب؟ <a href="register.html">أنشئ حساب جديد</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-ui.js"></script>
<script>
const UI = window.RaizeyAuthUI;
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('formError');
const submitBtn = document.getElementById('submitBtn');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');

UI.bindPasswordToggles();
UI.bindEmailValidation(emailInput);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.textContent = '';

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!UI.isValidEmail(email)) {
    UI.setFieldState(emailInput, 'invalid', 'أدخل بريدًا إلكترونيًا صالحًا');
    emailInput.focus();
    return;
  }
  if (!password) {
    UI.setFieldState(passwordInput, 'invalid', 'أدخل كلمة السر');
    passwordInput.focus();
    return;
  }

  UI.setLoading(submitBtn, true, 'جارِ الدخول...');

  try {
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      if (error.message.includes('Email not confirmed')) {
        sessionStorage.setItem('pending_email', email);
        window.location.href = 'verify.html';
        return;
      }
      errorBox.textContent = error.status === 429
        ? 'محاولات كثيرة، حاول مرة أخرى بعد قليل'
        : 'الإيميل أو كلمة السر غير صحيحة';
      return;
    }

    const savedRedirect = sessionStorage.getItem('redirect_after_login');
    sessionStorage.removeItem('redirect_after_login');

    if (savedRedirect) {
      try {
        const redirectUrl = new URL(savedRedirect, window.location.origin);
        if (redirectUrl.origin === window.location.origin) {
          window.location.assign(redirectUrl.href);
          return;
        }
      } catch (_) {
        // تجاهل أي رابط غير صالح والعودة إلى الصفحة الرئيسية.
      }
    }
    window.location.href = 'index.html';
  } catch (_) {
    errorBox.textContent = 'تعذر تسجيل الدخول الآن، حاول مرة أخرى';
  } finally {
    UI.setLoading(submitBtn, false);
  }
});

/* ===== الدخول بكود لمرة واحدة (قالب Magic Link في Supabase) ===== */
const otpStep = document.getElementById('otpStep');
const otpLoginBtn = document.getElementById('otpLoginBtn');
const otpForm = document.getElementById('otpForm');
const otpError = document.getElementById('otpError');
const otpSuccess = document.getElementById('otpSuccess');
const otpVerifyBtn = document.getElementById('otpVerifyBtn');
const otpResendBtn = document.getElementById('otpResendBtn');
const passwordViewEls = [form, ...document.querySelectorAll(
  '.auth-card > .auth-divider, .auth-card > .social-login-row, .auth-card > .auth-switch'
)];

const otp = UI.bindOtpInputs(document.getElementById('otpBox'), () => otpForm.requestSubmit());
const otpTimer = UI.createResendTimer(otpResendBtn, document.getElementById('otpResendTimer'), 60);
let otpEmail = '';

function showPasswordView() {
  otpStep.hidden = true;
  passwordViewEls.forEach((el) => { el.hidden = false; });
  document.getElementById('socialError').hidden = false;
}

function showOtpView(email) {
  otpEmail = email;
  passwordViewEls.forEach((el) => { el.hidden = true; });
  document.getElementById('socialError').hidden = true;
  otpStep.hidden = false;
  document.getElementById('otpSub').innerHTML =
    'أرسلنا كودًا من 6 أرقام إلى <strong dir="ltr">' + email + '</strong>';
  otp.clear();
  otp.focus();
}

async function sendLoginCode(email) {
  const { error } = await supabaseClient.auth.signInWithOtp({
    email,
    options: { shouldCreateUser: false }
  });
  if (error) throw error;
}

otpLoginBtn.addEventListener('click', async () => {
  errorBox.textContent = '';
  const email = emailInput.value.trim();

  if (!UI.isValidEmail(email)) {
    UI.setFieldState(emailInput, 'invalid', 'أدخل بريدك أولاً لإرسال الكود عليه');
    emailInput.focus();
    return;
  }

  UI.setLoading(otpLoginBtn, true, 'جارِ إرسال الكود...');
  try {
    await sendLoginCode(email);
    showOtpView(email);
    otpSuccess.textContent = 'إذا كان البريد مسجلاً لدينا فسيصلك الكود خلال لحظات';
    otpTimer.start(60);
  } catch (error) {
    errorBox.textContent = error.status === 429
      ? 'محاولات كثيرة، حاول مرة أخرى بعد قليل'
      : 'تعذر إرسال الكود الآن، حاول مرة أخرى';
  } finally {
    UI.setLoading(otpLoginBtn, false);
  }
});

otpForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  otpError.textContent = '';
  const code = otp.value();

  if (code.length !== 6) {
    otpError.textContent = 'أدخل الكود كاملاً (6 أرقام)';
    return;
  }

  UI.setLoading(otpVerifyBtn, true, 'جارِ التحقق...');
  try {
    const { error } = await supabaseClient.auth.verifyOtp({
      email: otpEmail,
      token: code,
      type: 'email'
    });

    if (error) {
      otpError.textContent = error.status === 429
        ? 'محاولات كثيرة، حاول مرة أخرى بعد قليل'
        : 'الكود غير صحيح أو منتهي الصلاحية';
      otp.clear();
      return;
    }

    otpSuccess.textContent = 'تم الدخول بنجاح، جارِ فتح المتجر...';
    setTimeout(() => { window.location.href = 'index.html'; }, 600);
  } catch (_) {
    otpError.textContent = 'تعذر التحقق الآن، حاول مرة أخرى';
  } finally {
    UI.setLoading(otpVerifyBtn, false);
  }
});

otpResendBtn.addEventListener('click', async () => {
  otpError.textContent = '';
  otpSuccess.textContent = '';
  otpTimer.start(60);
  try {
    await sendLoginCode(otpEmail);
    otpSuccess.textContent = 'تم إرسال كود جديد إلى بريدك';
  } catch (_) {
    otpError.textContent = 'تعذرت إعادة الإرسال، حاول بعد قليل';
  }
});

document.getElementById('backToPassword').addEventListener('click', (e) => {
  e.preventDefault();
  otpTimer.stop();
  otpError.textContent = '';
  otpSuccess.textContent = '';
  showPasswordView();
  passwordInput.focus();
});

document.getElementById('googleLoginBtn').addEventListener('click', async () => {
  const googleBtn = document.getElementById('googleLoginBtn');
  const socialError = document.getElementById('socialError');
  socialError.textContent = '';
  UI.setLoading(googleBtn, true, 'جارِ التحويل إلى جوجل...');

  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: new URL('index.html', window.location.href).href,
        queryParams: { prompt: 'select_account' }
      }
    });
    if (error) throw error;
  } catch (_) {
    socialError.textContent = 'تعذر بدء تسجيل الدخول بجوجل، حاول مرة أخرى';
    UI.setLoading(googleBtn, false);
  }
});
</script>
</body>
</html>
