<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="assets/js/pages/login.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">




<meta name="theme-color" content="#092A91" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#061A5C" media="(prefers-color-scheme: dark)">






<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — MEEM STORE</title>
<meta name="description" content="سجّل دخولك إلى MEEM STORE لمتابعة طلباتك وشحن حسابك بأمان.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="icon" sizes="any" href="assets/img/favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="assets/img/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MEEM STORE">
<meta property="og:title" content="تسجيل الدخول — MEEM STORE">
<meta property="og:description" content="سجّل دخولك إلى MEEM STORE لمتابعة طلباتك وشحن حسابك بأمان.">
<meta property="og:image" content="https://raizey-store-qw.vercel.app/assets/img/meem-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://raizey-store-qw.vercel.app/assets/img/meem-og.png">


<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">









<!-- MEEM UI system (tokens + components + icons + behaviour) -->
<link rel="stylesheet" href="assets/css/meem.css?v=20261020">
<script src="assets/js/meem-ui.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img class="brand-lockup" src="assets/img/meem-lockup-200.png"
        srcset="assets/img/meem-lockup-200.png 1x, assets/img/meem-lockup-400.png 2x"
        alt="MEEM STORE" width="304" height="200" decoding="async">
    </div>

    <h1 class="auth-title">تسجيل الدخول</h1>
    <p class="auth-sub">أهلاً بعودتك إلى MEEM STORE — تجربتك تبدأ من هنا</p>

    <div class="form-error" id="formError" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-wrap">
          <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg></span>
          <input type="email" id="email" autocomplete="email" required placeholder="example@email.com">
          <span class="trail"><span class="valid-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></span>
        </div>
        <div class="field-hint"></div>
      </div>

      <div class="field">
        <label for="password">كلمة السر</label>
        <div class="input-wrap">
          <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg></span>
          <input type="password" id="password" autocomplete="current-password" required placeholder="كلمة السر">
          <span class="trail"><button type="button" class="icon-btn" data-toggle-password="password" aria-label="إظهار كلمة السر"></button></span>
        </div>
        <div class="field-hint"></div>
      </div>

      <div class="row-between">
        <label class="check-line">
          <input type="checkbox" id="rememberMe" checked>
          <span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span>تذكرني</span>
        </label>
        <a class="link-muted" href="forgot-password.html">نسيت كلمة السر؟</a>
      </div>

      <button type="submit" class="auth-btn" id="submitBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h12"/></svg>
        <span>دخول</span>
      </button>
    </form>

    <button type="button" class="otp-mode-btn" id="otpModeBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/><path d="M8 16h8"/></svg>
      <span>الدخول بكود عبر البريد</span>
    </button>

    <section id="otpLoginPanel" hidden>
      <div class="step-badge">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
        دخول آمن بدون كلمة سر
      </div>
      <h2 class="auth-title">أدخل كود الدخول</h2>
      <p class="auth-sub" id="otpCodeSub"></p>

      <form id="otpLoginForm" novalidate>
        <div class="otp-inputs" id="loginOtpBox" dir="ltr">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" autocomplete="one-time-code" aria-label="الرقم الأول">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" aria-label="الرقم الثاني">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" aria-label="الرقم الثالث">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" aria-label="الرقم الرابع">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" aria-label="الرقم الخامس">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" aria-label="الرقم السادس">
        </div>

        <button type="submit" class="auth-btn" id="otpVerifyBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span>تحقق ودخول</span>
        </button>
      </form>

      <div class="resend-row">
        <span>ما وصلك الكود؟</span>
        <button id="otpResendBtn" type="button" class="resend-btn" data-idle-label="إعادة إرسال الكود">إعادة إرسال الكود</button>
        <span class="timer" id="otpResendTimer"></span>
      </div>
      <p class="auth-switch"><button type="button" class="link-button" id="changeOtpEmail">تغيير البريد الإلكتروني</button></p>
      <p class="auth-switch"><button type="button" class="link-button" id="backToPassword">العودة للدخول بكلمة السر</button></p>
    </section>

    <div class="auth-divider">أو</div>
    <div class="social-login-row">
      <button type="button" class="social-btn" id="googleLoginBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.8l7.8 6C12.3 14 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.2 7.1-17.6z"/><path fill="#FBBC05" d="M10.4 28.2a14.6 14.6 0 0 1 0-8.4l-7.8-6a23.5 23.5 0 0 0 0 20.4l7.8-6z"/><path fill="#34A853" d="M24 47.5c6.2 0 11.5-2 15.4-5.4l-7.6-5.9c-2.1 1.4-4.8 2.3-7.8 2.3-6.4 0-11.7-4.5-13.6-10.3l-7.8 6C6.5 42.1 14.6 47.5 24 47.5z"/></svg>
        <span>المتابعة باستخدام جوجل</span>
      </button>
    </div>
    <div class="form-error" id="socialError" role="alert" style="margin-top: 12px;"></div>

    <p class="auth-switch">ما عندك حساب؟ <a href="register.html">أنشئ حساب جديد</a></p>
  </div>
</div>

<script src="assets/vendor/supabase-2.118.0.min.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mfa-guard.js"></script>
<script src="assets/js/auth-ui.js"></script>
<script src="assets/js/pages/login-2.js"></script>
</body>
</html>
