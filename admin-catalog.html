<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="2;url=admin-categories.html">
  <title>إدارة الكتالوج — RAIZEY STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .catalog-compat-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .catalog-compat-card { width: min(100%, 560px); text-align: center; background: var(--bg-card, #fff); border: 1px solid var(--border, #e8e1d6); border-radius: 20px; padding: clamp(24px, 6vw, 48px); box-shadow: 0 18px 50px rgba(38, 32, 24, .08); }
    .catalog-compat-icon { width: 68px; height: 68px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 20px; color: var(--primary, #ff6a1a); background: rgba(255, 106, 26, .12); font-size: 28px; }
    .catalog-compat-card h1 { margin: 0 0 10px; font-family: Cairo, Tajawal, sans-serif; font-size: clamp(22px, 5vw, 30px); }
    .catalog-compat-card p { margin: 0 auto 22px; color: var(--text-muted, #7a7468); line-height: 1.8; }
    .catalog-compat-card a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; border-radius: 12px; color: var(--ink, #211f1b); background: var(--primary, #ff6a1a); font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main class="catalog-compat-page">
    <section class="catalog-compat-card" role="status" aria-live="polite">
      <div class="catalog-compat-icon"><i class="fas fa-layer-group" aria-hidden="true"></i></div>
      <h1>تم توحيد إدارة الكتالوج</h1>
      <p>تم إغلاق شاشة الهيكل المتداخلة. استخدم إدارة الأقسام لإدارة الأقسام الرئيسية، ثم إدارة المنتجات والباقات لإضافة المنتجات مباشرة داخل القسم.</p>
      <a href="admin-categories.html"><i class="fas fa-arrow-right" style="margin-left:8px" aria-hidden="true"></i> فتح إدارة الأقسام</a>
    </section>
  </main>
  <script>window.setTimeout(() => window.location.replace('admin-categories.html'), 1200);</script>
</body>
</html>
