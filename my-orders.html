<style>
  .orders-page {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  .order-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    transition: 0.2s ease;
  }
  .order-card:hover {
    border-color: rgba(255, 212, 0, 0.3);
  }
  .order-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--border);
  }
  .order-product {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
  }
  .order-date {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .status-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .status-pending_review { background: rgba(255, 212, 0,0.12); color: var(--mm-accent-text); }
  .status-in_progress    { background: rgba(255, 212, 0,0.12);  color: var(--mm-accent-text); }
  .status-completed      { background: rgba(34,197,94,0.12);   color: var(--mm-success); }
  .status-rejected       { background: rgba(255, 107, 107,0.12);   color: var(--mm-danger); }
  .status-cancelled      { background: rgba(120,120,120,0.12); color: var(--mm-text-muted);    }

  .order-details {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .order-details strong {
    color: var(--ink);
  }
  .order-fields-list {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-top: 4px;
  }
  .order-fields-list div {
    font-size: 12px;
    color: var(--ink);
    padding: 2px 0;
  }
  .order-rejection {
    background: rgba(255, 107, 107,0.08);
    border: 1px solid rgba(255, 107, 107,0.2);
    border-radius: 8px;
    padding: 10px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--mm-danger);
  }
  .cancel-order-btn {
    background: transparent;
    border: 1px solid var(--danger, var(--mm-danger-fill));
    color: var(--danger, var(--mm-danger));
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    transition: 0.2s;
  }
  .cancel-order-btn:hover {
    background: rgba(255, 107, 107,0.1);
  }
</style>
