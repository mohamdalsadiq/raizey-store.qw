<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>/* MEEM theme bootstrap: applies the saved theme before first paint */try{var t=localStorage.getItem('meem-theme')||localStorage.getItem('raizey-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة — MEEM STORE</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#092A91" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#061A5C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/img/favicon-512.png">
<link rel="icon" sizes="any" href="assets/img/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon-180.png">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/meem.css">
<script src="assets/js/meem-ui.js"></script>
</head>
<body>
<a class="mm-skip-link" href="#mainContent">تخطَّ إلى المحتوى</a>

<main class="auth-page" id="mainContent">
  <div class="auth-card" style="text-align: center;">
    <div class="auth-logo">
      <img class="brand-mark" src="assets/img/meem-mark-96.png"
           srcset="assets/img/meem-mark-96.png 1x, assets/img/meem-mark-192.png 2x"
           alt="MEEM STORE" width="96" height="96" decoding="async">
    </div>
    <h1 class="auth-title">هذه الصفحة غير موجودة</h1>
    <p style="color: var(--mm-text-muted); font-size: 14px; line-height: 1.8;">
      الرابط الذي فتحته غير صحيح أو تم نقل الصفحة. تقدر ترجع للرئيسية أو تبحث عن المنتج مباشرة.
    </p>
    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px;">
      <a class="mm-btn mm-btn--primary" href="index.html">العودة إلى الرئيسية</a>
      <a class="mm-btn mm-btn--ghost" href="search.html">البحث عن منتج</a>
    </div>
    <p style="margin-top: 22px;">
      <img class="brand-name" src="assets/img/meem-wordmark-28.png"
           srcset="assets/img/meem-wordmark-28.png 1x, assets/img/meem-wordmark-56.png 2x"
           alt="MEEM STORE" width="104" height="28" decoding="async">
    </p>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-brand">
    <img class="footer-logo" src="assets/img/meem-lockup-200.png"
         srcset="assets/img/meem-lockup-200.png 1x, assets/img/meem-lockup-400.png 2x"
         alt="MEEM STORE" width="304" height="200" loading="lazy" decoding="async">
    <p class="footer-copy"><img class="footer-mark" src="assets/img/meem-mark-48.png" alt="MEEM STORE"
         width="20" height="20" loading="lazy" decoding="async"> © 2026 MEEM STORE — جميع الحقوق محفوظة</p>
  </div>
</footer>

</html>
