<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<meta name="theme-color" content="#17100C" media="(prefers-color-scheme: dark)">






<meta charset="UTF-8">
<script src="https://js.sentry-cdn.com/b654a99332aedb9fbaf8e802ca53e55b.min.js" crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإشعارات — RAIZEY STORE</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
<style>
/* بطاقات الإشعارات — تصميم منظم (المهمة 36) */
.notif-card {
  display: flex; gap: 14px; align-items: flex-start;
  background: var(--card, #fffdf8);
  border: 1px solid var(--border, #eee3d0);
  border-radius: 18px; padding: 16px; margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(120, 80, 20, .05);
}
.notif-card.unread { border-color: var(--rz-accent-text); box-shadow: 0 0 0 1px var(--primary), 0 4px 14px rgba(200, 120, 30, .12); }
.notif-icon {
  flex: 0 0 46px; width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.notif-icon.success { background: rgba(22, 163, 74, .12); color: #16794F; }
.notif-icon.failed  { background: rgba(220, 38, 38, .10); color: #dc2626; }
.notif-icon.pending { background: rgba(217, 119, 6, .12); color: #d97706; }
.notif-icon.info    { background: rgba(255,101,0, .10); color: var(--rz-accent-text); }
.notif-body { flex: 1; min-width: 0; }
.notif-title { font-weight: 800; font-size: 15.5px; color: var(--ink); margin-bottom: 6px; }
.notif-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.notif-order {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  direction: ltr; unicode-bidi: embed;
  background: rgba(200, 120, 30, .10); color: var(--rz-accent-text);
  border: 1px solid rgba(200, 120, 30, .25);
  padding: 2px 10px; border-radius: 8px;
}
.notif-msg { font-size: 13.5px; color: var(--text-muted); line-height: 1.8; }
.notif-date { display: inline-flex; align-items: center; gap: 5px; }
</style>









<!-- RAIZEY UI system (tokens + components + icons + behaviour) -->
<link rel="stylesheet" href="assets/css/raizey.css">
<script src="assets/js/raizey-ui.js"></script>
</head>
<body>
<a class="rz-skip-link" href="#mainContent">تخطَّ إلى المحتوى</a>

<div class="orders-page" id="mainContent" tabindex="-1">
  <div class="page-header">
    <h1>الإشعارات</h1>
    <a href="index.html" class="back-link">→ المتجر</a>
  </div>
  <div id="notifList"><div style="text-align:center; padding:40px 0; color:var(--text-muted);">جارِ التحميل...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
async function init() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const { data: notifications } = await supabaseClient
    .from('notifications')
    .select('*')
    .eq('user_id', session.user.id)
    .order('created_at', { ascending: false });

  render(notifications || []);

  const unreadIds = (notifications || []).filter(n => !n.is_read).map(n => n.id);
  if (unreadIds.length > 0) {
    await supabaseClient.from('notifications').update({ is_read: true }).in('id', unreadIds);
  }
}

/* أيقونات SVG احترافية لحالات الإشعار — ممنوع الإيموجي */
const NOTIF_ICONS = {
  success: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>',
  failed: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>',
  pending: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3.5 2"/></svg>',
  info: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>'
};

function notifStatus(n) {
  const t = (n.title || '') + ' ' + (n.message || '');
  if (/إلغاء|ملغ|فشل|مرفوض|رفض/.test(t)) return 'failed';
  if (/اكتمل بنجاح|تم تنفيذ/.test(t)) return 'success';
  if (/قيد التنفيذ|تم تأكيد|بانتظار|قيد المراجعة|تدقيق/.test(t)) return 'pending';
  return 'info';
}

function render(notifications) {
  const container = document.getElementById('notifList');
  if (notifications.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--text-muted);"><h3 style="color:var(--ink); margin-bottom:8px;">لا توجد إشعارات بعد</h3></div>`;
    return;
  }

  container.innerHTML = notifications.map(n => {
    const st = notifStatus(n);
    const date = new Date(n.created_at).toLocaleDateString('ar-EG', {
      year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    const orderMatch = (n.message || '').match(/#(\d+)/);
    const orderNo = orderMatch ? orderMatch[1] : null;
    const cleanMsg = (n.message || '').replace(/#\d+\s*/, '');
    return `
      <div class="notif-card${!n.is_read ? ' unread' : ''}">
        <div class="notif-icon ${st}">${NOTIF_ICONS[st]}</div>
        <div class="notif-body">
          <div class="notif-title">${escapeHtml(n.title)}</div>
          <div class="notif-meta">
            ${orderNo ? `<span class="notif-order">#${escapeHtml(orderNo)}</span>` : ''}
            <span class="notif-date">${escapeHtml(date)}</span>
          </div>
          <div class="notif-msg">${escapeHtml(cleanMsg)}</div>
        </div>
      </div>
    `;
  }).join('');
}

init();
</script>
  <script src="assets/js/raizey-assistant.js"></script>
</body>
</html>
