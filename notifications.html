<style>
/* بطاقات الإشعارات — تصميم منظم (المهمة 36) */
.notif-card {
  display: flex; gap: 14px; align-items: flex-start;
  background: var(--card, var(--mm-surface));
  border: 1px solid var(--mm-border, #1B3AA0);
  border-radius: 18px; padding: 16px; margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(120, 80, 20, .05);
}
.notif-card.unread { border-color: var(--mm-accent-text); box-shadow: 0 0 0 1px var(--primary), 0 4px 14px rgba(200, 120, 30, .12); }
.notif-icon {
  flex: 0 0 46px; width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.notif-icon.success { background: rgba(22, 163, 74, .12); color: var(--mm-success); }
.notif-icon.failed  { background: rgba(220, 38, 38, .10); color: var(--mm-danger); }
.notif-icon.pending { background: rgba(217, 119, 6, .12); color: var(--mm-warning); }
.notif-icon.info    { background: rgba(255, 212, 0, .10); color: var(--mm-accent-text); }
.notif-body { flex: 1; min-width: 0; }
.notif-title { font-weight: 800; font-size: 15.5px; color: var(--ink); margin-bottom: 6px; }
.notif-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.notif-order {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  direction: ltr; unicode-bidi: embed;
  background: rgba(200, 120, 30, .10); color: var(--mm-accent-text);
  border: 1px solid rgba(200, 120, 30, .25);
  padding: 2px 10px; border-radius: 8px;
}
.notif-msg { font-size: 13.5px; color: var(--text-muted); line-height: 1.8; }
.notif-date { display: inline-flex; align-items: center; gap: 5px; }
</style>
