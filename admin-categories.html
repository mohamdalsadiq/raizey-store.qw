<style>
  /* تحسينات بسيطة لأزرار التحكم لتظهر بشكل فخم ومريح للعين */
  .admin-action-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .admin-action-btn:hover {
    border-color: var(--mm-accent-text);
    background: var(--bg-card);
  }
  .manage-item-actions {
    display: flex;
    gap: 8px;
  }
  /* ستايل مخصص لعرض صور التصنيفات الاحترافية في القائمة */
  .category-thumb {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-left: 12px;
  }
  .manage-item-info {
    display: flex;
    align-items: center;
  }
  .category-meta-text {
    display: flex;
    flex-direction: column;
  }
  .admin-inline-notice {
    margin: 12px 0 16px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-card);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.7;
  }
  .admin-inline-notice.error {
    border-color: rgba(255, 107, 107,.35);
    background: rgba(255, 107, 107,.08);
    color: var(--mm-danger);
  }
  .admin-inline-notice.success {
    border-color: rgba(22,163,74,.3);
    background: rgba(22,163,74,.08);
    color: var(--mm-success);
  }
</style>









<!-- MEEM UI system (tokens + components + icons + behaviour) -->
<link rel="stylesheet" href="assets/css/meem.css?v=20261020">
<script src="assets/js/meem-ui.js"></script>
<link rel="stylesheet" href="assets/css/whatsapp-onboarding.css">
</head>
<body>
<a class="mm-skip-link" href="#mainContent">تخطَّ إلى المحتوى</a>

<div class="admin-page" id="adminPage" style="display: none;">
  <div class="page-header">
    <h1>إدارة التصنيفات</h1>
    <a href="index.html" class="back-link"><svg class="mm-i" style="margin-left: 4px;" aria-hidden="true"><use href="assets/icons/lucide-sprite.svg#i-store"></use></svg> المتجر</a>
  
    <div class="admin-brand">
      <img class="admin-brand-mark" src="assets/img/meem-mark-48.png"
           srcset="assets/img/meem-mark-48.png 1x, assets/img/meem-mark-96.png 2x"
           alt="MEEM STORE" width="36" height="36" decoding="async">
      <img class="admin-brand-name" src="assets/img/meem-wordmark-28.png"
           srcset="assets/img/meem-wordmark-28.png 1x, assets/img/meem-wordmark-56.png 2x"
           alt="MEEM STORE" width="90" height="24" decoding="async">
    </div>
  </div>

  <div class="admin-nav">
    <a href="admin.html">الرئيسية</a>
    <a href="admin-orders.html">الطلبات</a>
    <a href="admin-topups.html">شحن المحافظ</a>
    <a href="admin-products.html">المنتجات</a>
    <a href="admin-categories.html" class="active">التصنيفات</a>
    <a href="admin-banners.html">البنرات</a>
    <a href="admin-customers.html">العملاء</a>
    <a href="admin-payment-methods.html">وسائل الدفع</a>
    <a href="admin-settings.html">الإعدادات</a>
    <a href="admin-audit-log.html">سجل النشاطات</a>
  </div>

  <button class="add-new-btn" id="addNewBtn">+ إضافة تصنيف جديد</button>
  <div id="categoriesNotice" class="admin-inline-notice" role="status" aria-live="polite" hidden></div>

  <div id="categoriesList"><div style="color: var(--text-muted); font-size: 13px;">جارِ التحميل...</div></div>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal-box">
    <div class="modal-title" id="formModalTitle">تصنيف جديد</div>

    <div class="field">
      <label for="sectionInput">القسم الذي يظهر تحته التصنيف</label>
      <select id="sectionInput" style="width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: var(--ink); font-family: inherit;">
        <option value="">اختر القسم أولًا</option>
      </select>
    </div>

    <div class="field">
      <label>اسم التصنيف</label>
      <input type="text" id="nameInput" placeholder="مثلاً: PUBG Mobile">
    </div>

    <div class="field">
      <label>وصف التصنيف</label>
      <textarea id="descriptionInput" placeholder="اكتب وصفاً مختصراً وفخماً يظهر للعملاء في صفحة الباقات..." rows="3" style="width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: var(--ink); font-family: inherit; resize: vertical;"></textarea>
    </div>

    <div class="field">
      <label>صورة التصنيف (أيقونة اللعبة)</label>
      <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/webp" style="background: var(--bg); border: 1px solid var(--border); padding: 8px; border-radius: 8px; width: 100%; color: var(--ink);">
      <input type="hidden" id="imageUrlInput">
      <div id="imageUploadStatus" style="font-size: 12px; color: var(--text-muted); margin-top: 4px;"></div>
    </div>

    <div class="field">
      <label>أيقونة التصنيف</label>
      <div id="categoryIconPicker"></div>
    </div>

    <div class="field">
      <label>ترتيب العرض</label>
      <input type="number" id="orderInput" placeholder="0">
    </div>

    <div class="field">
      <label>نسبة عمولة الإحالة لهذا التصنيف (%)</label>
      <input type="number" id="commissionInput" step="0.1" placeholder="مثلاً: 3">
    </div>

    <div class="field">
      <label>الحالة</label>
      <select id="activeInput">
        <option value="true">فعّال (يظهر للعملاء)</option>
        <option value="false">غير فعّال (مخفي)</option>
      </select>
    </div>

    <div class="form-error" id="formError"></div>

    <div class="modal-actions">
      <button class="modal-cancel-btn" id="formCancelBtn">إلغاء</button>
      <button class="modal-confirm-btn" id="formSaveBtn" style="background: var(--primary); color: var(--mm-on-primary);">حفظ</button>
    </div>
  </div>
</div>

<div id="accessDenied" style="display: none; text-align: center; padding: 80px 20px; color: var(--text-muted);">
  <h3 style="color: var(--ink); margin-bottom: 8px;">غير مصرح لك بالدخول</h3>
  <a href="index.html" style="color: var(--mm-accent-text); font-weight: 700;">← رجوع للمتجر</a>
</div>
