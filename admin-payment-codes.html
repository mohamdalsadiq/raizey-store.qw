<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="assets/js/pages/admin-payment-codes.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">




<meta name="theme-color" content="#092A91" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#061A5C" media="(prefers-color-scheme: dark)">






<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رموز الدفع — MEEM STORE</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="icon" sizes="any" href="assets/img/favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="assets/img/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon-180.png">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
<link rel="stylesheet" href="assets/css/admin.css">
<style>
  .code-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .code-value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--mm-accent-text); letter-spacing: 1px; }
  .code-meta { font-size: 12.5px; color: var(--text-muted); line-height: 1.9; margin-top: 6px; }
  .code-state { font-size: 11.5px; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
  .state-active { background: rgba(34,197,94,.14); color: var(--mm-success); }
  .state-used { background: rgba(148,163,184,.18); color: var(--mm-text-muted); }
  .state-expired { background: rgba(255, 107, 107,.12); color: var(--mm-danger); }
  .state-cancelled { background: rgba(255, 107, 107,.12); color: var(--mm-danger); }
</style>









<!-- MEEM UI system (tokens + components + icons + behaviour) -->
<link rel="stylesheet" href="assets/css/meem.css">
<script src="assets/js/meem-ui.js"></script>
</head>
<body>
<a class="mm-skip-link" href="#mainContent">تخطَّ إلى المحتوى</a>

<div class="admin-page" id="adminPage" style="display: none;">
  <div class="page-header">
    <h1>رموز الدفع</h1>
    <a href="admin.html" class="back-link">→ لوحة التحكم</a>
  
    <div class="admin-brand">
      <img class="admin-brand-mark" src="assets/img/meem-mark-48.png"
           srcset="assets/img/meem-mark-48.png 1x, assets/img/meem-mark-96.png 2x"
           alt="MEEM STORE" width="36" height="36" decoding="async">
      <img class="admin-brand-name" src="assets/img/meem-wordmark-28.png"
           srcset="assets/img/meem-wordmark-28.png 1x, assets/img/meem-wordmark-56.png 2x"
           alt="MEEM STORE" width="90" height="24" decoding="async">
    </div>
  </div>

  <p style="font-size: 12.5px; color: var(--text-muted); line-height: 1.8; margin-top: 0;">
    رمز الدفع وسيلة تسوية يدوية آمنة: تُعطيه للعميل فيُتِم طلبه بدون إيصال. كل رمز يُستخدم مرة واحدة فقط.
  </p>

  <button class="add-new-btn" id="addNewBtn">+ توليد رمز جديد</button>

  <div class="filter-chips" style="margin: 10px 0;">
    <button class="chip active" data-filter="all">الكل</button>
    <button class="chip" data-filter="active">نشط</button>
    <button class="chip" data-filter="used">مستخدم</button>
    <button class="chip" data-filter="expired">منتهٍ</button>
    <button class="chip" data-filter="cancelled">ملغى</button>
  </div>

  <div id="codesList"><div style="color: var(--text-muted); font-size: 13px;">جارِ التحميل...</div></div>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal-box">
    <div class="modal-title">رمز دفع جديد</div>

    <div class="field">
      <label>المبلغ (ج.س) *</label>
      <input type="number" id="amountInput" placeholder="مثلاً: 50000">
    </div>

    <div class="field">
      <label>ملاحظة (تظهر لك أنت فقط)</label>
      <input type="text" id="noteInput" placeholder="مثلاً: تسوية مبلغ ناقص للعميل أحمد">
    </div>

    <div class="field">
      <label>تخصيص لعميل (اختياري — اكتب رقم واتساب العميل)</label>
      <input type="text" id="customerInput" placeholder="مثلاً: 0912345678">
      <div id="customerHint" style="font-size: 12px; color: var(--text-muted); margin-top: 4px;"></div>
    </div>

    <div class="field">
      <label>تاريخ الانتهاء (اختياري)</label>
      <input type="date" id="expiresInput">
    </div>

    <div class="form-error" id="formError"></div>

    <div class="modal-actions">
      <button class="modal-cancel-btn" id="formCancelBtn">إلغاء</button>
      <button class="modal-confirm-btn" id="formSaveBtn" style="background: var(--primary); color: var(--mm-on-primary);">توليد الرمز</button>
    </div>
  </div>
</div>

<div id="accessDenied" style="display: none; text-align: center; padding: 80px 20px; color: var(--text-muted);">
  <h3 style="color: var(--ink); margin-bottom: 8px;">غير مصرح لك بالدخول</h3>
  <a href="index.html" style="color: var(--mm-accent-text); font-weight: 700;">← رجوع للمتجر</a>
</div>

<script src="assets/vendor/supabase-2.118.0.min.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mfa-guard.js"></script>
<script src="assets/js/pages/admin-payment-codes-2.js"></script>
<script src="assets/js/admin-nav.js"></script>
</body>
</html>
