<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعادة كلمة السر — RAIZEY STORE</title>
<meta name="description" content="استعد كلمة سر حسابك في RAIZEY STORE عبر كود مكوّن من 6 أرقام يصلك على بريدك.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark"><img src="assets/img/raizey-logo-mark.svg" alt="شعار RAIZEY STORE"></span>
      <span class="brand-text">RAIZEY <em>STORE</em></span>
    </div>

    <div class="step-badge" id="stepBadge">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0"/></svg>
      الخطوة 1 من 3 — تحديد الحساب
    </div>

    <div class="form-error" id="formError"></div>
    <div class="form-success" id="formSuccess"></div>

    <!-- الخطوة 1: البريد -->
    <section id="stepEmail">
      <h1 class="auth-title">نسيت كلمة السر؟</h1>
      <p class="auth-sub">اكتب بريدك وسنرسل لك كودًا من 6 أرقام</p>

      <form id="emailForm" novalidate>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <div class="input-wrap">
            <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg></span>
            <input type="email" id="email" autocomplete="email" required placeholder="example@email.com">
            <span class="trail"><span class="valid-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></span>
          </div>
          <div class="field-hint"></div>
        </div>

        <button type="submit" class="auth-btn" id="sendBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10.5 13.5"/><path d="M21 3l-6.8 18-3.7-7.5L3 9.8 21 3z"/></svg>
          <span>إرسال الكود</span>
        </button>
      </form>
    </section>

    <!-- الخطوة 2: الكود -->
    <section id="stepCode" hidden>
      <h1 class="auth-title">أدخل كود التحقق</h1>
      <p class="auth-sub" id="codeSub"></p>

      <form id="codeForm" novalidate>
        <div class="otp-inputs" id="otpBox" dir="ltr">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" autocomplete="one-time-code">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
          <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        </div>

        <button type="submit" class="auth-btn" id="verifyBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span>تحقق من الكود</span>
        </button>
      </form>

      <div class="resend-row">
        <span>ما وصلك الكود؟</span>
        <button id="resendBtn" type="button" class="resend-btn" data-idle-label="إعادة إرسال الكود">إعادة إرسال الكود</button>
        <span class="timer" id="resendTimer"></span>
      </div>

      <p class="auth-switch"><a href="#" id="changeEmail">تغيير البريد الإلكتروني</a></p>
    </section>

    <p class="auth-switch">تذكرت كلمة السر؟ <a href="login.html">العودة لتسجيل الدخول</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-ui.js"></script>
<script>
const UI = window.RaizeyAuthUI;
const errorBox = document.getElementById('formError');
const successBox = document.getElementById('formSuccess');
const stepBadge = document.getElementById('stepBadge');
const stepEmail = document.getElementById('stepEmail');
const stepCode = document.getElementById('stepCode');
const emailInput = document.getElementById('email');
const sendBtn = document.getElementById('sendBtn');
const verifyBtn = document.getElementById('verifyBtn');
const resendBtn = document.getElementById('resendBtn');

let targetEmail = '';

UI.bindEmailValidation(emailInput);
const otp = UI.bindOtpInputs(document.getElementById('otpBox'), () => document.getElementById('codeForm').requestSubmit());
const timer = UI.createResendTimer(resendBtn, document.getElementById('resendTimer'), 60);

function clearMessages() {
  errorBox.textContent = '';
  successBox.textContent = '';
}

async function sendCode(email) {
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
  if (error && error.status === 429) throw new Error('rate');
  if (error) throw new Error('fail');
}

document.getElementById('emailForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMessages();

  const email = emailInput.value.trim();
  if (!UI.isValidEmail(email)) {
    UI.setFieldState(emailInput, 'invalid', 'صيغة البريد غير صحيحة');
    emailInput.focus();
    return;
  }

  UI.setLoading(sendBtn, true, 'جارِ الإرسال...');
  try {
    await sendCode(email);
    targetEmail = email;
    stepEmail.hidden = true;
    stepCode.hidden = false;
    stepBadge.lastChild.textContent = ' الخطوة 2 من 3 — إدخال الكود';
    document.getElementById('codeSub').innerHTML =
      'أرسلنا كودًا من 6 أرقام إلى <strong dir="ltr">' + email + '</strong>';
    successBox.textContent = 'إذا كان البريد مسجلاً لدينا فسيصلك الكود خلال لحظات';
    timer.start(60);
    otp.focus();
  } catch (err) {
    errorBox.textContent = err.message === 'rate'
      ? 'محاولات كثيرة، حاول مرة أخرى بعد قليل'
      : 'تعذر إرسال الكود الآن، حاول مرة أخرى';
  } finally {
    UI.setLoading(sendBtn, false);
  }
});

document.getElementById('codeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMessages();

  const code = otp.value();
  if (code.length !== 6) {
    errorBox.textContent = 'أدخل الكود كاملاً (6 أرقام)';
    return;
  }

  UI.setLoading(verifyBtn, true, 'جارِ التحقق...');
  try {
    const { error } = await supabaseClient.auth.verifyOtp({
      email: targetEmail,
      token: code,
      type: 'recovery'
    });

    if (error) {
      errorBox.textContent = error.status === 429
        ? 'محاولات كثيرة، حاول مرة أخرى بعد قليل'
        : 'الكود غير صحيح أو منتهي الصلاحية';
      otp.clear();
      return;
    }

    sessionStorage.setItem('recovery_email', targetEmail);
    sessionStorage.setItem('recovery_verified', '1');
    window.location.href = 'reset-password.html';
  } catch (_) {
    errorBox.textContent = 'تعذر التحقق الآن، حاول مرة أخرى';
  } finally {
    UI.setLoading(verifyBtn, false);
  }
});

resendBtn.addEventListener('click', async () => {
  clearMessages();
  timer.start(60);
  try {
    await sendCode(targetEmail);
    successBox.textContent = 'تم إرسال كود جديد إلى بريدك';
  } catch (err) {
    errorBox.textContent = err.message === 'rate'
      ? 'محاولات كثيرة، انتظر قليلاً قبل إعادة المحاولة'
      : 'تعذرت إعادة الإرسال، حاول بعد قليل';
  }
});

document.getElementById('changeEmail').addEventListener('click', (e) => {
  e.preventDefault();
  clearMessages();
  timer.stop();
  otp.clear();
  stepCode.hidden = true;
  stepEmail.hidden = false;
  stepBadge.lastChild.textContent = ' الخطوة 1 من 3 — تحديد الحساب';
  emailInput.focus();
});
</script>
</body>
</html>
