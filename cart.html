<style>
  body { 
    background-color: var(--bg) !important; 
    color: var(--ink) !important; 
    margin: 0;
    padding: 0;
  }

  .cart-container {
    padding: 20px 16px;
    max-width: 600px;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .cart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .back-link {
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--mm-accent-text); }

  .clear-cart-btn {
    background: transparent;
    border: none;
    color: var(--danger, var(--mm-danger));
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .clear-cart-btn:hover { background: rgba(255, 107, 107, 0.1); }

  .cart-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 20px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cart-title i { color: var(--mm-accent-text); }

  .cart-item-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    transition: border-color 0.2s;
  }
  .cart-item-row:hover { border-color: rgba(255, 212, 0, 0.3); }

  .cart-item-thumb {
    width: 65px;
    height: 65px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cart-item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cart-item-details { flex: 1; min-width: 0; }

  .cart-item-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cart-item-meta {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
    word-break: break-word;
  }
  .cart-item-meta span {
    color: var(--mm-accent-text);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
  }

  .cart-item-price {
    font-size: 13px;
    font-weight: 700;
    color: var(--mm-accent-text);
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  .cart-qty-stepper {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .cart-qty-stepper button {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1.5px solid var(--primary);
    background: transparent;
    color: var(--mm-accent-text);
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    user-select: none;
  }
  .cart-qty-stepper button:active { transform: scale(0.92); }
  .cart-qty-stepper button:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--border); color: var(--text-muted); }
  .cart-qty-stepper .qty-value {
    min-width: 24px;
    text-align: center;
    font-size: 15px;
    font-weight: 900;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
  }

  .remove-item-btn {
    background: transparent;
    border: none;
    color: var(--danger, var(--mm-danger));
    font-size: 16px;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: 0.15s ease;
    align-self: flex-start;
  }
  .remove-item-btn:hover { background: rgba(255, 107, 107, 0.1); }

  .summary-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0 16px 0;
  }
  .summary-box .label { font-size: 14px; font-weight: 700; color: var(--ink); }
  .summary-box .total { 
    font-weight: 900; 
    font-size: 20px; 
    color: var(--mm-accent-text); 
    font-family: 'JetBrains Mono', monospace;
  }

  .btn-proceed-checkout {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    background: var(--primary);
    border: none;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: 0.15s ease;
    text-decoration: none;
    box-sizing: border-box;
  }
  .btn-proceed-checkout:active { transform: scale(0.98); }

  .empty-cart-box {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-top: 20px;
  }
  .empty-cart-icon {
    font-size: 48px;
    color: var(--text-muted);
    opacity: 0.4;
    margin-bottom: 16px;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
let currentUser = null;
let cart = [];
let grandTotal = 0;

function safeFormatSDG(val) {
  if (typeof formatSDG === 'function') return formatSDG(val);
  const num = Math.round(val || 0);
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

async function init() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      sessionStorage.setItem('redirect_after_login', window.location.href);
      window.location.href = 'login.html';
      return;
    }
    currentUser = session.user;
  } catch (e) {
    console.error('[MEEM] Session check error:', e);
  }

  loadCartData();
}

function loadCartData() {
  try {
    cart = JSON.parse(localStorage.getItem('meem_store_cart')) || [];
  } catch (e) {
    cart = [];
  }
  
  document.getElementById('loadingBox').style.display = 'none';

  if (!cart || cart.length === 0) {
    showEmptyCartState();
    return;
  }

  renderCart();
}

function showEmptyCartState() {
  document.getElementById('cartContent').style.display = 'none';
  document.getElementById('clearCartBtn').style.display = 'none';
  document.getElementById('emptyCartBox').style.display = 'block';
}

function renderCart() {
  document.getElementById('emptyCartBox').style.display = 'none';
  document.getElementById('cartContent').style.display = 'block';
  document.getElementById('clearCartBtn').style.display = 'inline-flex';

  const listContainer = document.getElementById('cartItemsList');
  grandTotal = 0;

  listContainer.innerHTML = cart.map((item, index) => {
    const qty = (item.quantity && item.quantity > 0) ? item.quantity : 1;
    const unitPrice = parseFloat(item.price_sdg) || 0;
    const lineSubtotal = unitPrice * qty;
    grandTotal += lineSubtotal;
    
    const metaText = Object.entries(item.field_values || {})
      .map(([key, val]) => `${escapeHtml(key)}: <span>${escapeHtml(val)}</span>`)
      .join(' | ');

    return `
      <div class="cart-item-row">
        <div class="cart-item-thumb">
          ${item.image_url ? `<img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.name)}">` : '<svg class="mm-i" style="font-size: 20px; color: var(--text-muted);" aria-hidden="true"><use href="assets/icons/lucide-sprite.svg#i-package-open"></use></svg>'}
        </div>
        <div class="cart-item-details">
          <div class="cart-item-name">${escapeHtml(item.name)}</div>
          ${metaText ? `<div class="cart-item-meta">${metaText}</div>` : ''}
          <div class="cart-item-price">${safeFormatSDG(unitPrice)} ج.س &times; ${qty} = <strong>${safeFormatSDG(lineSubtotal)} ج.س</strong></div>
          <div class="cart-qty-stepper">
            <button type="button" onclick="changeQty(${index}, -1)" aria-label="إنقاص الكمية" ${qty <= 1 ? 'disabled' : ''}>&minus;</button>
            <span class="qty-value">${qty}</span>
            <button type="button" onclick="changeQty(${index}, 1)" aria-label="زيادة الكمية">+</button>
          </div>
        </div>
        <button class="remove-item-btn" onclick="removeItem(${index})" title="حذف العنصر">
          <svg class="mm-i" aria-hidden="true"><use href="assets/icons/lucide-sprite.svg#i-trash-2"></use></svg>
        </button>
      </div>
    `;
  }).join('');

  document.getElementById('cartGrandTotal').textContent = `${safeFormatSDG(grandTotal)} ج.س`;

  document.getElementById('proceedToCheckoutBtn').onclick = () => {
    // الدفع من السلة: نلغي أي شراء مباشر معلّق حتى لا يختلط الطلبان
    try { sessionStorage.removeItem('meem_direct_buy'); } catch (e) {}
    window.location.href = 'checkout-v2.html';
  };
}

function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem('meem_store_cart', JSON.stringify(cart));
  
  if (cart.length === 0) {
    showEmptyCartState();
  } else {
    renderCart();
  }
}

function clearAllItems() {
  if (confirm('هل أنت تأكد من رغبتك في تفريغ سلة المشتريات بالكامل؟')) {
    cart = [];
    localStorage.removeItem('meem_store_cart');
    showEmptyCartState();
  }
}

function changeQty(index, delta) {
  const item = cart[index];
  if (!item) return;
  let qty = (item.quantity && item.quantity > 0) ? item.quantity : 1;
  qty += delta;
  if (qty < 1) qty = 1;
  if (qty > 99) qty = 99;
  item.quantity = qty;
  localStorage.setItem('meem_store_cart', JSON.stringify(cart));
  renderCart();
}

init();
</script>
