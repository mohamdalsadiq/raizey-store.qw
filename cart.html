<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سلة المشتريات — RAIZEY STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">

<style>
  body { 
    background-color: var(--bg) !important; 
    color: var(--ink) !important; 
    margin: 0;
    padding: 0;
  }

  .cart-container {
    padding: 20px 16px;
    max-width: 600px;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .cart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .back-link {
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--primary); }

  .clear-cart-btn {
    background: transparent;
    border: none;
    color: var(--danger, #ef4444);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .clear-cart-btn:hover { background: rgba(239, 68, 68, 0.1); }

  .cart-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 20px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cart-title i { color: var(--primary); }

  .cart-item-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    transition: border-color 0.2s;
  }
  .cart-item-row:hover { border-color: rgba(255, 106, 26, 0.3); }

  .cart-item-thumb {
    width: 65px;
    height: 65px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cart-item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cart-item-details { flex: 1; min-width: 0; }

  .cart-item-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cart-item-meta {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
    word-break: break-word;
  }
  .cart-item-meta span {
    color: var(--primary);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
  }

  .cart-item-price {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  .cart-qty-stepper {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .cart-qty-stepper button {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1.5px solid var(--primary);
    background: transparent;
    color: var(--primary);
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    user-select: none;
  }
  .cart-qty-stepper button:active { transform: scale(0.92); }
  .cart-qty-stepper button:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--border); color: var(--text-muted); }
  .cart-qty-stepper .qty-value {
    min-width: 24px;
    text-align: center;
    font-size: 15px;
    font-weight: 900;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
  }

  .remove-item-btn {
    background: transparent;
    border: none;
    color: var(--danger, #ef4444);
    font-size: 16px;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: 0.15s ease;
    align-self: flex-start;
  }
  .remove-item-btn:hover { background: rgba(239, 68, 68, 0.1); }

  .summary-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0 16px 0;
  }
  .summary-box .label { font-size: 14px; font-weight: 700; color: var(--ink); }
  .summary-box .total { 
    font-weight: 900; 
    font-size: 20px; 
    color: var(--primary); 
    font-family: 'JetBrains Mono', monospace;
  }

  .btn-proceed-checkout {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    background: var(--primary);
    border: none;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: 0.15s ease;
    text-decoration: none;
    box-sizing: border-box;
  }
  .btn-proceed-checkout:active { transform: scale(0.98); }

  .empty-cart-box {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-top: 20px;
  }
  .empty-cart-icon {
    font-size: 48px;
    color: var(--text-muted);
    opacity: 0.4;
    margin-bottom: 16px;
  }

  .cart-notice {
    background: rgba(255, 106, 26, 0.08);
    border: 1px solid rgba(255, 106, 26, 0.28);
    color: var(--ink);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .cart-notice i { color: var(--primary); margin-left: 6px; }

  .cart-item-row.unavailable { opacity: 0.55; border-color: rgba(239, 68, 68, 0.4); }
  .cart-item-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(239, 68, 68, 0.12);
    color: var(--danger, #ef4444);
  }
  .btn-proceed-checkout:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="cart-container">
  <div class="cart-header">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة للمتجر</a>
    <button class="clear-cart-btn" id="clearCartBtn" style="display:none;" onclick="clearAllItems()">
      <i class="fas fa-trash-arrow-up"></i> تفريغ السلة
    </button>
  </div>
  
  <h1 class="cart-title"><i class="fas fa-shopping-cart"></i> سلة المشتريات</h1>

  <div id="loadingBox" style="text-align:center; padding:40px 0; color:var(--text-muted);">
    <i class="fas fa-circle-notch fa-spin" style="font-size:24px; color:var(--primary); margin-bottom:10px;"></i>
    <div>جارِ تحميل السلة...</div>
  </div>
  
  <div id="cartContent" style="display:none;">
    <div id="cartNotice" class="cart-notice" style="display:none;"></div>
    <div id="cartItemsList"></div>

    <div class="summary-box">
      <span class="label">إجمالي السلة:</span>
      <span class="total" id="cartGrandTotal">0 ج.س</span>
    </div>

    <button class="btn-proceed-checkout" id="proceedToCheckoutBtn">
      <span>المتابعة لإتمام الدفع</span>
      <i class="fas fa-arrow-left"></i>
    </button>
  </div>

  <div id="emptyCartBox" class="empty-cart-box" style="display:none;">
    <div class="empty-cart-icon"><i class="fas fa-basket-shopping"></i></div>
    <h3 style="font-size:18px; font-weight:800; margin-bottom:8px; color:var(--ink);">سلة المشتريات فارغة</h3>
    <p style="font-size:13px; margin-bottom:20px; color:var(--text-muted);">قم بإضافة الباقات والمنتجات التي ترغب بها من المتجر أولاً</p>
    <a href="index.html" class="btn-proceed-checkout" style="display:inline-flex; width:auto; padding: 12px 28px; font-size:14px;">
      <i class="fas fa-store"></i> تصفح المنتجات
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
const MAX_QTY_PER_ITEM = 10;

let currentUser = null;
let cart = [];
let grandTotal = 0;
let hasBlockingIssue = false;

/* ── دوال مساعدة احتياطية (المصدر الأساسي: assets/js/supabase-client.js) ── */
function safeFormatSDG(val) {
  if (typeof formatSDG === 'function') return formatSDG(val);
  const num = Math.round(Number(val) || 0);
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function esc(str) {
  if (typeof escapeHtml === 'function') return escapeHtml(str);
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function escAttr(str) {
  if (typeof escapeAttribute === 'function') return escapeAttribute(str);
  return esc(str);
}

function safeUrl(url) {
  if (typeof sanitizeUrl === 'function') return sanitizeUrl(url) || '';
  const s = String(url || '').trim();
  return /^(https?:|\/|data:image\/)/i.test(s) ? s : '';
}

function showFatal(message) {
  document.getElementById('loadingBox').innerHTML =
    `<div style="color:var(--danger,#ef4444); font-weight:700;">${esc(message)}</div>
     <button type="button" onclick="window.location.reload()"
       style="margin-top:12px; padding:10px 20px; border-radius:10px; border:1px solid var(--border); background:var(--bg-card); color:var(--ink); font-weight:700; cursor:pointer;">
       إعادة المحاولة
     </button>`;
  document.getElementById('loadingBox').style.display = 'block';
}

async function init() {
  try {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    if (error) throw error;
    if (!session) {
      sessionStorage.setItem('redirect_after_login', window.location.href);
      window.location.href = 'login.html';
      return;
    }
    currentUser = session.user;
  } catch (e) {
    // فشل التحقق من الجلسة = لا نعرض بيانات ولا نسمح بالمتابعة
    showFatal('تعذّر التحقق من جلستك. تأكد من اتصالك بالإنترنت ثم أعد المحاولة.');
    return;
  }

  await loadCartData();
}

async function loadCartData() {
  try {
    const raw = JSON.parse(localStorage.getItem('raizey_store_cart'));
    cart = Array.isArray(raw) ? raw : [];
  } catch (e) {
    cart = [];
  }

  if (!cart || cart.length === 0) {
    document.getElementById('loadingBox').style.display = 'none';
    showEmptyCartState();
    return;
  }

  // تطبيع الكميات قبل أي حساب
  let normalized = false;
  cart.forEach(item => {
    const q = Math.floor(Number(item.quantity));
    const safeQty = (Number.isFinite(q) && q >= 1) ? Math.min(q, MAX_QTY_PER_ITEM) : 1;
    if (safeQty !== item.quantity) { item.quantity = safeQty; normalized = true; }
  });
  if (normalized) persistCart();

  // ── إعادة تسعير موثوقة من قاعدة البيانات (لا نثق بأسعار localStorage) ──
  try {
    await revalidateCartPrices();
  } catch (e) {
    document.getElementById('loadingBox').style.display = 'none';
    showFatal('تعذّر التحقق من الأسعار الحالية. أعد المحاولة قبل إتمام الدفع.');
    return;
  }

  document.getElementById('loadingBox').style.display = 'none';

  if (cart.length === 0) {
    showEmptyCartState();
    return;
  }

  renderCart();
}

function persistCart() {
  try {
    localStorage.setItem('raizey_store_cart', JSON.stringify(cart));
  } catch (e) {
    console.error('[RAIZEY] Cart persist error:', e);
  }
}

/**
 * يعيد حساب سعر كل عنصر من products.price_usd مع سعر الصرف وهامش الربح
 * المخزّنين في جدول settings — نفس المعادلة التي يتحقق بها تريجر قاعدة البيانات.
 * أي عنصر غير متاح يُعلَّم ويمنع إتمام الدفع.
 */
async function revalidateCartPrices() {
  const ids = [...new Set(cart.map(i => i.product_id).filter(Boolean))];
  if (ids.length === 0) return;

  const [{ data: products, error: prodErr }, { data: settings, error: setErr }] = await Promise.all([
    supabaseClient.from('products').select('id, name, price_usd, options, is_active').in('id', ids),
    supabaseClient.from('settings').select('key, value').in('key', ['usd_to_sdg_rate', 'profit_margin_percent'])
  ]);
  if (prodErr) throw prodErr;
  if (setErr) throw setErr;

  const settingsMap = {};
  (settings || []).forEach(s => { settingsMap[s.key] = parseFloat(s.value); });
  const rate = settingsMap.usd_to_sdg_rate;
  const margin = Number.isFinite(settingsMap.profit_margin_percent) ? settingsMap.profit_margin_percent : 0;
  if (!Number.isFinite(rate) || rate <= 0) throw new Error('rate_unavailable');

  const productMap = {};
  (products || []).forEach(p => { productMap[p.id] = p; });

  let priceChanged = false;
  let removedCount = 0;

  cart = cart.filter(item => {
    const product = productMap[item.product_id];
    if (!product || product.is_active !== true) {
      removedCount++;
      return false;
    }

    // سعر الخيار المختار له الأولوية (نفس منطق التريجر)
    let priceUsd = parseFloat(product.price_usd) || 0;
    if (item.selected_option && item.selected_option.id && Array.isArray(product.options)) {
      const opt = product.options.find(o => String(o.id) === String(item.selected_option.id));
      if (!opt) {
        removedCount++;
        return false;
      }
      const optUsd = parseFloat(opt.price_usd);
      if (Number.isFinite(optUsd) && optUsd > 0) priceUsd = optUsd;
      // تحديث تسمية/سعر الخيار من المصدر الموثوق
      item.selected_option = { ...item.selected_option, label: opt.label ?? item.selected_option.label, price_usd: optUsd };
    }

    if (!(priceUsd > 0)) { removedCount++; return false; }

    const authoritative = Math.round(priceUsd * rate * (1 + margin / 100));
    const previous = Math.round(parseFloat(item.price_sdg) || 0);
    if (previous !== authoritative) priceChanged = true;

    item.price_sdg = authoritative;
    item.name = product.name || item.name;
    return true;
  });

  persistCart();

  const notices = [];
  if (removedCount > 0) notices.push(`تم حذف ${removedCount} عنصر لم يعد متاحاً في المتجر.`);
  if (priceChanged) notices.push('تم تحديث الأسعار لتطابق أسعار المتجر الحالية.');
  if (notices.length > 0) {
    const box = document.getElementById('cartNotice');
    box.innerHTML = `<i class="fas fa-circle-info"></i> ${notices.map(esc).join(' ')}`;
    box.style.display = 'block';
  }
}

function showEmptyCartState() {
  document.getElementById('cartContent').style.display = 'none';
  document.getElementById('clearCartBtn').style.display = 'none';
  document.getElementById('emptyCartBox').style.display = 'block';
}

function renderCart() {
  document.getElementById('emptyCartBox').style.display = 'none';
  document.getElementById('cartContent').style.display = 'block';
  document.getElementById('clearCartBtn').style.display = 'inline-flex';

  const listContainer = document.getElementById('cartItemsList');
  grandTotal = 0;

  hasBlockingIssue = false;

  listContainer.innerHTML = cart.map((item, index) => {
    const qty = (item.quantity && item.quantity > 0) ? item.quantity : 1;
    const unitPrice = parseFloat(item.price_sdg) || 0;
    const lineSubtotal = unitPrice * qty;
    grandTotal += lineSubtotal;

    const invalid = !(unitPrice > 0);
    if (invalid) hasBlockingIssue = true;

    const metaText = Object.entries(item.field_values || {})
      .map(([key, val]) => {
        const label = (item.field_labels && item.field_labels[key]) ? item.field_labels[key] : key;
        return `${esc(label)}: <span>${esc(val)}</span>`;
      })
      .join(' | ');

    const optionText = (item.selected_option && item.selected_option.label)
      ? `<div class="cart-item-meta">الخيار: <span>${esc(item.selected_option.label)}</span></div>`
      : '';

    const imgUrl = safeUrl(item.image_url);

    return `
      <div class="cart-item-row${invalid ? ' unavailable' : ''}">
        <div class="cart-item-thumb">
          ${imgUrl ? `<img src="${escAttr(imgUrl)}" alt="${escAttr(item.name)}">` : '<i class="fas fa-box-open" style="font-size:20px; color:var(--text-muted);"></i>'}
        </div>
        <div class="cart-item-details">
          <div class="cart-item-name">${esc(item.name)}</div>
          ${optionText}
          ${metaText ? `<div class="cart-item-meta">${metaText}</div>` : ''}
          ${invalid
            ? '<div class="cart-item-badge">سعر غير صالح — يرجى حذف العنصر</div>'
            : `<div class="cart-item-price">${safeFormatSDG(unitPrice)} ج.س &times; ${qty} = <strong>${safeFormatSDG(lineSubtotal)} ج.س</strong></div>`}
          <div class="cart-qty-stepper">
            <button type="button" onclick="changeQty(${index}, -1)" aria-label="إنقاص الكمية" ${qty <= 1 ? 'disabled' : ''}>&minus;</button>
            <span class="qty-value">${qty}</span>
            <button type="button" onclick="changeQty(${index}, 1)" aria-label="زيادة الكمية" ${qty >= MAX_QTY_PER_ITEM ? 'disabled' : ''}>+</button>
          </div>
        </div>
        <button class="remove-item-btn" onclick="removeItem(${index})" title="حذف العنصر" aria-label="حذف العنصر">
          <i class="fas fa-trash-can"></i>
        </button>
      </div>
    `;
  }).join('');

  document.getElementById('cartGrandTotal').textContent = `${safeFormatSDG(grandTotal)} ج.س`;

  const proceedBtn = document.getElementById('proceedToCheckoutBtn');
  proceedBtn.disabled = hasBlockingIssue;
  proceedBtn.title = hasBlockingIssue ? 'يوجد عنصر غير صالح في السلة' : '';
  proceedBtn.onclick = () => {
    if (hasBlockingIssue) return;
    window.location.href = 'checkout.html';
  };
}

function removeItem(index) {
  if (index < 0 || index >= cart.length) return;
  cart.splice(index, 1);
  persistCart();

  if (cart.length === 0) {
    showEmptyCartState();
  } else {
    renderCart();
  }
}

function clearAllItems() {
  if (confirm('هل أنت متأكد من رغبتك في تفريغ سلة المشتريات بالكامل؟')) {
    cart = [];
    try { localStorage.removeItem('raizey_store_cart'); } catch (e) {}
    document.getElementById('cartNotice').style.display = 'none';
    showEmptyCartState();
  }
}

function changeQty(index, delta) {
  const item = cart[index];
  if (!item) return;
  let qty = (item.quantity && item.quantity > 0) ? Math.floor(item.quantity) : 1;
  qty += delta;
  if (qty < 1) qty = 1;
  if (qty > MAX_QTY_PER_ITEM) qty = MAX_QTY_PER_ITEM;
  item.quantity = qty;
  persistCart();
  renderCart();
}

init();
</script>
</body>
</html>
