<style>
  body { 
    background-color: var(--bg) !important; 
    color: var(--ink) !important; 
    margin: 0;
    padding: 0;
  }

  .cart-container {
    padding: 20px 16px;
    max-width: 600px;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .cart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .back-link {
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--mm-accent-text); }

  .clear-cart-btn {
    background: transparent;
    border: none;
    color: var(--danger, var(--mm-danger));
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .clear-cart-btn:hover { background: rgba(255, 107, 107, 0.1); }

  .cart-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 20px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cart-title i { color: var(--mm-accent-text); }

  .cart-item-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    transition: border-color 0.2s;
  }
  .cart-item-row:hover { border-color: rgba(255, 212, 0, 0.3); }

  .cart-item-thumb {
    width: 65px;
    height: 65px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cart-item-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cart-item-details { flex: 1; min-width: 0; }

  .cart-item-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cart-item-meta {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
    word-break: break-word;
  }
  .cart-item-meta span {
    color: var(--mm-accent-text);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
  }

  .cart-item-price {
    font-size: 13px;
    font-weight: 700;
    color: var(--mm-accent-text);
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  .cart-qty-stepper {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .cart-qty-stepper button {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1.5px solid var(--primary);
    background: transparent;
    color: var(--mm-accent-text);
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    user-select: none;
  }
  .cart-qty-stepper button:active { transform: scale(0.92); }
  .cart-qty-stepper button:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--border); color: var(--text-muted); }
  .cart-qty-stepper .qty-value {
    min-width: 24px;
    text-align: center;
    font-size: 15px;
    font-weight: 900;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
  }

  .remove-item-btn {
    background: transparent;
    border: none;
    color: var(--danger, var(--mm-danger));
    font-size: 16px;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: 0.15s ease;
    align-self: flex-start;
  }
  .remove-item-btn:hover { background: rgba(255, 107, 107, 0.1); }

  .summary-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0 16px 0;
  }
  .summary-box .label { font-size: 14px; font-weight: 700; color: var(--ink); }
  .summary-box .total { 
    font-weight: 900; 
    font-size: 20px; 
    color: var(--mm-accent-text); 
    font-family: 'JetBrains Mono', monospace;
  }

  .btn-proceed-checkout {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    background: var(--primary);
    border: none;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: 0.15s ease;
    text-decoration: none;
    box-sizing: border-box;
  }
  .btn-proceed-checkout:active { transform: scale(0.98); }

  .empty-cart-box {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-top: 20px;
  }
  .empty-cart-icon {
    font-size: 48px;
    color: var(--text-muted);
    opacity: 0.4;
    margin-bottom: 16px;
  }
</style>
