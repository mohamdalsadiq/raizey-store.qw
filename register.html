<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب — RAIZEY STORE</title>
<meta name="description" content="أنشئ حسابك في RAIZEY STORE خلال أقل من دقيقة وابدأ التسوق بأمان.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card wide">
    <div class="auth-logo">
      <span class="brand-mark"><img src="assets/img/raizey-logo-mark.svg" alt="شعار RAIZEY STORE"></span>
      <span class="brand-text">RAIZEY <em>STORE</em></span>
    </div>

    <h1 class="auth-title">إنشاء حساب جديد</h1>
    <p class="auth-sub">انضم إلينا وابدأ التسوق خلال دقيقة واحدة</p>

    <div class="social-login-row">
      <button type="button" class="social-btn" id="googleLoginBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.8l7.8 6C12.3 14 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.2 7.1-17.6z"/><path fill="#FBBC05" d="M10.4 28.2a14.6 14.6 0 0 1 0-8.4l-7.8-6a23.5 23.5 0 0 0 0 20.4l7.8-6z"/><path fill="#34A853" d="M24 47.5c6.2 0 11.5-2 15.4-5.4l-7.6-5.9c-2.1 1.4-4.8 2.3-7.8 2.3-6.4 0-11.7-4.5-13.6-10.3l-7.8 6C6.5 42.1 14.6 47.5 24 47.5z"/></svg>
        <span>التسجيل باستخدام جوجل</span>
      </button>
    </div>
    <div class="form-error" id="socialError" style="margin-top:12px;"></div>

    <div class="auth-divider">أو بالبريد الإلكتروني</div>

    <div class="form-error" id="formError"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="fullName">الاسم الكامل</label>
        <div class="input-wrap">
          <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></span>
          <input type="text" id="fullName" autocomplete="name" required maxlength="120" placeholder="اكتب اسمك الكامل">
          <span class="trail"><span class="valid-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></span>
        </div>
        <div class="field-hint"></div>
      </div>

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-wrap">
          <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg></span>
          <input type="email" id="email" autocomplete="email" required placeholder="example@email.com">
          <span class="trail"><span class="valid-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></span>
        </div>
        <div class="field-hint"></div>
      </div>

      <div class="field">
        <label for="whatsapp">رقم الواتساب</label>
        <div class="phone-row" id="phoneRow">
          <div class="country-select" id="countrySelect">
            <button type="button" class="country-btn" id="countryBtn" aria-haspopup="listbox" aria-expanded="false"></button>
            <div class="country-pop" id="countryPop">
              <div class="country-search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
                <input type="text" id="countrySearch" placeholder="ابحث بالاسم أو رمز الدولة" autocomplete="off">
              </div>
              <div class="country-list" id="countryList" role="listbox"></div>
            </div>
          </div>
          <div class="input-wrap phone-input">
            <input type="tel" id="whatsapp" inputmode="numeric" autocomplete="tel-national" required placeholder="XXXXXXXXX">
            <span class="trail"><span class="valid-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span></span>
          </div>
        </div>
        <div class="field-hint"></div>
      </div>

      <div class="field">
        <label for="password">كلمة السر</label>
        <div class="input-wrap">
          <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg></span>
          <input type="password" id="password" autocomplete="new-password" required placeholder="8 أحرف على الأقل">
          <span class="trail"><button type="button" class="icon-btn" data-toggle-password="password" aria-label="إظهار كلمة السر"></button></span>
        </div>
        <div class="pw-meter"><span id="pwStrengthFill"></span></div>
        <div class="pw-label" id="pwStrengthLabel"></div>
        <ul class="pw-rules" id="pwRules">
          <li data-rule="length"><span data-rule-icon></span> 8 أحرف فأكثر</li>
          <li data-rule="letter"><span data-rule-icon></span> حرف واحد على الأقل</li>
          <li data-rule="digit"><span data-rule-icon></span> رقم واحد على الأقل</li>
          <li data-rule="symbol"><span data-rule-icon></span> رمز خاص (اختياري)</li>
        </ul>
      </div>

      <div class="field">
        <label for="confirmPassword">تأكيد كلمة السر</label>
        <div class="input-wrap">
          <span class="lead-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><path d="M9.5 15.5l1.8 1.8 3.4-3.4"/></svg></span>
          <input type="password" id="confirmPassword" autocomplete="new-password" required placeholder="أعد كتابة كلمة السر">
          <span class="trail"><button type="button" class="icon-btn" data-toggle-password="confirmPassword" aria-label="إظهار كلمة السر"></button></span>
        </div>
        <div class="field-hint"></div>
      </div>

      <label class="check-line policy">
        <input type="checkbox" id="acceptPolicy">
        <span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        <span>أوافق على <a href="privacy.html" target="_blank" rel="noopener">سياسة الخصوصية وشروط الاستخدام</a></span>
      </label>

      <button type="submit" class="auth-btn" id="submitBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.6"/><path d="M3 20a7 7 0 0 1 11.5-5.4"/><path d="M18 14v6"/><path d="M15 17h6"/></svg>
        <span>إنشاء الحساب</span>
      </button>
    </form>

    <p class="auth-switch">عندك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-ui.js"></script>
<script src="assets/js/country-codes.js"></script>
<script>
const UI = window.RaizeyAuthUI;
const form = document.getElementById('registerForm');
const errorBox = document.getElementById('formError');
const submitBtn = document.getElementById('submitBtn');

const fullNameInput = document.getElementById('fullName');
const emailInput = document.getElementById('email');
const phoneInput = document.getElementById('whatsapp');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirmPassword');
const policyInput = document.getElementById('acceptPolicy');

UI.bindPasswordToggles();
UI.bindEmailValidation(emailInput);
UI.bindPasswordStrength(
  passwordInput,
  document.getElementById('pwStrengthFill'),
  document.getElementById('pwStrengthLabel'),
  document.getElementById('pwRules')
);
UI.bindConfirmPassword(passwordInput, confirmInput);

fullNameInput.addEventListener('input', () => {
  const v = fullNameInput.value.trim();
  if (!v) return UI.setFieldState(fullNameInput, null, '');
  v.length >= 3
    ? UI.setFieldState(fullNameInput, 'valid', '')
    : UI.setFieldState(fullNameInput, 'invalid', 'الاسم قصير جداً');
});

const picker = window.RaizeyCountries.createCountryPicker({
  root: document.getElementById('countrySelect'),
  button: document.getElementById('countryBtn'),
  popup: document.getElementById('countryPop'),
  searchInput: document.getElementById('countrySearch'),
  listBox: document.getElementById('countryList'),
  input: phoneInput,
  onChange: validatePhone
});

function validatePhone() {
  const raw = phoneInput.value.replace(/\D/g, '');
  phoneInput.value = raw;
  if (!raw) { UI.setFieldState(phoneInput, null, ''); return false; }
  if (picker.isValid(raw)) {
    UI.setFieldState(phoneInput, 'valid', 'رقم صحيح: ' + picker.fullNumber(raw));
    return true;
  }
  const lens = picker.country.len.join(' أو ');
  UI.setFieldState(phoneInput, 'invalid', 'رقم ' + picker.country.ar + ' يجب أن يكون ' + lens + ' أرقام بدون صفر في البداية');
  return false;
}
phoneInput.addEventListener('input', validatePhone);
phoneInput.addEventListener('blur', validatePhone);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.textContent = '';

  const fullName = fullNameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const confirmPassword = confirmInput.value;

  if (fullName.length < 3) {
    errorBox.textContent = 'اكتب اسمك الكامل بشكل صحيح';
    fullNameInput.focus();
    return;
  }
  if (!UI.isValidEmail(email)) {
    UI.setFieldState(emailInput, 'invalid', 'صيغة البريد غير صحيحة');
    errorBox.textContent = 'أدخل بريدًا إلكترونيًا صالحًا — سيصلك عليه كود التفعيل';
    emailInput.focus();
    return;
  }
  if (!validatePhone()) {
    errorBox.textContent = 'أدخل رقم واتساب صحيح حسب الدولة المختارة';
    phoneInput.focus();
    return;
  }
  if (password.length < 8 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
    errorBox.textContent = 'كلمة السر لازم تكون 8 أحرف على الأقل وتحتوي على حرف ورقم';
    passwordInput.focus();
    return;
  }
  if (password !== confirmPassword) {
    errorBox.textContent = 'كلمة السر غير متطابقة';
    confirmInput.focus();
    return;
  }
  if (!policyInput.checked) {
    errorBox.textContent = 'يجب الموافقة على سياسة الخصوصية وشروط الاستخدام للمتابعة';
    policyInput.focus();
    return;
  }

  UI.setLoading(submitBtn, true, 'جارِ الإنشاء...');

  try {
    const refCode = new URLSearchParams(window.location.search).get('ref');
    const { error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: {
          full_name: fullName.slice(0, 120),
          whatsapp_number: picker.fullNumber(phoneInput.value),
          whatsapp_country: picker.country.iso.toUpperCase(),
          referral_code_used: refCode ? refCode.trim().toUpperCase().slice(0, 32) : null
        }
      }
    });

    if (error) {
      errorBox.textContent = translateError(error);
      return;
    }

    sessionStorage.setItem('pending_email', email);
    window.location.href = 'verify.html';
  } catch (_) {
    errorBox.textContent = 'تعذر إنشاء الحساب الآن، حاول مرة أخرى';
  } finally {
    UI.setLoading(submitBtn, false);
  }
});

function translateError(error) {
  if (error.status === 429 || error.message.includes('rate limit')) {
    return 'محاولات كثيرة، حاول مرة أخرى بعد قليل';
  }
  if (error.message.toLowerCase().includes('password')) {
    return 'كلمة السر لا تستوفي متطلبات الأمان';
  }
  return 'تعذر إنشاء الحساب بهذه البيانات، تحقق منها أو سجّل الدخول';
}

document.getElementById('googleLoginBtn').addEventListener('click', async () => {
  const googleBtn = document.getElementById('googleLoginBtn');
  const socialError = document.getElementById('socialError');
  socialError.textContent = '';
  UI.setLoading(googleBtn, true, 'جارِ التحويل إلى جوجل...');

  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: new URL('index.html', window.location.href).href,
        queryParams: { prompt: 'select_account' }
      }
    });
    if (error) throw error;
  } catch (_) {
    socialError.textContent = 'تعذر بدء التسجيل بجوجل، حاول مرة أخرى';
    UI.setLoading(googleBtn, false);
  }
});
</script>
</body>
</html>
