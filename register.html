<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6a1a">
<meta name="robots" content="noindex, nofollow">
<title>إنشاء حساب — RAIZEY STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">RAIZEY <span>STORE</span></div>
    <h1 class="auth-title">إنشاء حساب جديد</h1>
    <p class="auth-sub">سجل عشان تقدر تشحن وتتابع طلباتك</p>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="fullName">الاسم الكامل</label>
        <input type="text" id="fullName" name="name" required autocomplete="name"
               maxlength="120" placeholder="اسمك">
      </div>

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               inputmode="email" spellcheck="false" placeholder="example@email.com">
      </div>

      <div class="field">
        <label for="whatsapp">رقم الواتساب</label>
        <input type="tel" id="whatsapp" name="tel" required autocomplete="tel"
               inputmode="tel" maxlength="20" placeholder="+2499XXXXXXXX">
      </div>

      <div class="field field-pw">
        <label for="password">كلمة السر</label>
        <input type="password" id="password" name="new-password" required
               autocomplete="new-password" placeholder="كلمة سر قوية">
        <button type="button" class="pw-toggle" data-target="password"
                aria-label="إظهار كلمة السر" aria-pressed="false">
          <i class="fa-regular fa-eye" aria-hidden="true"></i>
        </button>
        <div class="pw-strength-bar" aria-hidden="true"><div class="pw-strength-fill" id="pwStrengthFill"></div></div>
        <div class="pw-strength-label" id="pwStrengthLabel" aria-live="polite"></div>
        <ul class="pw-rules" id="pwRules"></ul>
      </div>

      <div class="field field-pw">
        <label for="confirmPassword">تأكيد كلمة السر</label>
        <input type="password" id="confirmPassword" name="confirm-password" required
               autocomplete="new-password" placeholder="أعد كتابة كلمة السر">
        <button type="button" class="pw-toggle" data-target="confirmPassword"
                aria-label="إظهار كلمة السر" aria-pressed="false">
          <i class="fa-regular fa-eye" aria-hidden="true"></i>
        </button>
      </div>

      <div class="form-error" id="formError" role="alert" aria-live="assertive"></div>

      <button type="submit" class="auth-btn" id="submitBtn">إنشاء الحساب</button>
    </form>

    <p class="auth-note" id="refNote" hidden></p>

    <p class="auth-switch">عندك حساب بالفعل؟ <a href="login.html">سجّل دخولك</a></p>

    <div class="auth-divider">أو</div>
    <div class="social-login-row">
      <button type="button" class="social-btn fb-btn" data-social="facebook"><i class="fab fa-facebook-f" aria-hidden="true"></i> فيسبوك</button>
      <button type="button" class="social-btn google-btn" data-social="google"><i class="fab fa-google" aria-hidden="true"></i> جوجل</button>
    </div>
    <p class="auth-state" id="socialSoonMsg" role="status" aria-live="polite" style="min-height:0;"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-utils.js"></script>
<script>
(() => {
  'use strict';

  const form        = document.getElementById('registerForm');
  const errorBox    = document.getElementById('formError');
  const submitBtn   = document.getElementById('submitBtn');
  const nameInput   = document.getElementById('fullName');
  const emailInput  = document.getElementById('email');
  const waInput     = document.getElementById('whatsapp');
  const pwInput     = document.getElementById('password');
  const pw2Input    = document.getElementById('confirmPassword');
  const pwRules     = document.getElementById('pwRules');
  const strengthFil = document.getElementById('pwStrengthFill');
  const strengthLbl = document.getElementById('pwStrengthLabel');

  AuthUI.initPasswordToggles();
  AuthUI.renderPasswordRules(pwRules, '');

  pwInput.addEventListener('input', () => {
    AuthUI.renderPasswordRules(pwRules, pwInput.value);
    AuthUI.renderPasswordStrength(strengthFil, strengthLbl, pwInput.value);
  });

  // كود الإحالة يُقرأ من الرابط ويُمرَّر مع التسجيل — يُحلّ على السيرفر
  // (RLS يمنع العميل من قراءة بروفايلات الآخرين، فالبحث من المتصفح كان يفشل دائماً)
  const refCode = (new URLSearchParams(window.location.search).get('ref') || '')
    .trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);

  if (refCode) {
    const note = document.getElementById('refNote');
    note.hidden = false;
    note.textContent = 'تسجّل من خلال كود إحالة: ' + refCode; // textContent = آمن من XSS
  }

  function fail(input, message) {
    if (input) {
      input.setAttribute('aria-invalid', 'true');
      input.focus();
    }
    AuthUI.setMessage(errorBox, message);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    AuthUI.clearMessages(errorBox);
    [nameInput, emailInput, waInput, pwInput, pw2Input]
      .forEach((el) => el.setAttribute('aria-invalid', 'false'));

    if (!AuthUI.isClientReady()) {
      AuthUI.setMessage(errorBox, 'تعذّر الاتصال بالخادم. أعد تحميل الصفحة وحاول مجدداً.');
      return;
    }

    const fullName = nameInput.value.trim().replace(/\s+/g, ' ');
    const email    = emailInput.value.trim().toLowerCase();
    const whatsapp = AuthUI.normalizePhone(waInput.value);
    const password = pwInput.value;
    const confirm  = pw2Input.value;

    if (fullName.length < 3) return fail(nameInput, 'اكتب اسمك الكامل (3 أحرف على الأقل).');
    if (!AuthUI.isValidEmail(email)) return fail(emailInput, 'أدخل بريداً إلكترونياً صحيحاً.');
    if (!whatsapp) return fail(waInput, 'أدخل رقم واتساب صحيح مع مفتاح الدولة، مثال: +249912345678');

    const pwCheck = AuthUI.validatePassword(password);
    if (!pwCheck.valid) return fail(pwInput, pwCheck.message);

    if (password !== confirm) return fail(pw2Input, 'كلمتا السر غير متطابقتين.');

    if (password.toLowerCase().includes(email.split('@')[0].toLowerCase()) &&
        email.split('@')[0].length >= 4) {
      return fail(pwInput, 'كلمة السر ما تكون جزءاً من بريدك الإلكتروني.');
    }

    if (!rateLimiter.check('signup', 4, 10 * 60 * 1000)) {
      AuthUI.setMessage(errorBox, 'محاولات كتيرة جداً. انتظر عشر دقايق وحاول مجدداً.');
      return;
    }

    const restore = AuthUI.startLoading(submitBtn, 'جارِ الإنشاء...');

    try {
      // كل البيانات الإضافية تُمرَّر في raw_user_meta_data ويعالجها
      // trigger على السيرفر (handle_new_user) — لأن التسجيل لا يُنشئ session
      // فوراً (تأكيد البريد مطلوب) وبالتالي أي UPDATE من المتصفح يفشل بصمت.
      const metadata = { full_name: fullName, whatsapp_number: whatsapp };
      if (refCode) metadata.referral_code_used = refCode;

      const { error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: metadata,
          emailRedirectTo: new URL('verify.html', window.location.href).href
        }
      });

      if (error) {
        const msg = String(error.message || '').toLowerCase();
        if (msg.includes('rate limit') || msg.includes('too many') || msg.includes('security purposes')) {
          AuthUI.setMessage(errorBox, 'محاولات كتيرة جداً. حاول بعد شوية.');
        } else if (msg.includes('password')) {
          AuthUI.setMessage(errorBox, 'كلمة السر ما بتحقق الشروط المطلوبة أعلاه.');
        } else if (msg.includes('invalid') && msg.includes('email')) {
          AuthUI.setMessage(errorBox, 'البريد الإلكتروني غير صالح.');
        } else if (msg.includes('failed to fetch') || msg.includes('network')) {
          AuthUI.setMessage(errorBox, 'فشل الاتصال بالإنترنت. تحقق من الشبكة وحاول مجدداً.');
        } else {
          // "already registered" وغيرها → رسالة موحّدة تمنع كشف البُرد المسجّلة
          AuthUI.setMessage(errorBox, 'ما قدرنا نكمل التسجيل بالبيانات دي. لو عندك حساب بالفعل سجّل دخولك أو استخدم "نسيت كلمة السر".');
        }
        restore();
        return;
      }

      // Supabase لا يفرّق في الاستجابة بين بريد جديد وبريد مسجّل مسبقاً
      // (حماية مدمجة ضد enumeration) — لذلك نوجّه للتحقق في الحالتين.
      try { sessionStorage.setItem('pending_email', email); } catch (e) { /* تجاهل */ }
      window.location.replace('verify.html');
    } catch (err) {
      AuthUI.setMessage(errorBox, 'حصل خطأ غير متوقع. حاول مجدداً.');
      restore();
    }
  });

  const socialMsg = document.getElementById('socialSoonMsg');
  document.querySelectorAll('[data-social]').forEach((btn) => {
    btn.addEventListener('click', () => {
      socialMsg.textContent = 'تسجيل الدخول عبر هذه الطريقة هيتفعّل قريباً.';
      clearTimeout(socialMsg._t);
      socialMsg._t = setTimeout(() => { socialMsg.textContent = ''; }, 3000);
    });
  });
})();
</script>
</body>
</html>
