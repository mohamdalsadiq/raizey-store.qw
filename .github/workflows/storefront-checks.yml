name: Storefront checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:edge
      - run: npm run test:security
      - run: npm run test:seo
      - run: node scripts/test_public_catalog.mjs && node scripts/test_receipt_consent_db.mjs
      - run: npm run typecheck
      - run: npm run build && node scripts/test_static_budget.mjs
      - run: python -m pip install playwright==1.62.0
      - run: python scripts/test_meem_ux_browser.py
        env:
          CHROME_PATH: /usr/bin/google-chrome
