<html lang="ar" dir="rtl">
<head>

<link rel="stylesheet" href="assets/css/whatsapp-onboarding.css">
</head>
<body>
<a class="mm-skip-link" href="#mainContent">تخطَّ إلى المحتوى</a>

<div class="admin-page" id="adminPage" style="display: none;">
  <div class="page-header">
    <div class="admin-brand">
      <img class="admin-brand-mark" src="assets/img/meem-mark-48.png"
           srcset="assets/img/meem-mark-48.png 1x, assets/img/meem-mark-96.png 2x"
           alt="MEEM STORE" width="36" height="36" decoding="async">
      <img class="admin-brand-name" src="assets/img/meem-wordmark-28.png"
           srcset="assets/img/meem-wordmark-28.png 1x, assets/img/meem-wordmark-56.png 2x"
           alt="MEEM STORE" width="90" height="24" decoding="async">
    </div>
    <h1>إدارة المنتجات</h1>
    <a href="index.html" class="back-link">→ المتجر</a>
  </div>

  <div class="admin-nav">
    <a href="admin.html">الرئيسية</a>
    <a href="admin-orders.html">الطلبات</a>
    <a href="admin-topups.html">شحن المحافظ</a>
    <a href="admin-products.html" class="active">المنتجات</a>
    <a href="admin-categories.html">التصنيفات</a>
    <a href="admin-banners.html">البنرات</a>
    <a href="admin-customers.html">العملاء</a>
    <a href="admin-payment-methods.html">وسائل الدفع</a>
    <a href="admin-settings.html">الإعدادات</a>
    <a href="admin-audit-log.html">سجل النشاطات</a>
    <a href="admin-referral-milestones.html">مستويات الإحالة</a>
  </div>

  <button class="add-new-btn" id="addNewBtn">+ إضافة منتج جديد</button>

  <div id="productsList"><div style="color: var(--text-muted); font-size: 13px;">جارِ التحميل...</div></div>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal-box" style="max-height: 85vh; overflow-y: auto;">
    <div class="modal-title" id="formModalTitle">منتج جديد</div>

    <div class="field">
      <label>التصنيف</label>
      <select id="categoryInput"></select>
    </div>

    <div class="field">
      <label>اسم المنتج</label>
      <input type="text" id="nameInput" placeholder="مثلاً: 60 UC أو حساب توثيق">
    </div>

    <div class="field">
      <label>الوصف المختصر (اختياري)</label>
      <input type="text" id="descInput" placeholder="وصف مختصر يظهر في القائمة">
    </div>

    <div class="field">
      <label>الشارة التسويقية (اختياري)</label>
      <input type="text" id="deliveryBadgeInput" maxlength="80" placeholder="مثلاً: تسليم فوري ومضمون">
      <small style="display: block;margin-top: 5px;color: var(--text-muted);">تظهر على بطاقة هذا المنتج فقط، واتركها فارغة إذا لم تكن مطلوبة.</small>
    </div>

    <div class="field">
      <label>شرح المنتج / طريقة الاستلام والتنبيهات (يظهر للعميل في صفحة المنتج)</label>
      <textarea id="instructionsInput" placeholder="اكتب هنا شرحاً مفصلاً للمنتج، طريقة الاستلام، أو أي تنبيهات تهم العميل..." style="width: 100%; min-height: 110px; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); font-family: var(--mm-font-display); font-size: 14px; resize: vertical; line-height: 1.6;"></textarea>
    </div>

    <div class="field">
      <label>صورة المنتج</label>
      <div class="file-upload" id="fileUploadBox">
        اضغط لرفع صورة
        <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/webp" style="display: none;">
      </div>
      <input type="hidden" id="imageInput">
    </div>

    <div class="field">
      <label>السعر الأساسي (بالدولار $)</label>
      <input type="number" id="priceInput" step="0.01" placeholder="1.00">
    </div>

    <!-- قسم الخيارات الفرعية للمنتج -->
    <div class="field" style="margin-top: 15px; border-top: 1px dashed var(--border); padding-top: 15px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <label style="font-weight: 800; margin: 0; color: var(--ink); display: flex; align-items: center; gap: 6px;">
          <svg class="mm-i" style="color: var(--mm-accent-text);" aria-hidden="true"><use href="assets/icons/lucide-sprite.svg#i-list-checks"></use></svg>
          إضافة خيارات فرعية للمنتج
        </label>
        <input type="checkbox" id="hasOptionsToggle" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--mm-accent-text);">
      </div>

      <div id="optionsContainer" style="display: none; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 10px;">
        <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 10px; color: var(--text-muted);">
          أدخل الخيارات وسعر كل خيار ($). يمكنك كتابة الاسم "فئة - خيار" لتقسيمها لمرحلتين، أو كتابة الاسم مباشرة لتظهر مباشرة.
        </label>
        <div id="optionsBuilder"></div>
        <button class="add-field-btn" id="addOptionBtn" type="button" style="margin-top: 8px;">
          <svg class="mm-i" aria-hidden="true"><use href="assets/icons/lucide-sprite.svg#i-plus"></use></svg> إضافة خيار جديد
        </button>
      </div>
    </div>

    <div class="field">
      <label>ترتيب العرض</label>
      <input type="number" id="orderInput" placeholder="0">
    </div>

    <div class="field">
      <label>الحالة</label>
      <select id="activeInput">
        <option value="true">فعّال (يظهر للعملاء)</option>
        <option value="false">غير فعّال (مخفي)</option>
      </select>
    </div>

    <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted);">
      البيانات المطلوبة من العميل عند الشراء (يتم تحديد العنوان والنص الداخلي)
    </label>
    <div id="fieldsBuilder"></div>
    <button class="add-field-btn" id="addFieldBtn" type="button">+ إضافة حقل مطلوب</button>

    <div class="form-error" id="formError"></div>

    <div class="modal-actions">
      <button class="modal-cancel-btn" id="formCancelBtn">إلغاء</button>
      <button class="modal-confirm-btn" id="formSaveBtn" style="background: var(--primary); color: var(--mm-on-primary);">حفظ</button>
    </div>
  </div>
</div>

<div id="accessDenied" style="display: none; text-align: center; padding: 80px 20px; color: var(--text-muted);">
  <h3 style="color: var(--ink); margin-bottom: 8px;">غير مصرح لك بالدخول</h3>
  <a href="index.html" style="color: var(--mm-accent-text); font-weight: 700;">← رجوع للمتجر</a>
</div>

<script src="assets/vendor/supabase-2.118.0.min.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mfa-guard.js"></script>
<script src="assets/js/phone-country-picker.js"></script>
<script src="assets/js/whatsapp-onboarding.js"></script>
<script src="assets/js/pages/admin-products-2.js"></script>
  <script src="assets/js/admin-nav.js"></script>
</body>
</html>
