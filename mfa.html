<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>التحقق بخطوتين — MEEM STORE</title>
  <link rel="stylesheet" href="assets/css/meem.css?v=20261020">
  <style>
    body{margin:0;background:#07102a;color:#fff;font:18px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
    main{width:min(88vw,420px);padding:28px;background:#10204a;border-radius:20px;box-sizing:border-box}
    h1{font-size:26px}p{line-height:1.7;color:#d7e3ff}label{display:block;margin:18px 0 8px}
    input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;border-radius:10px;border:1px solid #7492c0;margin-bottom:12px}
    input{direction:ltr;text-align:center;letter-spacing:.35em;background:#07102a;color:white}
    button{background:#ffd400;color:#07102a;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    .secondary{background:transparent;color:white}#error{color:#ffb6b6;min-height:1.6em}
  </style>
</head>
<body>
  <main>
    <h1>التحقق بخطوتين</h1>
    <p>أدخل رمز تطبيق Authenticator لإكمال تسجيل الدخول إلى حسابك.</p>
    <form id="mfaForm">
      <label for="code">رمز التحقق</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus>
      <p id="error" role="alert"></p>
      <button id="verify" type="submit" disabled>تأكيد الدخول</button>
    </form>
    <button id="logout" class="secondary" type="button">تسجيل الخروج</button>
  </main>
  <script src="assets/vendor/supabase-2.118.0.min.js"></script>
  <script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mfa-guard.js"></script>
  <script src="assets/js/mfa.js"></script>
</body>
</html>
