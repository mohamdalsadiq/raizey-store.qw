<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; object-src 'none'; base-uri 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — RAIZEY STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">RAIZEY <span>STORE</span></div>
    <h1 class="auth-title">تسجيل الدخول</h1>
    <p class="auth-sub">أهلاً بيك تاني في RAIZEY STORE</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" required
               placeholder="example@email.com"
               autocomplete="email"
               inputmode="email">
      </div>

      <div class="field">
        <label for="password">كلمة السر</label>
        <input type="password" id="password" name="password" required
               placeholder="كلمة السر"
               autocomplete="current-password">
      </div>

      <div class="form-error" id="formError" role="alert" aria-live="polite"></div>

      <button type="submit" class="auth-btn" id="submitBtn">دخول</button>
    </form>

    <p class="auth-switch" style="margin-top:12px;">
      <a href="javascript:void(0)" id="forgotLink">نسيت كلمة السر؟</a>
    </p>

    <div id="forgotBox" style="display:none; margin-top:14px;">
      <div class="field">
        <label for="forgotEmail">أدخل إيميلك لإرسال رابط إعادة التعيين</label>
        <input type="email" id="forgotEmail" name="forgotEmail"
               placeholder="example@email.com"
               autocomplete="email" inputmode="email">
      </div>
      <div class="form-error" id="forgotError" role="alert"></div>
      <div class="form-success" id="forgotSuccess" role="status"></div>
      <button class="auth-btn" id="forgotBtn" style="background:var(--bg-card); color:var(--ink); border:1px solid var(--border);">
        إرسال رابط إعادة التعيين
      </button>
    </div>

    <p class="auth-switch">ما عندك حساب؟ <a href="register.html">أنشئ حساب جديد</a></p>

    <div class="auth-divider">أو</div>
    <div class="social-login-row">
      <button type="button" class="social-btn fb-btn" onclick="showSocialSoon()">
        <i class="fab fa-facebook-f" aria-hidden="true"></i> فيسبوك
      </button>
      <button type="button" class="social-btn google-btn" onclick="showSocialSoon()">
        <i class="fab fa-google" aria-hidden="true"></i> جوجل
      </button>
    </div>
    <p class="form-error" id="socialSoonMsg" style="text-align:center; margin-top:10px;" role="status"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
// ── Rate Limiting (Brute-Force Protection) ──────────────
const RL_KEY      = 'raizey_login_rl';
const RL_LOCK_KEY = 'raizey_login_lock';
const MAX_ATTEMPTS = 5;
const LOCKOUT_MS   = 2 * 60 * 1000; // 2 minutes

function getRlState() {
  try { return JSON.parse(localStorage.getItem(RL_KEY)) || { count: 0, ts: 0 }; }
  catch (e) { return { count: 0, ts: 0 }; }
}

function checkLocked() {
  const lockUntil = parseInt(localStorage.getItem(RL_LOCK_KEY) || '0', 10);
  if (Date.now() < lockUntil) {
    return Math.ceil((lockUntil - Date.now()) / 1000);
  }
  const state = getRlState();
  if (Date.now() - state.ts > LOCKOUT_MS) {
    clearRl();
    return 0;
  }
  if (state.count >= MAX_ATTEMPTS) {
    const until = Date.now() + LOCKOUT_MS;
    localStorage.setItem(RL_LOCK_KEY, String(until));
    clearRl();
    return Math.ceil(LOCKOUT_MS / 1000);
  }
  return 0;
}

function recordFail() {
  const state = getRlState();
  const reset = Date.now() - state.ts > LOCKOUT_MS;
  localStorage.setItem(RL_KEY, JSON.stringify({
    count: reset ? 1 : state.count + 1,
    ts: Date.now()
  }));
}

function clearRl() {
  localStorage.removeItem(RL_KEY);
}

// ── Form Submit ──────────────────────────────────────────
const form      = document.getElementById('loginForm');
const errorBox  = document.getElementById('formError');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.textContent = '';

  const locked = checkLocked();
  if (locked > 0) {
    errorBox.textContent = `تم تجاوز الحد الأقصى للمحاولات. حاول بعد ${locked} ثانية.`;
    return;
  }

  const email    = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    errorBox.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة السر.';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'جارِ الدخول...';

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      if (error.message.includes('Email not confirmed')) {
        sessionStorage.setItem('pending_email', email);
        window.location.href = 'verify.html';
        return;
      }
      recordFail();
      errorBox.textContent = 'الإيميل أو كلمة السر غير صحيحة';
      submitBtn.disabled = false;
      submitBtn.textContent = 'دخول';
      return;
    }

    clearRl();
    const redirect = sessionStorage.getItem('redirect_after_login');
    sessionStorage.removeItem('redirect_after_login');
    window.location.href = redirect || 'index.html';

  } catch (err) {
    errorBox.textContent = 'حدث خطأ في الاتصال، يرجى المحاولة مجدداً.';
    submitBtn.disabled = false;
    submitBtn.textContent = 'دخول';
  }
});

// ── Forgot Password ──────────────────────────────────────
document.getElementById('forgotLink').addEventListener('click', () => {
  const box = document.getElementById('forgotBox');
  const isHidden = box.style.display === 'none' || box.style.display === '';
  box.style.display = isHidden ? 'block' : 'none';
  if (isHidden) document.getElementById('forgotEmail').focus();
});

document.getElementById('forgotBtn').addEventListener('click', async () => {
  const forgotError   = document.getElementById('forgotError');
  const forgotSuccess = document.getElementById('forgotSuccess');
  forgotError.textContent = '';
  forgotSuccess.textContent = '';

  const email = document.getElementById('forgotEmail').value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    forgotError.textContent = 'يرجى إدخال بريد إلكتروني صحيح.';
    return;
  }

  const btn = document.getElementById('forgotBtn');
  btn.disabled = true;

  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });

    if (error) {
      forgotError.textContent = 'حصل خطأ، حاول تاني';
    } else {
      forgotSuccess.textContent = 'تم إرسال رابط إعادة التعيين لإيميلك، افتحه من نفس الجهاز';
      document.getElementById('forgotEmail').value = '';
    }
  } catch (err) {
    forgotError.textContent = 'حدث خطأ في الاتصال، يرجى المحاولة مجدداً.';
  } finally {
    btn.disabled = false;
  }
});

function showSocialSoon() {
  const msg = document.getElementById('socialSoonMsg');
  msg.textContent = 'تسجيل الدخول عبر هذه الطريقة هيتفعّل قريباً';
  setTimeout(() => { msg.textContent = ''; }, 3000);
}
</script>
</body>
</html>
