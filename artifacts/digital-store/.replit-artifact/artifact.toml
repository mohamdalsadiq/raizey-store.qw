kind = "web"
previewPath = "/"
title = "RAIZEY STORE"
version = "1.0.0"
id = "artifacts/digital-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26058

[services.development]
run = "pnpm --filter @workspace/digital-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/digital-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26058"
BASE_PATH = "/"
