<style>
  .receipt-brand {
    display: flex;
    justify-content: center;
    margin: 2px 0 18px;
  }
  .receipt-brand img { width: 150px; height: 150px; border-radius: 22px; box-shadow: 0 10px 26px rgba(4, 18, 63, .3); }

  .receipt-page {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  .receipt-success-icon {
    text-align: center;
    padding: 28px 0 18px;
  }
  .receipt-success-icon .icon-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(34, 197, 94, 0.12);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    border: 2px solid rgba(34, 197, 94, 0.3);
  }
  .receipt-success-icon .icon-circle i {
    font-size: 32px;
    color: var(--mm-success);
  }
  .receipt-success-icon.rejected .icon-circle {
    background: rgba(255, 107, 107, 0.12);
    border-color: rgba(255, 107, 107, 0.3);
  }
  .receipt-success-icon.rejected .icon-circle i { color: var(--danger, var(--mm-danger)); }
  .receipt-success-icon.pending .icon-circle {
    background: rgba(255, 212, 0, 0.12);
    border-color: rgba(255, 212, 0, 0.3);
  }
  .receipt-success-icon.pending .icon-circle i { color: var(--primary, var(--mm-accent-text)); }

  .receipt-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .receipt-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
  }
  .receipt-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-top: 20px;
  }
  .receipt-card-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--border);
  }
  .receipt-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .receipt-row:last-child { margin-bottom: 0; }
  .receipt-row .label { color: var(--text-muted); flex-shrink: 0; }
  .receipt-row .value {
    color: var(--ink);
    font-weight: 700;
    text-align: left;
    word-break: break-all;
  }
  .receipt-row .value.price {
    font-size: 16px;
    color: var(--mm-accent-text);
    font-family: 'JetBrains Mono', monospace;
  }
  .receipt-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    word-break: break-all;
  }
  .receipt-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }
  .receipt-status-badge.pending_review { background: rgba(255, 212, 0,0.12); color: var(--mm-accent-text); }
  .receipt-status-badge.in_progress    { background: rgba(255, 212, 0,0.12);  color: var(--mm-accent-text); }
  .receipt-status-badge.completed      { background: rgba(34,197,94,0.12);   color: var(--mm-success); }
  .receipt-status-badge.rejected       { background: rgba(255, 107, 107,0.12);   color: var(--mm-danger); }
  .receipt-status-badge.cancelled      { background: rgba(120,120,120,0.12); color: var(--mm-text-muted);    }

  .receipt-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 22px;
  }
  .receipt-btn-primary {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    background: var(--primary);
    /* dark ink on the gold button: --ink is the near-white *text* colour of the
       dark theme, which gave 1.35:1 on gold (unreadable) */
    color: var(--mm-on-primary);
    font-size: 15px;
    font-weight: 800;
    text-align: center;
    text-decoration: none;
    border: none;
    cursor: pointer;
    box-sizing: border-box;
  }
  .receipt-btn-secondary {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--ink);
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    box-sizing: border-box;
  }
  .receipt-fields-list {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .receipt-fields-list div {
    font-size: 13px;
    color: var(--ink);
    padding: 2px 0;
  }
  .receipt-fields-list div span.fkey {
    color: var(--text-muted);
    margin-left: 4px;
  }
  .receipt-receipt-img-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--mm-accent-text);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
  }
  .receipt-receipt-img-link:hover { text-decoration: underline; }
  #loadingBox {
    text-align: center;
    padding: 60px 0;
    color: var(--text-muted);
    font-size: 14px;
  }
  #errorBox {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  #errorBox h3 { color: var(--ink); margin-bottom: 8px; }
</style>
