  <style>
    .section-hero {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      margin: 0 0 18px; padding: 22px 24px; border: 1px solid var(--border);
      border-radius: 18px; background: linear-gradient(135deg, rgba(255, 212, 0,.12), var(--bg-card));
    }
    .section-hero h2 { margin: 0 0 6px; color: var(--ink); font-size: 22px; }
    .section-hero p { margin: 0; color: var(--text-muted); line-height: 1.7; font-size: 13px; }
    .section-hero-icon { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; background: var(--primary); color: var(--mm-on-primary); font-size: 24px; box-shadow: 0 10px 24px rgba(255, 212, 0,.2); }
    .section-count { color: var(--mm-accent-text); font-weight: 900; }
    .admin-inline-notice { margin: 12px 0 16px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-card); color: var(--ink); font-size: 13px; line-height: 1.7; }
    .admin-inline-notice.error { border-color: rgba(255, 107, 107,.35); background: rgba(255, 107, 107,.08); color: var(--mm-danger); }
    .admin-inline-notice.success { border-color: rgba(22,163,74,.3); background: rgba(22,163,74,.08); color: var(--mm-success); }
    .section-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; color: var(--text-muted); font-size: 12px; }
    .section-meta span { padding: 3px 8px; border-radius: 999px; background: rgba(127,127,127,.08); }
    .empty-state { padding: 42px 20px; text-align: center; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 16px; background: var(--bg-card); }
    .empty-state i { display: block; margin-bottom: 10px; color: var(--mm-accent-text); font-size: 26px; }
    @media (max-width:640px) { .section-hero { align-items: flex-start; } .section-hero-icon { flex-shrink: 0; } }
  </style>









<!-- MEEM UI system (tokens + components + icons + behaviour) -->
<link rel="stylesheet" href="assets/css/meem.css?v=20261020">
<script src="assets/js/meem-ui.js"></script>
<link rel="stylesheet" href="assets/css/whatsapp-onboarding.css">
</head>
<body>
<a class="mm-skip-link" href="#mainContent">تخطَّ إلى المحتوى</a>
  <div class="admin-page" id="adminPage" style="display: none;">
    <div class="page-header">
      <h1>إدارة الأقسام</h1>
      <a href="index.html" class="back-link"><svg class="mm-i" style="margin-left: 4px;" aria-hidden="true"><use href="assets/icons/lucide-sprite.svg#i-store"></use></svg> المتجر</a>
    
    <div class="admin-brand">
      <img class="admin-brand-mark" src="assets/img/meem-mark-48.png"
           srcset="assets/img/meem-mark-48.png 1x, assets/img/meem-mark-96.png 2x"
           alt="MEEM STORE" width="36" height="36" decoding="async">
      <img class="admin-brand-name" src="assets/img/meem-wordmark-28.png"
           srcset="assets/img/meem-wordmark-28.png 1x, assets/img/meem-wordmark-56.png 2x"
           alt="MEEM STORE" width="90" height="24" decoding="async">
    </div>
  </div>

    <div class="admin-nav"></div>

    <div class="section-hero">
      <div>
        <h2>الأقسام الرئيسية</h2>
        <p>اكتب اسم القسم فقط، مثل «الاشتراكات» أو «شحن الألعاب». ستظهر الأقسام كعناوين مستقلة في واجهة المتجر.</p>
      </div>
      <div class="section-hero-icon" aria-hidden="true"><svg class="mm-i" aria-hidden="true"><use href="assets/icons/lucide-sprite.svg#i-layers"></use></svg></div>
    </div>

    <button class="add-new-btn" id="addNewBtn">+ إضافة قسم جديد</button>
    <div id="sectionsNotice" class="admin-inline-notice" role="status" aria-live="polite" hidden></div>
    <div id="sectionsList"><div style="color: var(--text-muted);font-size: 13px;">جارِ التحميل...</div></div>
  </div>

  <div class="modal-overlay" id="formModal">
    <div class="modal-box">
      <div class="modal-title" id="formModalTitle">قسم جديد</div>
      <div class="field">
        <label for="nameInput">اسم القسم</label>
        <input type="text" id="nameInput" maxlength="120" placeholder="مثلاً: الاشتراكات">
      </div>
      <div class="field">
        <label>أيقونة القسم</label>
        <div id="iconPicker"></div>
      </div>
      <div class="field">
        <label for="orderInput">ترتيب العرض</label>
        <input type="number" id="orderInput" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label for="activeInput">الحالة</label>
        <select id="activeInput">
          <option value="true">فعّال — يظهر في المتجر</option>
          <option value="false">غير فعّال — مخفي</option>
        </select>
      </div>
      <div class="form-error" id="formError"></div>
      <div class="modal-actions">
        <button class="modal-cancel-btn" id="formCancelBtn">إلغاء</button>
        <button class="modal-confirm-btn" id="formSaveBtn" style="background: var(--primary);color: var(--mm-on-primary);">حفظ القسم</button>
      </div>
    </div>
  </div>

  <div id="accessDenied" style="display: none;text-align: center;padding: 80px 20px;color: var(--text-muted);">
    <h3 style="color: var(--ink);margin-bottom: 8px;">غير مصرح لك بالدخول</h3>
    <a href="index.html" style="color: var(--mm-accent-text);font-weight: 700;">← رجوع للمتجر</a>
  </div>

  <script src="assets/vendor/supabase-2.118.0.min.js"></script>

<script src="assets/js/mfa-guard.js"></script>
<script src="assets/js/phone-country-picker.js"></script>
<script src="assets/js/whatsapp-onboarding.js"></script>
  <script src="assets/js/category-icons.js?v=20261020"></script>
  <script src="assets/js/admin-icon-picker.js?v=20261020"></script>
  <script src="assets/js/pages/admin-sections-2.js?v=20261020"></script>
  <script src="assets/js/admin-nav.js?v=20261020"></script>
</body>
</html>
