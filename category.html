<head>

<style>
  body { background: var(--bg) !important; }
  .catalog-page { width: min(100%, 1120px); margin: 0 auto; padding: 18px 16px 110px; }
  .catalog-topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .catalog-back, .catalog-cart { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:9px 13px; border:1px solid var(--border); border-radius:999px; background:var(--bg-card); color:var(--ink); font-size:13px; font-weight:800; }
  .catalog-back:hover, .catalog-back:focus-visible, .catalog-cart:hover, .catalog-cart:focus-visible { border-color:var(--primary); outline:3px solid rgba(255,106,26,.13); outline-offset:1px; }
  .catalog-cart i { color:var(--primary); }
  .catalog-cart span { display:grid; place-items:center; min-width:22px; height:22px; border-radius:50%; background:var(--primary); color:var(--ink); font:800 11px var(--font-mono); }
  .category-hero { display:grid; grid-template-columns:minmax(0,1fr) 148px; align-items:center; gap:18px; padding:20px; border:1px solid var(--border); border-radius:22px; background:linear-gradient(135deg,#fff4ea 0%,var(--bg-card) 100%); box-shadow:0 10px 28px rgba(31,34,43,.05); }
  .category-hero-copy { min-width:0; }
  .category-eyebrow { display:inline-flex; align-items:center; gap:7px; color:var(--primary); font-size:12px; font-weight:900; }
  .category-hero h1 { margin:8px 0 7px; color:var(--ink); font-size:clamp(24px,4vw,34px); line-height:1.3; font-weight:900; }
  .category-hero p { max-width:680px; color:var(--text-muted); font-size:14px; line-height:1.8; }
  .category-hero-art { width:148px; aspect-ratio:1; display:grid; place-items:center; overflow:hidden; border:1px solid rgba(255,106,26,.2); border-radius:20px; background:#fff; color:var(--primary); font-size:42px; }
  .category-hero-art img { width:100%; height:100%; object-fit:cover; }
  .trust-row { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 24px; }
  .trust-pill { display:inline-flex; align-items:center; gap:7px; padding:8px 11px; border:1px solid var(--border); border-radius:999px; background:var(--bg-card); color:var(--ink); font-size:12px; font-weight:800; }
  .trust-pill i { color:var(--primary); }
  .catalog-heading { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:0 0 12px; }
  .catalog-heading h2 { color:var(--ink); font-size:21px; font-weight:900; }
  .catalog-heading p { color:var(--text-muted); font-size:12px; }
  .package-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .package-card { display:flex; flex-direction:column; min-width:0; overflow:hidden; border:1px solid var(--border); border-radius:18px; background:var(--bg-card); color:var(--ink); transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease; }
  .package-card:hover, .package-card:focus-visible { transform:translateY(-3px); border-color:rgba(255,106,26,.6); box-shadow:0 12px 26px rgba(31,34,43,.08); outline:none; }
  .package-image { position:relative; aspect-ratio:1.45; display:grid; place-items:center; overflow:hidden; border-bottom:1px solid var(--border); background:linear-gradient(135deg,#fff,#ede6d9); color:var(--text-muted); font-size:30px; }
  .package-image img { width:100%; height:100%; object-fit:cover; }
  .package-badge { position:absolute; top:10px; right:10px; padding:5px 8px; border:1px solid rgba(255,106,26,.2); border-radius:999px; background:rgba(255,255,255,.9); color:var(--primary-dim); font-size:10px; font-weight:900; }
  .package-body { display:flex; flex:1; flex-direction:column; gap:8px; padding:13px; }
  .package-name { color:var(--ink); font-size:15px; line-height:1.45; font-weight:900; }
  .package-description { min-height:36px; overflow:hidden; color:var(--text-muted); font-size:12px; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .package-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:8px; border-top:1px dashed var(--border); }
  .package-price { color:var(--primary); font:900 13px var(--font-mono); }
  .package-price small { color:var(--text-muted); font:700 10px var(--font-display); }
  .package-cta { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 10px; border-radius:9px; background:var(--primary); color:var(--ink); font-size:11px; font-weight:900; }
  .catalog-state { grid-column:1/-1; padding:46px 20px; border:1px dashed var(--border); border-radius:18px; background:var(--bg-card); text-align:center; }
  .catalog-state i { margin-bottom:10px; color:var(--primary); font-size:28px; }
  .catalog-state h3 { margin-bottom:5px; color:var(--ink); font-size:16px; }
  .catalog-state p { color:var(--text-muted); font-size:13px; }
  @media (min-width: 640px) { .package-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (min-width: 930px) { .package-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  @media (max-width: 560px) { .category-hero { grid-template-columns:minmax(0,1fr) 88px; padding:15px; gap:12px; } .category-hero-art { width:88px; border-radius:15px; font-size:28px; } .category-hero h1 { font-size:23px; } .catalog-heading { align-items:flex-start; flex-direction:column; gap:3px; } .package-grid { gap:10px; } .package-body { padding:10px; } .package-name { font-size:13px; } .package-footer { align-items:flex-start; flex-direction:column; } .package-cta { width:100%; } }
  @media (prefers-reduced-motion: reduce) { .package-card { transition:none; } }
</style>
</head>
<body>
<main class="catalog-page">
  <div class="catalog-topbar">
    <a href="index.html" class="catalog-back"><i class="fas fa-arrow-right" aria-hidden="true"></i> رجوع للمتجر</a>
    <a href="cart.html" class="catalog-cart" aria-label="فتح السلة"><i class="fas fa-shopping-cart" aria-hidden="true"></i> السلة <span id="globalCartCount">0</span></a>
  </div>
  <div id="loadingBox" class="catalog-state"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i><h3>جارِ تحميل الباقات...</h3><p>لحظات ونجهز لك العروض المتاحة.</p></div>
  <div id="content" hidden>
    <section class="category-hero" aria-labelledby="categoryTitle">
      <div class="category-hero-copy">
        <span class="category-eyebrow"><i class="fas fa-layer-group" aria-hidden="true"></i> RAIZEY STORE</span>
        <h1 id="categoryTitle">الباقات</h1>
        <p id="categoryDescription">اختر الباقة المناسبة لك وأكمل الطلب بخطوات بسيطة وآمنة.</p>
      </div>
      <div class="category-hero-art" id="categoryArt"><i class="fas fa-gamepad" aria-hidden="true"></i></div>
    </section>
    <div class="trust-row" aria-label="مزايا المتجر">
      <span class="trust-pill"><i class="fas fa-bolt" aria-hidden="true"></i> تسليم سريع</span>
      <span class="trust-pill"><i class="fas fa-shield-halved" aria-hidden="true"></i> دفع آمن</span>
      <span class="trust-pill"><i class="fas fa-headset" aria-hidden="true"></i> دعم مباشر</span>
    </div>
    <div class="catalog-heading"><h2>اختر الباقة</h2><p id="packageCount">تصفح الخيارات المتاحة</p></div>
    <section id="packagesGrid" class="package-grid" aria-live="polite"></section>
  </div>
</main>
<a href="https://wa.me/249901815039" class="whatsapp-fab" target="_blank" rel="noopener" title="تواصل واتساب" aria-label="تواصل واتساب"><i class="fab fa-whatsapp" aria-hidden="true"></i></a>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
'use strict';
const params = new URLSearchParams(window.location.search);
const categoryId = params.get('id');
let exchangeRate = 1;
function safeText(value, fallback = '') { return typeof value === 'string' && value.trim() ? value.trim() : fallback; }
function safeUrl(value) {
  if (typeof value !== 'string' || !value.trim()) return '';
  try { const url = new URL(value, window.location.href); return ['http:','https:'].includes(url.protocol) ? url.href : ''; } catch { return ''; }
}
function money(value) { return typeof formatSDG === 'function' ? formatSDG(Math.max(0, Number(value) || 0)) : Math.round(Number(value) || 0).toLocaleString('ar-EG'); }
function updateCartBadge() { try { document.getElementById('globalCartCount').textContent = String((JSON.parse(localStorage.getItem('raizey_store_cart') || '[]') || []).length); } catch { document.getElementById('globalCartCount').textContent = '0'; } }
function showState(title, description, icon = 'fa-box-open') { const box = document.getElementById('loadingBox'); box.innerHTML = `<i class="fas ${icon}" aria-hidden="true"></i><h3>${escapeHtml(title)}</h3><p>${escapeHtml(description)}</p>`; box.hidden = false; document.getElementById('content').hidden = true; }
function renderPackages(category, products) {
  const categoryTitle = safeText(category.name, 'القسم');
  document.title = `${categoryTitle} — RAIZEY STORE`;
  document.getElementById('categoryTitle').textContent = categoryTitle;
  document.getElementById('categoryDescription').textContent = safeText(category.description, 'اختر الباقة المناسبة لك وأكمل الطلب بخطوات بسيطة وآمنة.');
  document.getElementById('packageCount').textContent = `${products.length} باقة متاحة`;
  const art = document.getElementById('categoryArt');
  const imageUrl = safeUrl(category.image_url);
  if (imageUrl) { art.replaceChildren(Object.assign(document.createElement('img'), { src:imageUrl, alt:categoryTitle })); }
  const grid = document.getElementById('packagesGrid');
  grid.replaceChildren();
  products.forEach((product) => {
    const link = document.createElement('a'); link.className = 'package-card'; link.href = `product.html?id=${encodeURIComponent(product.id)}`; link.setAttribute('aria-label', `عرض ${safeText(product.name, 'الباقة')}`);
    const image = safeUrl(product.image_url) || imageUrl;
    const imageBox = document.createElement('div'); imageBox.className = 'package-image';
    if (image) { const img = document.createElement('img'); img.src = image; img.alt = safeText(product.name, 'الباقة'); img.loading = 'lazy'; img.decoding = 'async'; img.addEventListener('error', () => imageBox.replaceChildren(Object.assign(document.createElement('i'), { className:'fas fa-box-open', ariaHidden:'true' })), { once:true }); imageBox.appendChild(img); } else { imageBox.innerHTML = '<i class="fas fa-box-open" aria-hidden="true"></i>'; }
    const badge = document.createElement('span'); badge.className = 'package-badge'; badge.textContent = product.has_options ? 'اختيارات متعددة' : 'تسليم فوري'; imageBox.appendChild(badge);
    const body = document.createElement('div'); body.className = 'package-body';
    const name = document.createElement('h3'); name.className = 'package-name'; name.textContent = safeText(product.name, 'باقة رقمية');
    const description = document.createElement('p'); description.className = 'package-description'; description.textContent = safeText(product.description, 'تفاصيل الباقة والخيارات تظهر في الصفحة التالية.');
    const footer = document.createElement('div'); footer.className = 'package-footer';
    const price = document.createElement('span'); price.className = 'package-price'; price.innerHTML = `من ${money(Number(product.price_usd || 0) * exchangeRate)} <small>ج.س</small>`;
    const cta = document.createElement('span'); cta.className = 'package-cta'; cta.innerHTML = 'عرض الباقة <i class="fas fa-arrow-left" aria-hidden="true"></i>';
    footer.append(price, cta); body.append(name, description, footer); link.append(imageBox, body); grid.appendChild(link);
  });
  if (!products.length) { grid.innerHTML = '<div class="catalog-state"><i class="fas fa-box-open" aria-hidden="true"></i><h3>لا توجد باقات متاحة حاليًا</h3><p>سيتم إضافة عروض جديدة لهذا القسم قريبًا.</p></div>'; }
  document.getElementById('loadingBox').hidden = true; document.getElementById('content').hidden = false;
}
async function init() {
  updateCartBadge();
  if (!categoryId) { window.location.href = 'index.html'; return; }
  exchangeRate = Number(await getExchangeRate()) || 1;
  const [categoryResponse, productsResponse] = await Promise.all([
    supabaseClient.from('categories').select('id,name,description,image_url').eq('id', categoryId).eq('is_active', true).single(),
    supabaseClient.from('products').select('id,name,description,image_url,price_usd,has_options,display_order').eq('category_id', categoryId).eq('is_active', true).order('display_order')
  ]);
  if (categoryResponse.error || !categoryResponse.data) { showState('القسم غير متاح', 'ربما تم إخفاؤه أو حُذف. ارجع للمتجر واختر قسمًا آخر.', 'fa-circle-exclamation'); return; }
  if (productsResponse.error) { showState('تعذر تحميل الباقات', 'حدّث الصفحة وحاول مرة أخرى.', 'fa-rotate'); return; }
  renderPackages(categoryResponse.data, productsResponse.data || []);
}
init().catch((error) => { devLog('[RAIZEY] category init error:', error); showState('تعذر تحميل الباقات', 'تحقق من اتصالك ثم أعد المحاولة.', 'fa-triangle-exclamation'); });
</script>
<script src="assets/js/raizey-assistant.js"></script>
</body>
</html>
