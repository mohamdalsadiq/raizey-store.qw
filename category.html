<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اختر باقتك — RAIZEY STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">

<style>
  body { background-color: var(--bg) !important; color: var(--ink) !important; }
  .product-page { max-width: 600px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
  .product-header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 4px; }
  .back-link { color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 700; transition: color 0.2s; }
  .back-link:hover { color: var(--primary); }
  .cart-badge-link { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.2s; }
  .cart-badge-link:hover { border-color: var(--primary); }
  .cart-badge-link i { color: var(--primary); font-size: 14px; }
  .cart-badge-link span { background: var(--primary); color: var(--ink); padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 800; }
  .product-hero { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .product-hero-thumb { width: 90px; height: 90px; border-radius: 12px; overflow: hidden; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .product-hero-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .product-hero-info h1 { font-size: 20px; font-weight: 800; margin: 0; color: var(--ink); }
  .trust-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .trust-badge-item { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 7px 12px; font-size: 12px; font-weight: 700; color: var(--ink); }
  .trust-badge-item i { color: var(--primary); font-size: 13px; }
  .category-sub { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }
  .section-label { font-size: 14px; font-weight: 800; color: var(--text-muted); margin-bottom: 12px; }

  /* الباقات الأساسية */
  .variant-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .variant-btn { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 14px; padding: 18px 10px; text-align: center; cursor: pointer; transition: 0.15s ease; display: flex; align-items: center; justify-content: center; min-height: 55px; color: var(--ink); }
  .variant-btn .v-name { font-size: 14px; font-weight: 800; color: var(--ink); }
  .variant-btn.active { background: var(--primary); border-color: var(--primary); }
  .variant-btn.active .v-name { color: var(--ink); }

  /* الخيارات الفرعية */
  .sub-options-container { display: none; margin-bottom: 20px; padding: 15px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; }
  .sub-options-container.visible { display: block; }
  .sub-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sub-option-btn { background: var(--bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; transition: 0.15s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 55px; color: var(--ink); }
  .sub-option-btn .so-name { font-size: 14px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
  .sub-option-btn .so-price { font-size: 13px; font-weight: 800; color: var(--primary); }
  .sub-option-btn.active { background: var(--primary); border-color: var(--primary); }
  .sub-option-btn.active .so-name { color: var(--ink); }
  .sub-option-btn.active .so-price { color: var(--ink); }

  .price-display { font-size: 26px; font-weight: 900; color: var(--primary); text-align: center; margin: 4px 0 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .field input[type="text"], .field select { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-sizing: border-box; color: var(--ink); font-size: 15px; font-weight: 600; }
  .field input[type="text"]:focus, .field select:focus { border-color: var(--primary); outline: none; }
  .qty-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin: 10px 0 8px; }
  .qty-row .qty-label { font-size: 14px; font-weight: 800; color: var(--ink); }
  .qty-stepper { display: flex; align-items: center; gap: 14px; }
  .qty-stepper button { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--primary); background: transparent; color: var(--primary); font-size: 22px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; user-select: none; }
  .qty-stepper button:active { transform: scale(0.92); }
  .qty-stepper button:disabled { opacity: 0.4; cursor: not-allowed; }
  .qty-stepper .qty-value { min-width: 30px; text-align: center; font-size: 18px; font-weight: 900; color: var(--ink); }
  .live-total-box { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.02); border: 1px dashed var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; }
  .live-total-label { font-size: 13px; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .live-total-label i { color: var(--primary); font-size: 12px; }
  .live-total-val { font-size: 15px; font-weight: 900; color: var(--ink); opacity: 0.85; }
  .btn-buy-now { width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 6px; background: var(--primary); border: none; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.15s ease; }
  .btn-buy-now:active { transform: scale(0.98); }
  .btn-secondary-cart { width: 100%; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; margin-bottom: 20px; background: transparent; border: 1px solid var(--primary); color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.15s ease; }
  .btn-secondary-cart:active { transform: scale(0.98); }
  .form-error-box { text-align: center; font-size: 13px; font-weight: 700; margin-top: 10px; min-height: 20px; }
  .product-instructions-box { background: var(--bg-card); border: 1px solid var(--border); border-right: 4px solid var(--primary); padding: 16px; border-radius: 10px; margin: 25px 0; font-size: 14px; line-height: 1.6; color: var(--ink); white-space: pre-line; }
  .product-instructions-title { color: var(--primary); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 15px; font-weight: 700; }
  .related-section { margin-top: 30px; padding-top: 20px; border-top: 1px dashed var(--border); }
  .related-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .related-card { flex-shrink: 0; width: 130px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-decoration: none; color: var(--ink); }
  .related-thumb { width: 100%; height: 70px; border-radius: 8px; overflow: hidden; background: var(--bg); margin-bottom: 8px; }
  .related-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .related-name { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .related-price { font-size: 12px; font-weight: 800; color: var(--primary); }
</style>
</head>
<body>

<div class="product-page" id="productPage">
  <div class="product-header-actions">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> رجوع للمتجر</a>
    <a href="cart.html" class="cart-badge-link"><i class="fas fa-shopping-cart"></i> السلة <span id="globalCartCount">0</span></a>
  </div>

  <div id="loadingBox" style="text-align:center; padding:60px 0; color:var(--text-muted);">جارِ التحميل...</div>
  <div id="content" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const categoryId = params.get('id');
let currentUser = null;
let category = null;
let variants = [];
let selectedMainProduct = null; 
let selectedSubOption = null;   
let selectedQty = 1;
let relatedProducts = [];
let exchangeRate = 1;

function safeFormatSDG(val) {
  if (typeof formatSDG === 'function') return formatSDG(val);
  return Math.round(val).toLocaleString('ar-EG');
}

function updateCartBadgeGlobal() {
  const cart = JSON.parse(localStorage.getItem('raizey_store_cart')) || [];
  document.getElementById('globalCartCount').textContent = cart.length;
}

function getCurrentPriceSDG() {
  if (!selectedMainProduct) return 0;
  let price = parseFloat(selectedMainProduct.price_usd) || 0;
  if (selectedSubOption) {
    price = parseFloat(selectedSubOption.price_usd) || 0;
  }
  return price * exchangeRate;
}

async function init() {
  updateCartBadgeGlobal();
  if (!categoryId) { window.location.href = 'index.html'; return; }

  const [{ data: { session } }, rate] = await Promise.all([
    supabaseClient.auth.getSession(),
    getExchangeRate()
  ]);

  if (!session) {
    sessionStorage.setItem('redirect_after_login', window.location.href);
    window.location.href = 'login.html';
    return;
  }
  currentUser = session.user;
  exchangeRate = rate;

  const [categoryResponse, productsResponse, relatedResponse] = await Promise.all([
    supabaseClient.from('categories').select('*').eq('id', categoryId).eq('is_active', true).single(),
    supabaseClient.from('products').select('*').eq('category_id', categoryId).eq('is_active', true).order('display_order'),
    supabaseClient.from('products').select('*').eq('is_active', true).neq('category_id', categoryId).limit(6)
  ]);

  if (categoryResponse.error || !categoryResponse.data) {
    document.getElementById('loadingBox').textContent = 'التصنيف غير موجود أو غير متاح حالياً';
    return;
  }
  if (productsResponse.error || relatedResponse.error) {
    document.getElementById('loadingBox').textContent = 'تعذر تحميل المنتجات، حاول مرة أخرى';
    return;
  }

  category = categoryResponse.data;
  variants = productsResponse.data || [];
  relatedProducts = (relatedResponse.data || []).map(p => ({ ...p, price_sdg: Number(p.price_usd) * Number(exchangeRate) }));

  if (variants.length === 0) {
    document.getElementById('loadingBox').textContent = 'لا توجد باقات متاحة في هذا القسم حالياً';
    return;
  }

  render();
}

function render() {
  document.getElementById('loadingBox').style.display = 'none';
  const content = document.getElementById('content');
  content.style.display = 'block';

  const p = variants[0]; 
  const fields = p.required_fields || [];

  content.innerHTML = `
    <div class="product-hero">
      <div class="product-hero-thumb">
        ${p.image_url ? `<img src="${escapeAttribute(sanitizeUrl(p.image_url))}" alt="${escapeAttribute(p.name)}">` : (category && category.image_url ? `<img src="${escapeAttribute(sanitizeUrl(category.image_url))}" alt="${escapeAttribute(category.name)}">` : '<i class="fas fa-box-open" style="font-size:24px; color:var(--text-muted);"></i>')}
      </div>
      <div class="product-hero-info"><h1>${escapeHtml(category ? category.name : p.name)}</h1></div>
    </div>

    <div class="trust-badges">
      <span class="trust-badge-item"><i class="fas fa-bolt"></i> تسليم فوري ومضمون 100%</span>
      <span class="trust-badge-item"><i class="fas fa-shield-halved"></i> دفع آمن وموثوق</span>
      <span class="trust-badge-item"><i class="fas fa-headset"></i> دعم فني على مدار الساعة</span>
    </div>

    ${category && category.description ? `<div class="category-sub">${escapeHtml(category.description)}</div>` : ''}

    <div class="section-label">اختر الباقة الأساسية</div>
    <div class="variant-grid" id="mainVariantsGrid">
      ${variants.map((v, i) => `
        <button class="variant-btn" data-index="${i}" data-product-id="${escapeAttribute(v.id)}">
          <div class="v-name">${escapeHtml(v.name)}</div>
        </button>
      `).join('')}
    </div>

    <!-- حاوية الخيارات الفرعية -->
    <div class="sub-options-container" id="subOptionsContainer">
      <div class="section-label">اختر الخيار المطلوب (إجباري)</div>
      <div class="sub-options-grid" id="subOptionsGrid"></div>
    </div>

    <div class="price-display" id="unitPriceDisplay">اختر الخيار لعرض السعر</div>

    ${fields.length > 0 ? `
      <div class="section-label">بيانات الطلب المطلوبة</div>
      ${fields.map(f => `
        <div class="field">
          <label>${escapeHtml(f.label)} *</label>
          <input type="text" data-field-key="${escapeAttribute(f.key)}" data-field-label="${escapeAttribute(f.label)}" required maxlength="500" placeholder="${escapeAttribute(f.placeholder ? f.placeholder : `اكتب ${f.label} هنا...`)}">
        </div>
      `).join('')}
    ` : ''}

    <div class="qty-row">
      <span class="qty-label">الكمية</span>
      <div class="qty-stepper">
        <button type="button" id="qtyMinus" aria-label="إنقاص الكمية">&minus;</button>
        <span class="qty-value" id="qtyValue">1</span>
        <button type="button" id="qtyPlus" aria-label="زيادة الكمية">+</button>
      </div>
    </div>

    <div class="live-total-box">
      <span class="live-total-label"><i class="fas fa-calculator"></i> الإجمالي اللحظي:</span>
      <span class="live-total-val" id="liveTotalDisplay">0 ج.س</span>
    </div>

    <div class="form-error-box" id="formError"></div>

    <button class="btn-buy-now" id="buyNowBtn"><i class="fas fa-bolt"></i> اشترِ الآن</button>
    <button class="btn-secondary-cart" id="addToCartBtn"><i class="fas fa-cart-plus"></i> إضافة إلى سلة المشتريات</button>

    ${p.instructions ? `
      <div class="product-instructions-box">
        <div class="product-instructions-title"><i class="fas fa-circle-info"></i> تفاصيل وطريقة استلام المنتج:</div>
        ${escapeHtml(p.instructions).replace(/\n/g, '<br>')}
      </div>
    ` : ''}

    ${relatedProducts.length > 0 ? `
      <div class="related-section">
        <div class="section-label">منتجات ذات صلة</div>
        <div class="related-grid">
          ${relatedProducts.map(r => `
            <a href="category.html?id=${escapeAttribute(r.category_id)}" class="related-card">
                <div class="related-thumb">${r.image_url ? `<img src="${escapeAttribute(sanitizeUrl(r.image_url))}" alt="${escapeAttribute(r.name)}">` : ''}</div>
                <div class="related-name">${escapeHtml(r.name)}</div>
              <div class="related-price">${safeFormatSDG(r.price_sdg)} ج.س</div>
            </a>
          `).join('')}
        </div>
      </div>
    ` : ''}
  `;

  attachEvents();
}

function attachEvents() {
  const qtyValueEl = document.getElementById('qtyValue');
  const qtyMinusBtn = document.getElementById('qtyMinus');
  const qtyPlusBtn = document.getElementById('qtyPlus');
  const errorBox = document.getElementById('formError');
  const addToCartBtn = document.getElementById('addToCartBtn');
  const buyNowBtn = document.getElementById('buyNowBtn');

  function updateLiveCalculations() {
    const total = getCurrentPriceSDG() * selectedQty;
    const priceEl = document.getElementById('unitPriceDisplay');
    const totalEl = document.getElementById('liveTotalDisplay');
    
    if (selectedSubOption) {
      priceEl.textContent = safeFormatSDG(getCurrentPriceSDG()) + ' ج.س';
      totalEl.textContent = safeFormatSDG(total) + ' ج.س';
    } else {
      priceEl.textContent = 'اختر الخيار لعرض السعر';
    }
    
    qtyValueEl.textContent = selectedQty;
    qtyMinusBtn.disabled = selectedQty <= 1;
  }

  // أحداث النقر على الباقات الأساسية (مثل RedotPay)
  document.querySelectorAll('#mainVariantsGrid .variant-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#mainVariantsGrid .variant-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      const index = parseInt(btn.dataset.index);
      selectedMainProduct = variants[index];
      selectedSubOption = null; 
      
      // جلب الخيارات الفرعية الخاصة بهذا المنتج
      const subContainer = document.getElementById('subOptionsContainer');
      const subGrid = document.getElementById('subOptionsGrid');
      subGrid.innerHTML = ''; 
      
      if (selectedMainProduct.options && selectedMainProduct.options.length > 0) {
        subContainer.classList.add('visible');
        selectedMainProduct.options.forEach(opt => {
          const optBtn = document.createElement('div');
          optBtn.className = 'sub-option-btn';
          optBtn.dataset.optId = opt.id;
          optBtn.innerHTML = `
            <div class="so-name">${escapeHtml(opt.label)}</div>
            <div class="so-price">${safeFormatSDG(opt.price_usd * exchangeRate)} ج.س</div>
          `;
          
          // حدث النقر على الخيار الفرعي (مثل: حساب موثق فقط)
          optBtn.addEventListener('click', () => {
            document.querySelectorAll('#subOptionsGrid .sub-option-btn').forEach(b => b.classList.remove('active'));
            optBtn.classList.add('active');
            selectedSubOption = opt;
            updateLiveCalculations(); // تحديث السعر لحظياً
          });
          
          subGrid.appendChild(optBtn);
        });
      } else {
        subContainer.classList.remove('visible');
        // لو مافي خيارات فرعية، نعتبر الباقة الأساسية هي الخيار المختار
        selectedSubOption = { id: 'main', label: selectedMainProduct.name, price_usd: selectedMainProduct.price_usd };
        updateLiveCalculations();
      }
    });
  });

  qtyMinusBtn.addEventListener('click', () => {
    if (selectedQty > 1) { selectedQty--; updateLiveCalculations(); }
  });

  qtyPlusBtn.addEventListener('click', () => {
    if (selectedQty < 99) { selectedQty++; updateLiveCalculations(); }
  });

  function collectFieldValues() {
    const inputs = document.querySelectorAll('[data-field-key]');
    const values = {};
    if (inputs.length === 0) return {};
    for (const input of inputs) {
      if (!input.value.trim()) return null;
      values[input.dataset.fieldKey] = input.value.trim();
    }
    return values;
  }

  // يبني خريطة (مفتاح الحقل -> الاسم المقروء) لتظهر في السلة والدفع بدل مفتاح الحقل الخام
  function collectFieldLabels() {
    const inputs = document.querySelectorAll('[data-field-key]');
    const labels = {};
    inputs.forEach(input => {
      labels[input.dataset.fieldKey] = input.dataset.fieldLabel || input.dataset.fieldKey;
    });
    return labels;
  }

  function validateSelection() {
    if (!selectedMainProduct) {
      errorBox.textContent = 'الرجاء اختيار الباقة الأساسية أولاً!';
      errorBox.style.color = 'var(--danger)';
      return false;
    }
    if (selectedMainProduct.options && selectedMainProduct.options.length > 0 && !selectedSubOption) {
      errorBox.textContent = 'الرجاء اختيار أحد الخيارات الفرعية المتاحة!';
      errorBox.style.color = 'var(--danger)';
      return false;
    }
    return true;
  }

  function buildCartItem(fieldValues) {
    const itemName = selectedSubOption && selectedSubOption.id !== 'main' 
      ? `${selectedMainProduct.name} (${selectedSubOption.label})`
      : selectedMainProduct.name;
      
    return {
      cart_item_id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
      product_id: selectedMainProduct.id,
      name: itemName,
      price_sdg: getCurrentPriceSDG(),
      image_url: selectedMainProduct.image_url || (category ? category.image_url : ''),
      field_values: fieldValues,
      field_labels: collectFieldLabels(),
      quantity: selectedQty,
      selected_option: selectedSubOption
    };
  }

  addToCartBtn.addEventListener('click', () => {
    errorBox.textContent = '';
    if (!validateSelection()) return;
    const fieldValues = collectFieldValues();
    if (fieldValues === null) {
      errorBox.textContent = 'يرجى ملء جميع بيانات الطلب المطلوبة أولاً!';
      return;
    }
    
    let cart = JSON.parse(localStorage.getItem('raizey_store_cart')) || [];
    cart.push(buildCartItem(fieldValues));
    localStorage.setItem('raizey_store_cart', JSON.stringify(cart));
    updateCartBadgeGlobal();

    errorBox.style.color = 'var(--success, #10b981)';
    errorBox.textContent = 'تم إضافة المنتج بنجاح إلى السلة!';
    addToCartBtn.innerHTML = '<i class="fas fa-check-circle"></i> تم الإضافة بنجاح';
    setTimeout(() => {
      addToCartBtn.innerHTML = '<i class="fas fa-cart-plus"></i> إضافة إلى سلة المشتريات';
      errorBox.textContent = '';
    }, 2500);
  });

  buyNowBtn.addEventListener('click', () => {
    errorBox.textContent = '';
    if (!validateSelection()) return;
    const fieldValues = collectFieldValues();
    if (fieldValues === null) {
      errorBox.textContent = 'يرجى ملء جميع بيانات الطلب المطلوبة أولاً!';
      return;
    }
    
    // ── شراء مباشر: لا يُضاف للسلة إطلاقاً ولا يُدمج معها ──
    try {
      sessionStorage.setItem('raizey_direct_buy', JSON.stringify({
        created_at: Date.now(),
        items: [buildCartItem(fieldValues)]
      }));
    } catch (e) {
      errorBox.textContent = 'تعذّر بدء الشراء المباشر. حدّث الصفحة وحاول مجدداً.';
      return;
    }

    buyNowBtn.disabled = true;
    buyNowBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارِ التوجيه للدفع...';
    window.location.href = 'checkout.html';
  });
}

init();
</script>
</body>
</html>
