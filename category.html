<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>كتالوج Raizey Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .catalog-page { max-width: 1100px; margin: 0 auto; padding: 20px 20px 88px; }
    .catalog-topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
    .catalog-back, .catalog-cart { display:inline-flex; align-items:center; gap:7px; color:var(--text-muted); font-size:13px; font-weight:700; }
    .catalog-cart { color:var(--ink); background:var(--bg-card); border:1px solid var(--border); border-radius:999px; padding:9px 13px; }
    .catalog-cart span { min-width:21px; height:21px; display:grid; place-items:center; border-radius:50%; background:var(--primary); color:var(--ink); font-family:var(--font-mono); font-size:11px; }
    .catalog-heading { margin-bottom:22px; }
    .catalog-kicker { display:inline-flex; align-items:center; gap:7px; color:var(--primary); font-size:12px; font-weight:800; margin-bottom:7px; }
    .catalog-heading h1 { font-size:clamp(22px, 5vw, 34px); line-height:1.3; margin-bottom:7px; }
    .catalog-heading p { color:var(--text-muted); font-size:14px; max-width:680px; }
    .catalog-breadcrumb { display:flex; flex-wrap:wrap; align-items:center; gap:7px; color:var(--text-muted); font-size:12px; margin-bottom:18px; }
    .catalog-breadcrumb a { color:var(--primary); font-weight:700; }
    .catalog-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .catalog-service-card, .catalog-product-card { display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--border); border-radius:18px; background:var(--bg-card); box-shadow:0 8px 24px rgba(31,34,43,.06); transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease; }
    .catalog-service-card:hover, .catalog-service-card:focus-visible, .catalog-product-card:hover, .catalog-product-card:focus-visible { transform:translateY(-2px); border-color:var(--primary); box-shadow:0 12px 28px rgba(255,106,26,.14); outline:none; }
    .catalog-card-image { width:100%; aspect-ratio:1.35; display:grid; place-items:center; overflow:hidden; color:var(--primary); background:linear-gradient(135deg,rgba(255,106,26,.16),rgba(255,208,143,.18)); font-size:28px; }
    .catalog-card-image img { width:100%; height:100%; object-fit:cover; }
    .catalog-card-body { display:grid; gap:7px; padding:14px; }
    .catalog-card-body h2 { font-size:15px; line-height:1.35; }
    .catalog-card-body p { color:var(--text-muted); font-size:11px; line-height:1.55; }
    .catalog-card-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; }
    .catalog-card-link { display:inline-flex; align-items:center; gap:6px; color:var(--primary); font-size:12px; font-weight:800; }
    .catalog-product-price { color:var(--primary); font-family:var(--font-mono); font-size:13px; font-weight:700; }
    .catalog-old-price { display:block; color:var(--text-muted); font-size:10px; margin-bottom:2px; }
    .catalog-empty-state { grid-column:1/-1; text-align:center; padding:48px 20px; border:1px dashed var(--border); border-radius:18px; color:var(--text-muted); background:var(--bg-card); }
    .catalog-empty-state i { color:var(--primary); font-size:28px; margin-bottom:12px; }
    .catalog-error { text-align:center; padding:50px 20px; color:var(--text-muted); }
    .catalog-error h2 { color:var(--ink); font-size:18px; margin-bottom:8px; }
    @media (min-width:640px) { .catalog-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (min-width:900px) { .catalog-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
    @media (max-width:520px) { .catalog-page { padding-inline:14px; } .catalog-topbar { margin-bottom:16px; } .catalog-card-body { padding:11px; } .catalog-card-body h2 { font-size:13px; } }
  </style>
</head>
<body>
  <main class="catalog-page">
    <nav class="catalog-topbar" aria-label="التنقل">
      <a class="catalog-back" href="index.html"><i class="fas fa-arrow-right" aria-hidden="true"></i> العودة للمتجر</a>
      <a class="catalog-cart" href="cart.html" aria-label="فتح السلة">السلة <span id="cartCount">0</span><i class="fas fa-cart-shopping" aria-hidden="true"></i></a>
    </nav>
    <div id="breadcrumb" class="catalog-breadcrumb"></div>
    <header class="catalog-heading">
      <div class="catalog-kicker"><i class="fas fa-layer-group" aria-hidden="true"></i><span id="kicker">كتالوج المتجر</span></div>
      <h1 id="pageTitle">جارٍ التحميل...</h1>
      <p id="pageDescription"></p>
    </header>
    <section id="catalogGrid" class="catalog-grid" aria-live="polite"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const categoryId = params.get('category_id');
    const subcategoryId = params.get('id');
    const grid = document.getElementById('catalogGrid');
    const pageTitle = document.getElementById('pageTitle');
    const pageDescription = document.getElementById('pageDescription');
    const breadcrumb = document.getElementById('breadcrumb');

    function safeText(value, fallback = '') { return typeof value === 'string' && value.trim() ? value.trim() : fallback; }
    function safeImage(value) {
      if (typeof value !== 'string' || !value.trim()) return null;
      try { const url = new URL(value, window.location.href); return ['http:', 'https:'].includes(url.protocol) ? url.href : null; } catch { return null; }
    }
    function icon(name) { const el = document.createElement('i'); el.className = name; el.setAttribute('aria-hidden', 'true'); return el; }
    function setBreadcrumb(items) {
      breadcrumb.replaceChildren();
      items.forEach((item, index) => {
        if (index) breadcrumb.append(icon('fas fa-chevron-left'));
        if (item.href) { const link = document.createElement('a'); link.href = item.href; link.textContent = item.label; breadcrumb.append(link); }
        else { const span = document.createElement('span'); span.textContent = item.label; breadcrumb.append(span); }
      });
    }
    function setImage(container, url, fallbackIcon) {
      if (!url) { container.append(icon(fallbackIcon)); return; }
      const image = document.createElement('img'); image.src = url; image.alt = ''; image.loading = 'lazy'; image.decoding = 'async';
      image.addEventListener('error', () => container.replaceChildren(icon(fallbackIcon)), { once: true }); container.append(image);
    }
    function renderEmpty(message) { grid.replaceChildren(); const empty = document.createElement('div'); empty.className='catalog-empty-state'; empty.append(icon('fas fa-box-open')); const title=document.createElement('h2'); title.textContent=message; empty.append(title); grid.append(empty); }
    function renderError() { grid.replaceChildren(); const box=document.createElement('div'); box.className='catalog-error'; const h=document.createElement('h2'); h.textContent='تعذر تحميل الكتالوج'; const p=document.createElement('p'); p.textContent='تحقق من الاتصال ثم أعد المحاولة.'; box.append(h,p); grid.append(box); }

    function createSubcategoryCard(item, categoryName) {
      const card=document.createElement('a'); card.className='catalog-service-card'; card.href=`category.html?id=${encodeURIComponent(String(item.id))}`; card.setAttribute('aria-label',`فتح تصنيف ${safeText(item.name, categoryName)}`);
      const image=document.createElement('div'); image.className='catalog-card-image'; setImage(image, safeImage(item.image_url), 'fas fa-layer-group');
      const body=document.createElement('div'); body.className='catalog-card-body'; const title=document.createElement('h2'); title.textContent=safeText(item.name,'تصنيف'); const desc=document.createElement('p'); desc.textContent=safeText(item.description,'تصفح المنتجات والباقات المتاحة'); const foot=document.createElement('div'); foot.className='catalog-card-foot'; const link=document.createElement('span'); link.className='catalog-card-link'; link.append(document.createTextNode('عرض المنتجات '),icon('fas fa-arrow-left')); foot.append(link); body.append(title,desc,foot); card.append(image,body); return card;
    }
    function createProductCard(item, rate) {
      const card=document.createElement('a'); card.className='catalog-product-card'; card.href=`product.html?id=${encodeURIComponent(String(item.id))}`; card.setAttribute('aria-label',`فتح المنتج ${safeText(item.name,'منتج')}`);
      const image=document.createElement('div'); image.className='catalog-card-image'; setImage(image,safeImage(item.image_url),'fas fa-gamepad');
      const body=document.createElement('div'); body.className='catalog-card-body'; const title=document.createElement('h2'); title.textContent=safeText(item.name,'منتج رقمي'); const desc=document.createElement('p'); desc.textContent=safeText(item.description,'اختر المنتج وأكمل طلبك بسهولة.'); const foot=document.createElement('div'); foot.className='catalog-card-foot'; const priceWrap=document.createElement('span'); const current=Number(item.price_usd)||0; const old=Number(item.compare_at_price_usd)||0; if(old>current){const oldEl=document.createElement('del'); oldEl.className='catalog-old-price'; oldEl.textContent=rate>0?`${formatSDG(old*rate)} ج.س`:`$${old.toFixed(2)}`; priceWrap.append(oldEl);} const price=document.createElement('span'); price.className='catalog-product-price'; price.textContent=rate>0?`${formatSDG(current*rate)} ج.س`:`$${current.toFixed(2)}`; priceWrap.append(price); const link=document.createElement('span'); link.className='catalog-card-link'; link.append(document.createTextNode('اختيار '),icon('fas fa-arrow-left')); foot.append(priceWrap,link); body.append(title,desc,foot); card.append(image,body); return card;
    }

    async function init() {
      try { document.getElementById('cartCount').textContent = String((JSON.parse(localStorage.getItem('raizey_store_cart') || '[]') || []).length); } catch { document.getElementById('cartCount').textContent = '0'; }
      if (!categoryId && !subcategoryId) { window.location.href='index.html'; return; }
      try {
        if (categoryId) {
          const [{ data: category, error: categoryError }, { data: subcategories, error: subcategoryError }] = await Promise.all([
            supabaseClient.from('categories').select('id,name,description').eq('id', categoryId).eq('is_active', true).single(),
            supabaseClient.from('subcategories').select('id,category_id,name,description,image_url,display_order').eq('category_id', categoryId).eq('is_active', true).order('display_order')
          ]);
          if (categoryError || !category) throw categoryError || new Error('category_not_found');
          const name=safeText(category.name,'القسم'); document.title=`${name} — Raizey Store`; pageTitle.textContent=name; pageDescription.textContent=safeText(category.description,'اختر التصنيف أو الباقة التي تريد تصفح منتجاتها.'); document.getElementById('kicker').textContent='القسم الرئيسي'; setBreadcrumb([{label:'المتجر',href:'index.html'},{label:name}]);
          if (subcategoryError || !subcategories?.length) { renderEmpty('لا توجد تصنيفات متاحة في هذا القسم حالياً.'); return; }
          grid.replaceChildren(...subcategories.map(item=>createSubcategoryCard(item,name))); return;
        }
        const [{ data: subcategory, error: subcategoryError }, { data: products, error: productsError }, rate] = await Promise.all([
          supabaseClient.from('subcategories').select('id,category_id,name,description,image_url').eq('id', subcategoryId).eq('is_active', true).single(),
          supabaseClient.from('products').select('id,subcategory_id,name,description,image_url,price_usd,compare_at_price_usd,display_order').eq('subcategory_id', subcategoryId).eq('is_active', true).order('display_order'),
          getExchangeRate().catch(()=>0)
        ]);
        if (subcategoryError || !subcategory) throw subcategoryError || new Error('subcategory_not_found');
        const { data: category } = await supabaseClient.from('categories').select('id,name').eq('id', subcategory.category_id).eq('is_active', true).maybeSingle();
        const name=safeText(subcategory.name,'التصنيف'); const categoryName=safeText(category?.name,'القسم'); document.title=`${name} — Raizey Store`; pageTitle.textContent=name; pageDescription.textContent=safeText(subcategory.description,'اختر المنتج التفصيلي المناسب وأكمل طلبك بسهولة.'); document.getElementById('kicker').textContent='التصنيف / الباقة'; setBreadcrumb([{label:'المتجر',href:'index.html'},{label:categoryName,href:`category.html?category_id=${encodeURIComponent(String(subcategory.category_id))}`},{label:name}]);
        if (productsError || !products?.length) { renderEmpty('لا توجد منتجات متاحة في هذا التصنيف حالياً.'); return; }
        const rateValue=Number(rate)||0; grid.replaceChildren(...products.map(item=>createProductCard(item,rateValue)));
      } catch (error) { renderError(); }
    }
    init();
  </script>
</body>
</html>
