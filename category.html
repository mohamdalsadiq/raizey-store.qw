function selectProduct(id) { selectedProduct = products.find(product => String(product.id) === String(id)) || products[0] || null; selectedInternalOption = null; renderOptions(); renderSelectedProduct(); document.getElementById('selectedPanel')?.scrollIntoView({ behavior:'smooth', block:'start' }); }
function collectFields() { const values = {}, labels = {}; for (const input of document.querySelectorAll('#selectedPanel [data-field-key]')) { const value = input.value.trim(); if (!value) return null; values[input.dataset.fieldKey] = value; labels[input.dataset.fieldKey] = input.dataset.fieldLabel || input.dataset.fieldKey; } return { values, labels }; }
function buildCartItem() { if (!selectedProduct) return null; const fields = collectFields(); if (!fields) return null; const priceUsd = selectedInternalOption ? usd(selectedInternalOption.price_usd ?? selectedInternalOption.price) : usd(selectedProduct.price_usd); return { cart_item_id:`${Date.now()}_${Math.random().toString(36).slice(2,8)}`, product_id:selectedProduct.id, name:selectedProduct.name, price_sdg:priceUsd * exchangeRate, quantity:(quantity > 0 ? quantity : 1), image_url:selectedProduct.image_url, selected_option:selectedInternalOption ? { id:selectedInternalOption.id, label:selectedInternalOption.label, price_usd:priceUsd, price_sdg:priceUsd * exchangeRate } : null, field_values:fields.values, field_labels:fields.labels }; }
function setError(message, success = false) { const box = document.getElementById('formError'); if (!box) return; box.textContent = message; box.style.color = success ? 'var(--cat-primary)' : ''; box.focus?.(); }
function addToCart() { const item = buildCartItem(); if (!item) { setError('اختر الباقة وأكمل بيانات الطلب المطلوبة أولاً.'); return; } let cart = []; try { cart = JSON.parse(localStorage.getItem('raizey_store_cart') || '[]') || []; } catch { cart = []; } cart.push(item); localStorage.setItem('raizey_store_cart', JSON.stringify(cart)); updateCartBadge(); setError('تمت إضافة الخيار إلى السلة.', true); }
async function confirmOrder() { const item = buildCartItem(); if (!item) { setError('اختر الباقة وأكمل بيانات الطلب المطلوبة أولاً.'); return; } const { data:{ session } } = await supabaseClient.auth.getSession(); if (!session) { sessionStorage.setItem('redirect_after_login', window.location.href); window.location.href = 'login.html'; return; } sessionStorage.setItem('raizey_direct_buy', JSON.stringify({ created_at:Date.now(), items:[item] })); window.location.href = 'checkout-v2.html'; }
function renderCategory(category) { document.title = `${safeText(category.name, 'الباقات')} — RAIZEY STORE`; document.getElementById('categoryTitle').textContent = safeText(category.name, 'الباقات'); document.getElementById('categoryDescription').textContent = safeText(category.description, 'اختر الخيار المناسب لك وأكمل الطلب بخطوات بسيطة وآمنة.'); const image = safeUrl(category.image_url); categoryImageUrl = image; if (image) document.getElementById('categoryArt').replaceChildren(Object.assign(document.createElement('img'), { src:image, alt:safeText(category.name, 'القسم') })); document.getElementById('loadingBox').hidden = true; document.getElementById('content').hidden = false; if (products.length) selectProduct(products[0].id); else { document.getElementById('productOptions').innerHTML = '<div class="catalog-state"><i class="fas fa-box-open" aria-hidden="true"></i><h3>لا توجد خيارات متاحة حاليًا</h3><p>سيتم إضافة عروض جديدة لهذا التصنيف قريبًا.</p></div>'; } }
async function init() { updateCartBadge(); if (!categoryId) { window.location.href = 'index.html'; return; } exchangeRate = Number(await getExchangeRate()) || 1; const [categoryResponse, productsResponse] = await Promise.all([supabaseClient.from('categories').select('id,name,description,image_url').eq('id', categoryId).eq('is_active', true).single(), supabaseClient.from('products').select('id,name,description,image_url,price_usd,has_options,options,delivery_badge_text,instructions,required_fields,display_order').eq('category_id', categoryId).eq('is_active', true).order('display_order')]); if (categoryResponse.error || !categoryResponse.data) { showState('القسم غير متاح', 'ربما تم إخفاؤه أو حُذف. ارجع للمتجر واختر قسمًا آخر.', 'fa-circle-exclamation'); return; } if (productsResponse.error) { showState('تعذر تحميل الخيارات', 'حدّث الصفحة وحاول مرة أخرى.', 'fa-rotate'); return; } products = productsResponse.data || []; renderCategory(categoryResponse.data); }
init().catch((error) => { devLog('[RAIZEY] category init error:', error); showState('تعذر تحميل الخيارات', 'تحقق من اتصالك ثم أعد المحاولة.', 'fa-triangle-exclamation'); });
</script>
