  :root { --cat-bg: var(--mm-surface); --cat-card: var(--mm-surface-2); --cat-border: var(--mm-border); --cat-ink: var(--mm-text); --cat-muted: var(--mm-text-muted); --cat-primary: var(--mm-gold); --cat-danger: var(--mm-danger-fill); }
  body { margin: 0; background: var(--cat-bg)!important; color: var(--cat-ink)!important; font-family: var(--font-display); }
  .catalog-page { width: min(100%,680px); margin: 0 auto; padding: 18px 16px 116px; box-sizing: border-box; }
  .catalog-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .catalog-back,.catalog-cart { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 9px 13px; border: 1px solid var(--cat-border); border-radius: 999px; background: var(--cat-card); color: var(--cat-ink); font-size: 13px; font-weight: 900; text-decoration: none; }
  .catalog-back:hover,.catalog-back:focus-visible,.catalog-cart:hover,.catalog-cart:focus-visible { border-color: var(--cat-primary); outline: 3px solid rgba(255, 212, 0,.13); outline-offset: 1px; }
  .catalog-cart i { color: var(--cat-primary); }
  .catalog-cart span { display: grid; place-items: center; min-width: 22px; height: 22px; border-radius: 50%; background: var(--cat-primary); color: var(--cat-ink); font: 800 11px var(--font-mono); }
  .category-hero { display: grid; grid-template-columns: minmax(0,1fr) 126px; align-items: center; gap: 16px; padding: 17px; border: 1px solid var(--cat-border); border-radius: 22px; background: linear-gradient(135deg,var(--mm-surface-3) 0%,var(--cat-card) 100%); box-shadow: 0 10px 28px rgba(31,34,43,.05); }
  .category-hero-copy { min-width: 0; }
  .category-eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--cat-primary); font-size: 11px; font-weight: 900; }
  .category-hero h1 { margin: 7px 0 5px; color: var(--cat-ink); font-size: clamp(23px,6vw,32px); line-height: 1.3; font-weight: 900; }
  .category-hero p { color: var(--cat-muted); font-size: 13px; line-height: 1.7; }
  .category-hero-art { width: 126px; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(255, 212, 0,.2); border-radius: 18px; background: var(--mm-surface); color: var(--cat-primary); font-size: 38px; }
  .category-hero-art img { width: 100%; height: 100%; object-fit: cover; }
  .trust-row { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 8px; margin: 13px 0 22px; }
  .trust-pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid var(--cat-border); border-radius: 999px; background: var(--cat-card); color: var(--cat-ink); font-size: 11px; font-weight: 900; }
  .trust-pill i { color: var(--cat-primary); }
  .catalog-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
  .catalog-heading h2 { color: var(--cat-ink); font-size: 22px; font-weight: 900; }
  .catalog-heading p { color: var(--cat-muted); font-size: 12px; }
  .option-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
  .product-option { position: relative; min-height: 70px; padding: 11px 8px; border: 2px solid var(--cat-border); border-radius: 14px; background: var(--cat-card); color: var(--cat-ink); cursor: pointer; text-align: center; transition: border-color .16s ease,background .16s ease,transform .16s ease,box-shadow .16s ease; }
  .product-option:hover,.product-option:focus-visible { border-color: rgba(255, 212, 0,.65); outline: 3px solid rgba(255, 212, 0,.13); outline-offset: 1px; }
  .product-option:active { transform: scale(.98); }
  .product-option.selected { border-color: var(--cat-primary); background: var(--mm-surface-3); box-shadow: 0 8px 18px rgba(255, 212, 0,.14); }
  .product-option .check { position: absolute; top: 7px; left: 8px; color: var(--cat-primary); font-size: 12px; opacity: 0; }
  .product-option.selected .check { opacity: 1; }
  .product-option-name { display: block; font-size: clamp(11px,3.5vw,14px); line-height: 1.35; font-weight: 900; }
  .product-option-price { display: block; margin-top: 5px; color: var(--cat-primary); font: 900 11px var(--font-mono); }
  .selected-panel { margin-top: 18px; padding: 15px; border: 1px solid var(--cat-border); border-radius: 18px; background: var(--cat-card); }
  .selected-product-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .selected-product-image { flex: 0 0 72px; width: 72px; height: 72px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--cat-border); border-radius: 13px; background: var(--mm-surface); color: var(--cat-primary); font-size: 25px; }

  .field { margin-bottom: 12px; }

  .field input { width: 100%; box-sizing: border-box; padding: 12px 13px; border: 1px solid var(--cat-border); border-radius: 12px; background: var(--mm-surface); color: var(--cat-ink); font: 600 13px var(--font-display); }
  .field input:focus { border-color: var(--cat-primary); outline: 3px solid rgba(255, 212, 0,.14); }
  .form-error { min-height: 20px; margin: 5px 0 8px; color: var(--cat-danger); font-size: 12px; font-weight: 800; line-height: 1.5; }
  .action-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; padding: 14px; border-radius: 13px; font: 900 14px var(--font-display); cursor: pointer; transition: transform .15s ease,opacity .15s ease; }
  .action-btn:active { transform: scale(.985); }
  .confirm-btn { border: 0; background: var(--cat-primary); color: var(--cat-ink); }
  .cart-btn { margin-top: 9px; border: 1.5px solid var(--cat-primary); background: transparent; color: var(--cat-primary); }
  .product-instructions { margin-top: 16px; padding: 13px; border-right: 4px solid var(--cat-primary); border-radius: 11px; background: var(--mm-surface); color: var(--cat-ink); font-size: 12px; line-height: 1.75; }
  .product-instructions strong { display: block; margin-bottom: 5px; color: var(--cat-primary); }
  .fixed-price-bar { position: fixed; right: 0; bottom: 0; left: 0; z-index: 90; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; padding: 12px 18px calc(12px + env(safe-area-inset-bottom,0px)); border-top: 1px solid var(--cat-border); background: rgba(255,255,255,.96); box-shadow: 0 -8px 24px rgba(31,34,43,.08); backdrop-filter: blur(10px); }
  .fixed-price-label { color: var(--cat-muted); font-size: 11px; font-weight: 800; }
  .fixed-price-value { color: var(--cat-primary); font: 900 19px var(--font-mono); }
  .catalog-state { padding: 46px 20px; border: 1px dashed var(--cat-border); border-radius: 18px; background: var(--cat-card); text-align: center; }
  .catalog-state i { margin-bottom: 10px; color: var(--cat-primary); font-size: 28px; }
  .catalog-state h3 { margin-bottom: 5px; color: var(--cat-ink); font-size: 16px; }
  .catalog-state p { color: var(--cat-muted); font-size: 13px; }
  @media (max-width:380px) { .option-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }

  .qty-stepper { display: flex; align-items: center; gap: 12px; margin: 16px 0 4px; }
  .qty-stepper-label { display: flex; align-items: center; gap: 6px; color: var(--cat-ink); font-size: 12px; font-weight: 900; }
  .qty-stepper-label i { color: var(--cat-primary); }
  .qty-stepper-controls { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .qty-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1.5px solid var(--cat-primary); background: var(--mm-surface); color: var(--cat-primary); font-size: 18px; font-weight: 800; line-height: 1; cursor: pointer; transition: transform .12s ease,opacity .12s ease; }
  .qty-btn:hover,.qty-btn:focus-visible { outline: 3px solid rgba(255, 212, 0,.13); outline-offset: 1px; }
  .qty-btn:active { transform: scale(.92); }
  .qty-btn:disabled { opacity: .35; cursor: not-allowed; border-color: var(--cat-border); color: var(--cat-muted); }
  .qty-value { min-width: 30px; text-align: center; font: 900 16px var(--font-mono); color: var(--cat-ink); }
  .qty-price-summary { display: flex; flex-wrap: wrap; gap: 12px; margin: 2px 0 4px; font-size: 11px; color: var(--cat-muted); font-weight: 800; }
  .qty-price-summary b { font-family: var(--font-mono); color: var(--cat-ink); }
  .qty-price-summary .qty-total b { color: var(--cat-primary); }
</style>
