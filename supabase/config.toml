# MEEM STORE — Supabase project config
# ملاحظة: project_id هو مرجع مشروع Supabase (Project Ref).
project_id = "rglbfizqolrenwfsndyv"

# =========================================================================
# Edge Function: process-receipt
# =========================================================================
# بوابة Supabase تسمح بطلب OPTIONS ثم تتحقق من JWT في POST.
# تم التحقق من ذلك فعلياً على النشر الإنتاجي.
[functions.process-receipt]
verify_jwt = true

# المساعد متاح للزائر لأسئلة المنتجات. الدالة تتحقق من JWT اختياريًا
# وتفرض rate limiting خادميًا على المستخدم أو عنوان الشبكة.
[functions.chat-assistant]
verify_jwt = false

# Telegram has no Supabase user JWT. The handler instead requires the webhook
# secret AND an exact numeric owner ID/private chat. Missing settings fail closed.
[functions.telegram-admin]
verify_jwt = false
